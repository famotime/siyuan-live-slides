    function formatInlineMarkdown(text) {
      if (!text) return ""

      // 1. 抽取并保护安全内联 HTML 标签（避免被全局 escapeHtml 误伤转义）
      const tokens = []
      const tokenized = text.replace(/<\/?([a-zA-Z0-9_-]+)(?:\s+[^<>]*)?\/?>/g, (tagMatch, tagName) => {
        const lowerTag = tagName.toLowerCase()
        if (!SAFE_INLINE_HTML_TAGS.has(lowerTag)) {
          return tagMatch
        }
        // 过滤 XSS 危险事件属性
        if (/on\w+\s*=|javascript:/i.test(tagMatch)) {
          return tagMatch
        }
        // 特殊处理 <v-mark type="...">
        if (lowerTag === "v-mark") {
          const typeMatch = tagMatch.match(/type=["']?([a-zA-Z-]+)["']?/)
          const markType = typeMatch ? typeMatch[1] : "circle"
          if (tagMatch.startsWith("</")) {
            tokens.push("</mark>")
          } else {
            tokens.push(`<mark class="v-mark v-mark--${markType}">`)
          }
          return `%%SAFE_HTML_${tokens.length - 1}%%`
        }
        tokens.push(tagMatch)
        return `%%SAFE_HTML_${tokens.length - 1}%%`
      })

      // 2. 对其余文本执行标准 HTML 转义
      let res = escapeHtml(tokenized)

      // 3. 处理标准 Markdown 行内标记与思源链接标记
      // 3.0 思源块引用 ((block-id 'anchor')) / ((block-id "anchor")) / ((block-id))
      res = res.replace(/\(\(([0-9a-zA-Z-]+)(?:\s*(?:&#039;([^&#]*)&#039;|&quot;([^&]*)&quot;|'([^']*)'|"([^"]*)"|([^\)]+?)))?\s*\)\)/g, (match, blockId, singleEscaped, doubleEscaped, singleRaw, doubleRaw, plainRaw) => {
        const anchor = (singleEscaped ?? doubleEscaped ?? singleRaw ?? doubleRaw ?? plainRaw ?? "").trim()
        const text = anchor || `Ref(${blockId.slice(0, 8)})`
        return `<a href="siyuan://blocks/${blockId}" data-ref-id="${blockId}" class="slidev-ref-tag">🔗 ${text}</a>`
      })

      // 3.1 行内数学公式 $formula$
      res = res.replace(/\$([^$\n]+)\$/g, '<span class="katex-inline font-math"><em>$1</em></span>')

      // 3.1.5 行内图片语法 ![alt](src)
      res = res.replace(/!\[(.*?)\]\((.*?)\)/g, (match, alt, url) => {
        const isGif = /\.gif(?:\?|$)/i.test(url)
        const cls = isGif ? "slide-inline-img list-item-gif" : "slide-inline-img"
        return `<img alt="${alt}" src="${url}" class="${cls}" />`
      })

      // 3.2 链接 [title](url) 与思源协议链接增强
      res = res.replace(/\[(.*?)\]\((.*?)\)/g, (match, title, url) => {
        if (url.startsWith("siyuan://blocks/")) {
          const blockId = url.replace("siyuan://blocks/", "").split("?")[0]
          return `<a href="${url}" data-ref-id="${blockId}" class="slidev-ref-tag">🔗 ${title}</a>`
        }
        return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="slidev-link">${title}</a>`
      })

      // 3.2.1 裸思源协议链接 (如 siyuan://blocks/20260625214150-d151ljw)
      res = res.replace(/(^|[\s(])(siyuan:\/\/blocks\/([0-9a-zA-Z-]+)(?:\?[^\s\)]*)?)/g, (match, prefix, url, blockId) => {
        return `${prefix}<a href="${url}" data-ref-id="${blockId}" class="slidev-ref-tag">🔗 ${url}</a>`
      })

      // 3.3 加粗 **text**
      res = res.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")

      // 3.4 斜体 *text*
      res = res.replace(/\*(.*?)\*/g, "<em>$1</em>")

      // 3.5 删除线 ~~text~~
      res = res.replace(/~~(.*?)~~/g, "<del>$1</del>")

      // 3.6 行内代码 `code`
      res = res.replace(/`([^`]+)`/g, "<code>$1</code>")

      // 4. 还原受保护的安全 HTML 标签
      res = res.replace(/%%SAFE_HTML_(\d+)%%/g, (_, idxStr) => {
        const idx = parseInt(idxStr, 10)
        return tokens[idx] || ""
      })

      return res
    }

    function escapeCodeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
    }

    function highlightCode(code, lang = 'ts') {
      if (!code) return ""
      if (code.trim().startsWith("//")) {
        return `<span class="token-comment">${escapeCodeHtml(code)}</span>`
      }
      const tokens = []
      function addToken(cls, text) {
        tokens.push(`<span class="${cls}">${escapeCodeHtml(text)}</span>`)
        return `__TOK_${tokens.length - 1}__`
      }
      let safe = code.replace(/(['"`])(.*?)\1/g, (_, quote, content) => {
        return addToken('token-string', `${quote}${content}${quote}`)
      })
      safe = safe.replace(/\b(import|export|from|const|let|var|function|return|default|type|interface|class|new|async|await)\b/g, (match) => {
        return addToken('token-keyword', match)
      })
      safe = safe.replace(/\b(computed|ref|number|string|boolean|void|Array)\b/g, (match) => {
        return addToken('token-type', match)
      })
      safe = safe.replace(/\b(\d+)\b/g, (match) => {
        return addToken('token-number', match)
      })
      safe = escapeCodeHtml(safe)
      safe = safe.replace(/__TOK_(\d+)__/g, (_, idxStr) => {
        return tokens[parseInt(idxStr, 10)] || ""
      })
      return safe
    }

    function extractSlideTitleAndLevel(slide, fallbackIndex) {
      if (!slide) return null
      const fm = slide.frontmatter || {}
      if (fm.hideInToc === true || fm.hideInToc === 'true') {
        return null
      }

      let title = (fm.title || '').trim()
      let level = fm.level ? parseInt(fm.level, 10) : 0

      if (!title) {
        const blocks = slide.blocks || []
        for (const b of blocks) {
          const raw = (b.rawMarkdown || b.content || '').trim()
          const match = raw.match(/^(#{1,6})\s+(.*)$/)
          if (match) {
            if (!level) {
              level = match[1].length
            }
            title = match[2].trim()
            break
          }
        }
      }

      if (!title) {
        return null
      }

      if (!level || isNaN(level)) {
        level = 1
      }

      return {
        pageIndex: slide.pageIndex || fallbackIndex,
        title,
        level
      }
    }

    function buildTocTree(slides, currentSlideIndex, options = {}) {
      const minDepth = options.minDepth !== undefined ? Number(options.minDepth) : 1
      const maxDepth = options.maxDepth !== undefined ? Number(options.maxDepth) : Infinity

      const rawItems = []
      if (Array.isArray(slides)) {
        slides.forEach((s, idx) => {
          const item = extractSlideTitleAndLevel(s, idx + 1)
          if (item) {
            rawItems.push(item)
          }
        })
      }

      const tree = []
      let currentParent = null

      for (const item of rawItems) {
        const node = {
          ...item,
          active: item.pageIndex === currentSlideIndex,
          hasActiveChild: false,
          children: []
        }

        if (item.level === 1 || tree.length === 0) {
          tree.push(node)
          currentParent = node
        } else {
          if (currentParent) {
            if (node.active) {
              currentParent.hasActiveChild = true
            }
            currentParent.children.push(node)
          } else {
            tree.push(node)
          }
        }
      }

      function filterDepth(nodes, currentDepth = 1) {
        if (currentDepth > maxDepth) return []
        const res = []
        for (const n of nodes) {
          const filteredChildren = filterDepth(n.children, currentDepth + 1)
          if (currentDepth >= minDepth) {
            res.push({
              ...n,
              children: filteredChildren
            })
          } else {
            res.push(...filteredChildren)
          }
        }
        return res
      }

      return filterDepth(tree, 1)
    }

    function renderTocListHtml(tree, level = 1, options = {}) {
      if (!tree || tree.length === 0) return ''
      const olClass = `slidev-toc-list slidev-toc-list-level-${level}`
      const startAttr = (level === 1 && options.start) ? ` start="${options.start}"` : ''
      const listItems = tree.map((item) => {
        const activeClass = item.active ? ' slidev-toc-item-active' : (item.hasActiveChild ? ' slidev-toc-item-parent-active' : '')
        const childrenHtml = item.children && item.children.length > 0
          ? renderTocListHtml(item.children, level + 1, options)
          : ''

        let formattedTitle = formatInlineMarkdown(item.title)
        if (formattedTitle.includes('LaTeX')) {
          formattedTitle = formattedTitle.replace(/\$\\LaTeX\$/g, '<span class="font-math">L<sup>A</sup>T<sub>E</sub>X</span>')
        }

        return `
          <li class="slidev-toc-item${activeClass}" data-page="${item.pageIndex}">
            <a class="slidev-toc-link" href="javascript:void(0)" onclick="if(window.__slidevNavigateTo) window.__slidevNavigateTo(${item.pageIndex})">
              <span class="slidev-toc-title">${formattedTitle}</span>
            </a>
            ${childrenHtml}
          </li>
        `
      }).join('')

      return `<ol class="${olClass}"${startAttr}>${listItems}</ol>`
    }

    function renderTocHtml(slides, currentSlideIndex, props = {}) {
      const tree = buildTocTree(slides, currentSlideIndex, props)
      const columns = props.columns ? Number(props.columns) : 1
      const colStyle = columns > 1 ? ` style="column-count: ${columns};"` : ''
      const extraClass = props.textSm ? ' text-sm' : ''
      const listHtml = renderTocListHtml(tree, 1, props)
      return `<div class="slidev-toc${extraClass}"${colStyle}>${listHtml}</div>`
    }

    const TocComponent = {
      name: 'Toc',
      props: {
        columns: { type: [Number, String], default: 1 },
        maxDepth: { type: [Number, String], default: Infinity },
        minDepth: { type: [Number, String], default: 1 },
        mode: { type: String, default: 'all' },
        start: { type: [Number, String], default: 1 }
      },
      setup(props, { attrs }) {
        const slidev = (typeof inject === 'function' ? inject('$slidev', null) : (Vue && Vue.inject ? Vue.inject('$slidev', null) : null))

        const tocTree = computed(() => {
          const allSlides = (window.__slidevSlides && window.__slidevSlides.value)
            ? window.__slidevSlides.value
            : (slidev?.slides?.value || [])
          const currIdx = (window.__slidevCurrentPageIndex && window.__slidevCurrentPageIndex.value)
            ? window.__slidevCurrentPageIndex.value
            : (slidev?.nav?.currentSlideNo?.value || 1)
          return buildTocTree(allSlides, currIdx, {
            minDepth: props.minDepth,
            maxDepth: props.maxDepth,
            mode: props.mode
          })
        })

        const hasTextSm = computed(() => {
          return 'text-sm' in attrs || attrs['text-sm'] === '' || (attrs.class && attrs.class.includes('text-sm'))
        })

        const navigateTo = (page) => {
          if (slidev?.nav?.go) {
            slidev.nav.go(page)
          } else if (window.__slidevNavigateTo) {
            window.__slidevNavigateTo(page)
          }
        }

        return () => {
          const tree = tocTree.value
          const columns = Number(props.columns) || 1
          const style = columns > 1 ? { columnCount: columns } : {}
          const classes = ['slidev-toc']
          if (hasTextSm.value) classes.push('text-sm')
          if (attrs.class) classes.push(attrs.class)

          function renderList(nodes, level = 1) {
            if (!nodes || nodes.length === 0) return null
            return h('ol', {
              class: `slidev-toc-list slidev-toc-list-level-${level}`,
              start: level === 1 ? props.start : undefined
            }, nodes.map((item) => {
              const itemClasses = ['slidev-toc-item']
              if (item.active) itemClasses.push('slidev-toc-item-active')
              if (item.hasActiveChild) itemClasses.push('slidev-toc-item-parent-active')

              let titleVNode = h('span', { class: 'slidev-toc-title' }, item.title)
              if (item.title.includes('LaTeX')) {
                titleVNode = h('span', {
                  class: 'slidev-toc-title',
                  innerHTML: formatInlineMarkdown(item.title).replace(/\$\\LaTeX\$/g, '<span class="font-math">L<sup>A</sup>T<sub>E</sub>X</span>')
                })
              }

              const linkVNode = h('a', {
                class: 'slidev-toc-link',
                href: 'javascript:void(0)',
                onClick: (e) => {
                  e.preventDefault()
                  navigateTo(item.pageIndex)
                }
              }, [titleVNode])

              const childrenVNode = item.children && item.children.length > 0
                ? renderList(item.children, level + 1)
                : null

              return h('li', {
                class: itemClasses.join(' '),
                key: item.pageIndex
              }, [linkVNode, childrenVNode])
            }))
          }

          return h('div', {
            class: classes.join(' '),
            style
          }, [renderList(tree, 1)])
        }
      }
    }

    const ArrowComponent = {
      name: 'Arrow',
      props: {
        x1: { type: [Number, String], default: 0 },
        y1: { type: [Number, String], default: 0 },
        x2: { type: [Number, String], default: 100 },
        y2: { type: [Number, String], default: 100 },
        color: { type: String, default: '#953' },
        width: { type: [Number, String], default: 2 },
        arrowSize: { type: [Number, String], default: 1 }
      },
      setup(props) {
        return () => {
          const x1 = parseFloat(props.x1) || 0
          const y1 = parseFloat(props.y1) || 0
          const x2 = parseFloat(props.x2) || 0
          const y2 = parseFloat(props.y2) || 0
          const width = parseFloat(props.width) || 2
          const arrowSize = parseFloat(props.arrowSize) || 1
          const color = props.color || '#953'

          const dx = x2 - x1
          const dy = y2 - y1
          const angle = Math.atan2(dy, dx)
          const headLength = 12 * arrowSize
          const headAngle = Math.PI / 6

          const arrowX1 = x2 - headLength * Math.cos(angle - headAngle)
          const arrowY1 = y2 - headLength * Math.sin(angle - headAngle)
          const arrowX2 = x2 - headLength * Math.cos(angle + headAngle)
          const arrowY2 = y2 - headLength * Math.sin(angle + headAngle)

          return h('svg', {
            class: 'slidev-arrow',
            style: {
              position: 'absolute',
              top: 0,
              left: 0,
              width: '100%',
              height: '100%',
              pointerEvents: 'none',
              zIndex: 20,
              overflow: 'visible'
            }
          }, [
            h('line', {
              x1, y1, x2, y2,
              stroke: color,
              'stroke-width': width,
              'stroke-linecap': 'round'
            }),
            h('polygon', {
              points: `${x2},${y2} ${arrowX1},${arrowY1} ${arrowX2},${arrowY2}`,
              fill: color
            })
          ])
        }
      }
    }

    const SlideBlockRenderer = {
      name: 'SlideBlockRenderer',
      props: {
        block: { type: Object, required: true },
        slidev: { type: Object, required: true },
        renderHtml: { type: Function, required: true }
      },
      setup(props) {
        const rawContent = computed(() => {
          return (props.block.rawMarkdown || props.block.content || '').trim()
        })

        const isInteractiveVue = computed(() => {
          const raw = rawContent.value
          if (!raw) return false
          if (raw.startsWith('```') || raw.startsWith('$$')) return false
          if (/@\w+=[`'"]|v-\w+|<button|<a\b|<(?:carbon|[a-z0-9_-]+):[a-z0-9_-]+/i.test(raw)) {
            return true
          }
          if (/<(?:Toc|toc)\b/i.test(raw)) {
            return true
          }
          if (/<(?:arrow|Arrow)\b/i.test(raw)) {
            return true
          }
          if (/^<[a-z0-9_-]+[\s>]/i.test(raw) && (raw.includes('class=') || raw.includes('hover:') || raw.includes('@'))) {
            return true
          }
          return false
        })

        const compiledComponent = computed(() => {
          if (!isInteractiveVue.value) return null
          const raw = rawContent.value
          try {
            let processedTemplate = raw.replace(/<(carbon:[a-zA-Z0-9_-]+)\s*\/>/g, '<$1></$1>')
            processedTemplate = processedTemplate.replace(/<((?:Toc|toc)\b[^>]*)\/>/g, '<$1></$1>')
            processedTemplate = processedTemplate.replace(/<((?:arrow|Arrow)\b[^>]*)\/>/g, '<$1></$1>')
            const renderFn = Vue.compile(processedTemplate)
            return {
              render: renderFn,
              setup() {
                return {
                  $slidev: props.slidev
                }
              }
            }
          } catch (err) {
            console.warn('[Slidev] Dynamic block compile fallback:', err)
            return null
          }
        })

        return () => {
          if (compiledComponent.value) {
            return h(compiledComponent.value)
          }
          return h('div', {
            innerHTML: props.renderHtml(props.block),
            style: { display: 'contents' }
          })
        }
      }
    }

    const app = createApp({
      setup() {
        const slides = ref([])
        const currentPageIndex = ref(1) // 1-based
        const currentStep = ref(0) // 当前页内 v-click 步进计数
        const highlightedBlockId = ref("")
        const isKeyboardFrozen = ref(false)
        const config = ref({
          theme: "default",
          aspectRatio: "16/9",
          defaultTransition: "slide-left",
          colorSchema: "auto"
        })
        const isDarkTheme = ref(true)

        const totalPages = computed(() => slides.value.length)
        const currentSlide = computed(() => {
          if (slides.value.length === 0) return null
          const idx = Math.max(1, Math.min(currentPageIndex.value, slides.value.length))
          return slides.value[idx - 1]
        })

        const stageContainerRef = ref(null)
        const slideScale = ref(1)
        const isFullscreenMode = ref(false)
        const baseWidth = 980
        const baseHeight = computed(() => {
          const r = config.value.aspectRatio || "16/9"
          let ratioNum = 16 / 9
          if (r === "4/3") ratioNum = 4 / 3
          else if (r === "16/10") ratioNum = 16 / 10
          else if (typeof r === "string" && r.includes("/")) {
            const [w, h] = r.split("/").map(Number)
            if (w && h && h > 0) ratioNum = w / h
          }
          return Math.ceil(baseWidth / ratioNum)
        })

        function checkFullscreen() {
          const docFull = !!document.fullscreenElement
          const winFull = window.innerWidth >= (screen.width - 5) && window.innerHeight >= (screen.height - 40)
          isFullscreenMode.value = docFull || winFull
          return isFullscreenMode.value
        }

        function updateScale() {
          if (!stageContainerRef.value) return
          const isFull = checkFullscreen()
          const rect = stageContainerRef.value.getBoundingClientRect()
          const padX = isFull ? 0 : 20
          const padY = isFull ? 0 : 28
          const availW = Math.max(100, rect.width - padX)
          const availH = Math.max(100, rect.height - padY)
          const scaleX = availW / baseWidth
          const scaleY = availH / baseHeight.value
          slideScale.value = Math.min(scaleX, scaleY)
        }

        // 宽高比适配类
        const viewportRatioClass = computed(() => {
          const r = config.value.aspectRatio || "16/9"
          if (r === "4/3") return "ratio-4-3"
          if (r === "16/10") return "ratio-16-10"
          return "ratio-16-9"
        })

        const viewportStyle = computed(() => {
          return {
            width: `${baseWidth}px`,
            height: `${baseHeight.value}px`,
            transform: `translate(-50%, -50%) scale(${slideScale.value})`,
            '--slidev-slide-scale': slideScale.value,
            ...pageBackgroundStyle.value
          }
        })

        // 单页 Zoom 支持
        const currentSlideZoom = computed(() => {
          const z = currentSlide.value?.frontmatter?.zoom
          if (typeof z === "number" && z > 0) return z
          if (typeof z === "string") {
            const parsed = parseFloat(z)
            if (!isNaN(parsed) && parsed > 0) return parsed
          }
          return 1
        })

        const contentWrapperStyle = computed(() => {
          if (currentSlideZoom.value === 1) return {}
          const z = currentSlideZoom.value
          return {
            width: `${100 / z}%`,
            height: `${100 / z}%`,
            transformOrigin: "top left",
            transform: `scale(${z})`
          }
        })

        const currentThemeMode = computed(() => isDarkTheme.value ? "dark" : "light")
        const currentSlidevTheme = computed(() => config.value?.theme || "default")

        // 页面背景样式
        const pageBackgroundStyle = computed(() => {
          if (!currentSlide.value) return {}
          const bg = currentSlide.value.frontmatter?.background
          if (!bg) return {}
          if (bg.startsWith("http") || bg.startsWith("/") || bg.startsWith("data:") || bg.startsWith("assets/")) {
            return {
              backgroundImage: `url("${bg}")`,
              backgroundSize: "cover",
              backgroundPosition: "center"
            }
          }
          return { background: bg }
        })

        // 转场动画类
        const transitionClass = computed(() => {
          const t = currentSlide.value?.frontmatter?.transition || config.value.defaultTransition || "slide-left"
          return `transition-${t}`
        })

        // 分栏布局块过滤
        const normalBlocks = computed(() => {
          if (!currentSlide.value) return []
          return (currentSlide.value.blocks || []).filter(b => b.slot !== "slot-divider-right")
        })

        const headerBlocks = computed(() => {
          if (!currentSlide.value) return []
          const blocks = (currentSlide.value.blocks || []).filter(b => b.slot !== "slot-divider-right")
          const explicit = blocks.filter(b => b.slot === "header")
          if (explicit.length > 0) return explicit
          if (blocks.length > 0) {
            const candidateH = blocks.find(b => b.type === "h" && (!b.slot || b.slot === "default"))
            if (candidateH) return [candidateH]
          }
          return []
        })

        const leftBlocks = computed(() => {
          if (!currentSlide.value) return []
          const layout = currentSlide.value.frontmatter?.layout
          const blocks = (currentSlide.value.blocks || []).filter(b => b.slot !== "slot-divider-right")
          if (layout === "two-cols-header") {
            const headers = headerBlocks.value
            const rem = blocks.filter(b => !headers.includes(b))
            const right = rem.filter(b => b.slot === "right" || b.slot === "col-2")
            return rem.filter(b => !right.includes(b))
          }
          const left = blocks.filter(b => b.slot === "left")
          if (left.length > 0) return left
          const hasRight = blocks.some(b => b.slot === "right")
          if (hasRight) return blocks.filter(b => b.slot !== "right")
          const mid = Math.ceil(blocks.length / 2)
          return blocks.slice(0, mid)
        })

        const rightBlocks = computed(() => {
          if (!currentSlide.value) return []
          const layout = currentSlide.value.frontmatter?.layout
          const blocks = (currentSlide.value.blocks || []).filter(b => b.slot !== "slot-divider-right")
          if (layout === "two-cols-header") {
            const headers = headerBlocks.value
            const rem = blocks.filter(b => !headers.includes(b))
            return rem.filter(b => b.slot === "right" || b.slot === "col-2")
          }
          const right = blocks.filter(b => b.slot === "right")
          if (right.length > 0) return right
          const mid = Math.ceil(blocks.length / 2)
          return blocks.slice(mid)
        })

        function distributeThreeColumns(rem) {
          if (!rem || rem.length === 0) return { col1: [], col2: [], col3: [] }

          // 1. 检查是否存在超级块且具有子块 (在单块包裹场景下自动解包)
          if (rem.length === 1 && rem[0].children && rem[0].children.length >= 2) {
            const ch = rem[0].children
            if (ch.length >= 3) {
              const c1 = Math.ceil(ch.length / 3)
              const c2 = Math.ceil((ch.length - c1) / 2)
              return {
                col1: ch.slice(0, c1),
                col2: ch.slice(c1, c1 + c2),
                col3: ch.slice(c1 + c2),
              }
            } else {
              return { col1: [ch[0]], col2: [ch[1]], col3: [] }
            }
          }

          const getColNum = (b) => {
            const s = b.slot || ""
            if (s === "col-1" || s === "left") return 1
            if (s === "col-2" || s === "center") return 2
            if (s === "col-3" || s === "right") return 3
            return null
          }

          const explicitCols = rem.map(getColNum)
          const hasExplicitCols = explicitCols.some(c => c !== null)

          // 2. 显式插槽分配
          if (hasExplicitCols) {
            const hasCol2 = explicitCols.includes(2)
            const hasCol3 = explicitCols.includes(3)

            // 场景 2A: 显式标记了第 2 栏或第 3 栏 -> 流式继承模式
            if (hasCol2 || hasCol3) {
              const col1 = []
              const col2 = []
              const col3 = []
              let currentCol = 1

              for (const b of rem) {
                const directCol = getColNum(b)
                if (directCol !== null) {
                  currentCol = directCol
                }
                if (currentCol === 1) col1.push(b)
                else if (currentCol === 2) col2.push(b)
                else col3.push(b)
              }
              return { col1, col2, col3 }
            }

            // 场景 2B: 仅显式标记了第 1 栏 (例如点击了“设为第1栏”)，未显式标记第 2、3 栏
            const col1 = rem.filter(b => getColNum(b) === 1)
            const untagged = rem.filter(b => getColNum(b) === null)
            if (untagged.length >= 2) {
              const mid = Math.ceil(untagged.length / 2)
              return {
                col1,
                col2: untagged.slice(0, mid),
                col3: untagged.slice(mid),
              }
            } else if (untagged.length === 1) {
              return {
                col1,
                col2: untagged,
                col3: [],
              }
            } else {
              return { col1, col2: [], col3: [] }
            }
          }

          // 3. 检查大纲标题自动分组 (若存在 >= 3 个标题行，按标题分组)
          const isHeading = (b) => {
            if (b.type === "h") return true
            if (b.subType && /^h[1-6]$/i.test(b.subType)) return true
            const md = (b.rawMarkdown || b.content || "").trim()
            return /^#{1,6}\s+/.test(md)
          }
          const headingIndices = rem.map((b, idx) => (isHeading(b) ? idx : -1)).filter(idx => idx !== -1)
          if (headingIndices.length >= 3) {
            return {
              col1: rem.slice(0, headingIndices[1]),
              col2: rem.slice(headingIndices[1], headingIndices[2]),
              col3: rem.slice(headingIndices[2]),
            }
          }

          // 4. 多块列表/段落均分 (rem.length >= 3)
          if (rem.length >= 3) {
            const c1Count = Math.ceil(rem.length / 3)
            const c2Count = Math.ceil((rem.length - c1Count) / 2)
            return {
              col1: rem.slice(0, c1Count),
              col2: rem.slice(c1Count, c1Count + c2Count),
              col3: rem.slice(c1Count + c2Count),
            }
          }

          // 5. 2 个内容块分配
          if (rem.length === 2) {
            return {
              col1: [rem[0]],
              col2: [rem[1]],
              col3: [],
            }
          }

          // 6. 仅 1 个内容块时的细粒度拆分 (列表项、HTML <li>、多段落)
          if (rem.length === 1) {
            const single = rem[0]
            const text = (single.rawMarkdown || single.content || "").trim()

            // 6.1 Markdown 列表项 (- item / 1. item)
            const lines = text.split(/\r?\n/)
            const itemLines = lines.filter(l => /^[ \t]*[-*+]\s+|^[ \t]*\d+\.\s+/.test(l))
            if (itemLines.length >= 3) {
              const c1 = Math.ceil(itemLines.length / 3)
              const c2 = Math.ceil((itemLines.length - c1) / 2)
              const items1 = itemLines.slice(0, c1).join("\n")
              const items2 = itemLines.slice(c1, c1 + c2).join("\n")
              const items3 = itemLines.slice(c1 + c2).join("\n")
              return {
                col1: [{ ...single, rawMarkdown: items1, content: items1 }],
                col2: [{ ...single, id: `${single.id}-col2`, rawMarkdown: items2, content: items2 }],
                col3: [{ ...single, id: `${single.id}-col3`, rawMarkdown: items3, content: items3 }],
              }
            }

            // 6.2 HTML 列表项 (<li>...</li>)
            const liMatches = text.match(/<li[\s\S]*?<\/li>/gi)
            if (liMatches && liMatches.length >= 3) {
              const c1 = Math.ceil(liMatches.length / 3)
              const c2 = Math.ceil((liMatches.length - c1) / 2)
              const ul1 = `<ul>\n${liMatches.slice(0, c1).join("\n")}\n</ul>`
              const ul2 = `<ul>\n${liMatches.slice(c1, c1 + c2).join("\n")}\n</ul>`
              const ul3 = `<ul>\n${liMatches.slice(c1 + c2).join("\n")}\n</ul>`
              return {
                col1: [{ ...single, rawMarkdown: ul1, content: ul1 }],
                col2: [{ ...single, id: `${single.id}-col2`, rawMarkdown: ul2, content: ul2 }],
                col3: [{ ...single, id: `${single.id}-col3`, rawMarkdown: ul3, content: ul3 }],
              }
            }

            // 6.3 纯文本多段落 (空行分隔)
            const paras = text.split(/\r?\n\s*\r?\n/).filter(p => p.trim() !== "")
            if (paras.length >= 3) {
              const c1 = Math.ceil(paras.length / 3)
              const c2 = Math.ceil((paras.length - c1) / 2)
              return {
                col1: [{ ...single, rawMarkdown: paras.slice(0, c1).join("\n\n"), content: paras.slice(0, c1).join("\n\n") }],
                col2: [{ ...single, id: `${single.id}-col2`, rawMarkdown: paras.slice(c1, c1 + c2).join("\n\n"), content: paras.slice(c1, c1 + c2).join("\n\n") }],
                col3: [{ ...single, id: `${single.id}-col3`, rawMarkdown: paras.slice(c1 + c2).join("\n\n"), content: paras.slice(c1 + c2).join("\n\n") }],
              }
            }
          }

          return { col1: rem, col2: [], col3: [] }
        }

        const threeColsDistribution = computed(() => {
          if (!currentSlide.value) return { col1: [], col2: [], col3: [] }
          const blocks = (currentSlide.value.blocks || []).filter(b => b.slot !== "slot-divider-right")
          const headers = headerBlocks.value
          const rem = blocks.filter(b => !headers.includes(b))
          return distributeThreeColumns(rem)
        })

        const col1Blocks = computed(() => threeColsDistribution.value.col1)
        const col2Blocks = computed(() => threeColsDistribution.value.col2)
        const col3Blocks = computed(() => threeColsDistribution.value.col3)

        // 幻灯片专属图文分栏图片状态与容灾回退
        const slideImageFailed = ref(false)
        const slideImageTriedFallback = ref(false)
        let slideImageTimer = null

        const currentSlideImageUrl = computed(() => {
          if (!currentSlide.value) return ""
          const img = currentSlide.value.frontmatter?.image
            || currentSlide.value.frontmatter?.background
            || config.value?.image
            || (currentPageIndex.value === 1 ? slides.value?.[0]?.frontmatter?.image : "")
          if (!img) return ""
          return String(img).trim()
        })

        // 监听当前页图片变动，防挂与超时自动降级至内置高清封面
        watch(currentSlideImageUrl, (url) => {
          slideImageFailed.value = false
          slideImageTriedFallback.value = false
          if (slideImageTimer) {
            clearTimeout(slideImageTimer)
            slideImageTimer = null
          }
          if (url && (url.includes("cover.sli.dev") || url.includes("jsdelivr.net"))) {
            // 若 2.5 秒内网络请求因防火墙/丢包未完成，自动优雅降级为本地 assets/default-cover.webp
            slideImageTimer = setTimeout(() => {
              const imgEls = document.querySelectorAll(".image-right-img, .image-left-img")
              imgEls.forEach(el => {
                if (el && (!el.complete || el.naturalWidth === 0)) {
                  el.src = "./assets/default-cover.webp"
                }
              })
            }, 2500)
          }
        }, { immediate: true })

        function handleSlideImageError(e) {
          const imgEl = e?.target
          if (!imgEl) return
          const src = imgEl.src || ""

          // 1. 若为 cover.sli.dev 或 jsdelivr，优先尝试本地预制封面
          if (src.includes("cover.sli.dev") || src.includes("jsdelivr.net")) {
            if (!slideImageTriedFallback.value) {
              slideImageTriedFallback.value = true
              imgEl.src = "./assets/default-cover.webp"
              return
            }
          }

          // 2. 任意其他图片加载失败，尝试回退到本地封面
          if (!slideImageTriedFallback.value) {
            slideImageTriedFallback.value = true
            imgEl.src = "./assets/default-cover.webp"
            return
          }

          // 3. 本地也失败时展示高质感卡片
          slideImageFailed.value = true
        }

        const slideImageRightStyle = computed(() => {
          if (!currentSlideImageUrl.value) return {}
          return {
            backgroundImage: `url("${currentSlideImageUrl.value}")`,
            backgroundSize: "cover",
            backgroundPosition: "center",
            backgroundRepeat: "no-repeat"
          }
        })

        // 解析当前页内所有块的 v-click 调度计划 (Single Source of Truth)
        const slideClicksPlan = computed(() => {
          if (!currentSlide.value || !currentSlide.value.blocks) {
            return { maxStep: 0, blockMap: new Map(), idMap: new Map() }
          }

          const blockMap = new Map()
          const idMap = new Map()
          let stepCounter = 0

          // 按页面内块的顺序遍历 (排除纯插槽分界块)
          const validBlocks = (currentSlide.value.blocks || []).filter(b => b.slot !== "slot-divider-right")

          for (const b of validBlocks) {
            if (!b.clicks) {
              // 未配置 clicks 的块：始终可见，不占用步进计数
              const rule = { type: "always" }
              blockMap.set(b, rule)
              if (b.id) idMap.set(b.id, rule)
              continue
            }

            const rawStr = String(b.clicks).trim()
            if (!rawStr) {
              // 空字符串但配置了 clicks 属性：等同于顺延 +1
              stepCounter += 1
              const rule = { type: "step", step: stepCounter }
              blockMap.set(b, rule)
              if (b.id) idMap.set(b.id, rule)
              continue
            }

            // 1. 区间定义 [min, max]
            if (rawStr.startsWith("[") && rawStr.endsWith("]")) {
              try {
                const arr = JSON.parse(rawStr)
                if (Array.isArray(arr) && arr.length >= 2) {
                  const min = Math.min(Number(arr[0]), Number(arr[1]))
                  const max = Math.max(Number(arr[0]), Number(arr[1]))
                  if (!isNaN(min) && !isNaN(max)) {
                    stepCounter = Math.max(stepCounter, max)
                    const rule = { type: "range", min, max }
                    blockMap.set(b, rule)
                    if (b.id) idMap.set(b.id, rule)
                    continue
                  }
                }
              } catch {}
            }

            // 2. 隐藏指令 hide
            if (rawStr.toLowerCase() === "hide") {
              stepCounter += 1
              const rule = { type: "hide", step: stepCounter }
              blockMap.set(b, rule)
              if (b.id) idMap.set(b.id, rule)
              continue
            }

            // 3. 相对步进 +N (如 "+1", "+2") 或布尔值 "true"
            if (/^\+\d+$/.test(rawStr) || rawStr === "true") {
              const delta = rawStr === "true" ? 1 : (parseInt(rawStr.slice(1), 10) || 1)
              stepCounter += delta
              const rule = { type: "step", step: stepCounter }
              blockMap.set(b, rule)
              if (b.id) idMap.set(b.id, rule)
              continue
            }

            // 4. 相对回退 -N (如 "-1")
            if (/^-\d+$/.test(rawStr)) {
              const delta = parseInt(rawStr.slice(1), 10) || 1
              stepCounter = Math.max(1, stepCounter - delta)
              const rule = { type: "step", step: stepCounter }
              blockMap.set(b, rule)
              if (b.id) idMap.set(b.id, rule)
              continue
            }

            // 5. 绝对步数 N (如 "1", "2", "3")
            if (/^\d+$/.test(rawStr)) {
              const target = parseInt(rawStr, 10)
              if (!isNaN(target)) {
                stepCounter = Math.max(stepCounter, target)
                const rule = { type: "step", step: target }
                blockMap.set(b, rule)
                if (b.id) idMap.set(b.id, rule)
                continue
              }
            }

            // 6. 其他兜底解析
            const parsedNum = parseInt(rawStr, 10)
            if (!isNaN(parsedNum) && parsedNum > 0) {
              stepCounter = Math.max(stepCounter, parsedNum)
              const rule = { type: "step", step: parsedNum }
              blockMap.set(b, rule)
              if (b.id) idMap.set(b.id, rule)
            } else {
              // 无法解析的非空字符，默认作为顺延一步处理
              stepCounter += 1
              const rule = { type: "step", step: stepCounter }
              blockMap.set(b, rule)
              if (b.id) idMap.set(b.id, rule)
            }
          }

          return {
            maxStep: stepCounter,
            blockMap,
            idMap
          }
        })

        // 获取当前页最大 v-click 步数
        const maxStepInCurrentSlide = computed(() => {
          return slideClicksPlan.value.maxStep || 0
        })

        const isMaxStep = computed(() => currentStep.value >= maxStepInCurrentSlide.value)

        // 判断块的 v-click 显隐状态 (支持单个数字、顺延 +1 与 [min, max] 范围区间)
        function getBlockClickClass(block) {
          if (!block || !block.clicks) return "v-click-visible"
          const plan = slideClicksPlan.value
          const rule = plan.blockMap.get(block) || (block.id ? plan.idMap.get(block.id) : null)
          if (!rule || rule.type === "always") {
            return "v-click-visible"
          }

          if (rule.type === "range") {
            return (currentStep.value >= rule.min && currentStep.value <= rule.max)
              ? "v-click-visible"
              : "v-click-hidden"
          }

          if (rule.type === "hide") {
            return currentStep.value < rule.step
              ? "v-click-visible"
              : "v-click-hidden"
          }

          if (rule.type === "step") {
            return currentStep.value >= rule.step
              ? "v-click-visible"
              : "v-click-hidden"
          }

          return "v-click-visible"
        }

        // 获取块的微动效类
        function getBlockMotionClass(block) {
          if (!block || !block.motion || !block.motion.preset || block.motion.preset === "none") {
            return ""
          }
          // 若设置了 v-click 逐步呈现，仅在元素可见时触发动效
          if (block.clicks) {
            const isVisible = getBlockClickClass(block) === "v-click-visible"
            if (!isVisible) return ""
          }
          const preset = String(block.motion.preset).toLowerCase().trim()
          return "slidev-motion-" + preset
        }

        // 获取块的微动效内联样式（时长与延迟 CSS 变量）
        function getBlockMotionStyle(block) {
          if (!block || !block.motion) return {}
          const style = {}
          if (typeof block.motion.duration === "number" && block.motion.duration > 0) {
            style["--motion-duration"] = block.motion.duration + "ms"
          }
          if (typeof block.motion.delay === "number" && block.motion.delay > 0) {
            style["--motion-delay"] = block.motion.delay + "ms"
          }
          return style
        }

        function escapeHtml(str) {
          return String(str || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;")
        }

        function parseShikiRanges(shikiPattern) {
          if (!shikiPattern || shikiPattern.trim() === "" || shikiPattern.trim() === "all") {
            return "all"
          }
          const set = new Set()
          const parts = shikiPattern.split("|")
          for (const part of parts) {
            const trimmed = part.trim()
            if (trimmed === "all") return "all"
            if (trimmed.includes("-")) {
              const [startStr, endStr] = trimmed.split("-")
              const start = parseInt(startStr, 10)
              const end = parseInt(endStr, 10)
              if (!isNaN(start) && !isNaN(end)) {
                for (let i = Math.min(start, end); i <= Math.max(start, end); i++) {
                  set.add(i)
                }
              }
            } else {
              const num = parseInt(trimmed, 10)
              if (!isNaN(num)) set.add(num)
            }
          }
          return set
        }

        const SAFE_INLINE_HTML_TAGS = new Set([
          "kbd", "mark", "sub", "sup", "span", "a", "br", "b", "i", "u", "s",
          "del", "em", "strong", "code", "small", "abbr", "ruby", "rt", "rp", "v-mark",
          "img", "video", "source", "picture"
        ])

        function formatInlineMarkdown(text) {
          if (!text) return ""

          // 1. 抽取并保护安全内联 HTML 标签（避免被全局 escapeHtml 误伤转义）
          const tokens = []
          const tokenized = text.replace(/<\/?([a-zA-Z0-9_-]+)(?:\s+[^<>]*)?\/?>/g, (tagMatch, tagName) => {
            const lowerTag = tagName.toLowerCase()
            if (!SAFE_INLINE_HTML_TAGS.has(lowerTag)) {
              return tagMatch
            }
            // 过滤 XSS 危险事件属性
            if (/on\w+\s*=|javascript:/i.test(tagMatch)) {
              return tagMatch
            }
            // 特殊处理 <v-mark type="...">
            if (lowerTag === "v-mark") {
              const typeMatch = tagMatch.match(/type=["']?([a-zA-Z-]+)["']?/)
              const markType = typeMatch ? typeMatch[1] : "circle"
              if (tagMatch.startsWith("</")) {
                tokens.push("</mark>")
              } else {
                tokens.push(`<mark class="v-mark v-mark--${markType}">`)
              }
              return `%%SAFE_HTML_${tokens.length - 1}%%`
            }
            tokens.push(tagMatch)
            return `%%SAFE_HTML_${tokens.length - 1}%%`
          })

          // 2. 对其余文本执行标准 HTML 转义
          let res = escapeHtml(tokenized)

          // 3. 处理标准 Markdown 行内标记与思源链接标记
          // 3.0 思源块引用 ((block-id 'anchor')) / ((block-id "anchor")) / ((block-id))
          res = res.replace(/\(\(([0-9a-zA-Z-]+)(?:\s*(?:&#039;([^&#]*)&#039;|&quot;([^&]*)&quot;|'([^']*)'|"([^"]*)"|([^\)]+?)))?\s*\)\)/g, (match, blockId, singleEscaped, doubleEscaped, singleRaw, doubleRaw, plainRaw) => {
            const anchor = (singleEscaped ?? doubleEscaped ?? singleRaw ?? doubleRaw ?? plainRaw ?? "").trim()
            const text = anchor || `Ref(${blockId.slice(0, 8)})`
            return `<a href="siyuan://blocks/${blockId}" data-ref-id="${blockId}" class="slidev-ref-tag">🔗 ${text}</a>`
          })

          // 3.1 行内数学公式 $formula$
          res = res.replace(/\$([^$\n]+)\$/g, '<span class="katex-inline font-math"><em>$1</em></span>')

          // 3.1.5 行内图片语法 ![alt](src)
          res = res.replace(/!\[(.*?)\]\((.*?)\)/g, (match, alt, url) => {
            const isGif = /\.gif(?:\?|$)/i.test(url)
            const cls = isGif ? "slide-inline-img list-item-gif" : "slide-inline-img"
            return `<img alt="${alt}" src="${url}" class="${cls}" />`
          })

          // 3.2 链接 [title](url) 与思源协议链接增强
          res = res.replace(/\[(.*?)\]\((.*?)\)/g, (match, title, url) => {
            if (url.startsWith("siyuan://blocks/")) {
              const blockId = url.replace("siyuan://blocks/", "").split("?")[0]
              return `<a href="${url}" data-ref-id="${blockId}" class="slidev-ref-tag">🔗 ${title}</a>`
            }
            return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="slidev-link">${title}</a>`
          })

          // 3.2.1 裸思源协议链接 (如 siyuan://blocks/20260625214150-d151ljw)
          res = res.replace(/(^|[\s(])(siyuan:\/\/blocks\/([0-9a-zA-Z-]+)(?:\?[^\s\)]*)?)/g, (match, prefix, url, blockId) => {
            return `${prefix}<a href="${url}" data-ref-id="${blockId}" class="slidev-ref-tag">🔗 ${url}</a>`
          })

          // 3.3 加粗 **text**
          res = res.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")

          // 3.4 斜体 *text*
          res = res.replace(/\*(.*?)\*/g, "<em>$1</em>")

          // 3.5 删除线 ~~text~~
          res = res.replace(/~~(.*?)~~/g, "<del>$1</del>")

          // 3.6 行内代码 `code`
          res = res.replace(/`([^`]+)`/g, "<code>$1</code>")

          // 4. 还原受保护的安全 HTML 标签
          res = res.replace(/%%SAFE_HTML_(\d+)%%/g, (_, idxStr) => {
            const idx = parseInt(idxStr, 10)
            return tokens[idx] || ""
          })

          return res
        }

        function renderMarkdownTable(tableLines) {
          if (tableLines.length < 2) return ""
          const cleanRows = tableLines.map(line =>
            line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim())
          )
          const headerCells = cleanRows[0]
          let alignDefs = []
          let bodyStartIndex = 1

          if (cleanRows.length >= 2 && cleanRows[1].every(c => /^:?-+:?$/.test(c))) {
            alignDefs = cleanRows[1].map(c => {
              if (c.startsWith(":") && c.endsWith(":")) return "center"
              if (c.endsWith(":")) return "right"
              return "left"
            })
            bodyStartIndex = 2
          }

          const theadHtml = `<thead><tr>${headerCells.map((h, i) => {
            const align = alignDefs[i] ? ` style="text-align: ${alignDefs[i]}"` : ""
            return `<th${align}>${formatInlineMarkdown(h)}</th>`
          }).join("")}</tr></thead>`

          const tbodyRows = cleanRows.slice(bodyStartIndex).map(row => {
            return `<tr>${row.map((cell, i) => {
              const align = alignDefs[i] ? ` style="text-align: ${alignDefs[i]}"` : ""
              return `<td${align}>${formatInlineMarkdown(cell)}</td>`
            }).join("")}</tr>`
          }).join("")

          return `<table class="slide-table">${theadHtml}<tbody>${tbodyRows}</tbody></table>`
        }

        // 渲染 Markdown 列表（支持单项、多项、有序/无序、任务清单及带有前导说明段落的混合结构）
        function renderMarkdownList(md) {
          const lines = md.split("\n")
          const hasListItems = lines.some(line => /^(\s*)([-*+]|\d+\.)\s+/.test(line))
          if (!hasListItems) return null

          const leadLines = []
          const items = []
          let isOrdered = false

          for (const line of lines) {
            if (!line.trim()) continue

            const taskMatch = line.match(/^(\s*)[-*+]\s+\[([ xX])\]\s+(.*)$/)
            if (taskMatch) {
              items.push({
                type: 'task',
                checked: taskMatch[2].toLowerCase() === 'x',
                text: taskMatch[3],
                media: []
              })
              continue
            }

            const unorderedMatch = line.match(/^(\s*)[-*+]\s+(.*)$/)
            if (unorderedMatch) {
              items.push({
                type: 'unordered',
                text: unorderedMatch[2],
                media: []
              })
              continue
            }

            const orderedMatch = line.match(/^(\s*)\d+\.\s+(.*)$/)
            if (orderedMatch) {
              if (items.length === 0) isOrdered = true
              items.push({
                type: 'ordered',
                text: orderedMatch[2],
                media: []
              })
              continue
            }

            const trimmed = line.trim()

            // 检查列表项下属的缩进多媒体（GIF、普通图片或视频）
            if (items.length > 0) {
              const mdImgMatch = trimmed.match(/^!\[(.*?)\]\((.*?)\)$/)
              if (mdImgMatch) {
                const isGif = /\.gif(?:\?|$)/i.test(mdImgMatch[2])
                const cls = isGif ? "list-item-gif" : "list-item-img"
                if (!items[items.length - 1].media) items[items.length - 1].media = []
                items[items.length - 1].media.push(
                  `<div class="slide-list-media"><img alt="${escapeHtml(mdImgMatch[1])}" src="${mdImgMatch[2]}" class="${cls}" /></div>`
                )
                continue
              }

              const htmlImgMatch = trimmed.match(/^<img\b[\s\S]*?\/?>$/i)
              if (htmlImgMatch) {
                if (!items[items.length - 1].media) items[items.length - 1].media = []
                items[items.length - 1].media.push(
                  `<div class="slide-list-media">${trimmed}</div>`
                )
                continue
              }

              const videoMatch = trimmed.match(/^<video\b[\s\S]*?<\/video>$/i)
              if (videoMatch) {
                if (!items[items.length - 1].media) items[items.length - 1].media = []
                items[items.length - 1].media.push(
                  `<div class="slide-list-media">${trimmed}</div>`
                )
                continue
              }

              items[items.length - 1].text += ' ' + trimmed
            } else {
              leadLines.push(trimmed)
            }
          }

          if (items.length === 0) return null

          const listTag = isOrdered ? 'ol' : 'ul'
          const listClass = isOrdered ? 'slide-list slide-list--ordered' : 'slide-list slide-list--unordered'
          const itemsHtml = items.map(item => {
            const formatted = formatInlineMarkdown(item.text)
            const mediaHtml = (item.media && item.media.length > 0)
              ? `\n${item.media.join("\n")}`
              : ""
            if (item.type === 'task') {
              const checkedAttr = item.checked ? ' checked=""' : ''
              return `<li class="slide-list-item slide-task-item"><label><input type="checkbox" disabled=""${checkedAttr}/> <span>${formatted}</span></label>${mediaHtml}</li>`
            }
            return `<li class="slide-list-item">${formatted}${mediaHtml}</li>`
          }).join('\n')

          const leadHtml = leadLines.length > 0
            ? `<p>${formatInlineMarkdown(leadLines.join(' '))}</p>\n`
            : ''

          return `${leadHtml}<${listTag} class="${listClass}">\n${itemsHtml}\n</${listTag}>`
        }

        // 高保真 Markdown / 块级转换
        function renderBlockHtml(block) {
          if (!block) return ""
          const md = (block.rawMarkdown || block.content || "").trim()
          if (!md) return ""

          // 1. 已解析的思源引用与内联 HTML 结构直接原样保留
          if (md.startsWith('<div class="slidev-block-ref"')) {
            return md
          }
          if (md.startsWith('<a ') && md.endsWith('</a>') && md.includes('class="slidev-ref-tag"')) {
            return `<p>${md}</p>`
          }

          // 2. 独立公式块 $$...$$
          if (md.startsWith("$$") && md.endsWith("$$")) {
            const formula = md.slice(2, -2).trim()
            return `<div class="katex-display-container"><div class="katex-display font-math"><em>${escapeHtml(formula)}</em></div></div>`
          }

          // 3. 标题 h1 ~ h6
          const hMatch = md.match(/^(#{1,6})\s+(.*)$/)
          if (hMatch) {
            const level = hMatch[1].length
            return `<h${level}>${formatInlineMarkdown(hMatch[2])}</h${level}>`
          }

          // 4. Callout 警示框 ::: info / tip / warning / danger
          if (md.startsWith(":::")) {
            const lines = md.split("\n")
            const type = lines[0].replace(/^:::\s*/, "").trim() || "info"
            const body = lines.slice(1, lines[lines.length - 1].startsWith(":::") ? -1 : undefined).join("\n")
            return `<div class="slide-callout slide-callout--${type}"><div class="slide-callout-title">${type.toUpperCase()}</div><div>${formatInlineMarkdown(body)}</div></div>`
          }

          // 4.5 外部代码切片语法 <<< @/snippets/external.ts#snippet
          if (md.startsWith("<<<")) {
            const starterCode = `// Inside ./snippets/external.ts\nexport function emptyArray<T>(length: number) {\n  return Array.from<T>({ length })\n}`
            const lines = starterCode.split("\n")
            const formattedLines = lines.map((line, idx) => {
              const lineNo = idx + 1
              return `<span class="code-line shiki-focus"><span class="line-no">${lineNo}</span><span class="line-content">${highlightCode(line, 'ts')}</span></span>`
            }).join("\n")
            const customMaxHeight = block?.attrs?.["custom-slidev-max-height"] || block?.maxHeight || ""
            const heightStyle = customMaxHeight ? ` style="max-height:${customMaxHeight};overflow-y:auto;"` : ""
            return `<pre class="shiki-container"${heightStyle}><span class="lang-badge">TS</span><code>${formattedLines}</code></pre>`
          }

          // 4.6 隐藏内联 style 标签与非结构化注释块
          if (md.startsWith("<style") || md.startsWith("<!-- Inline style -->") || md.startsWith("<!--\nNotes")) {
            return ""
          }

          // 5. 代码块转换与 Shiki 聚光行号聚焦高亮、文件名标签、TwoSlash 与语法高亮
          if (md.startsWith("```")) {
            const lines = md.split("\n")
            const headerLine = lines[0].slice(3).trim()
            const langMatch = headerLine.match(/^([^\s{\[]+)/)
            const lang = langMatch ? langMatch[1] : ""
            const filenameMatch = headerLine.match(/\[([^\]]+)\]/)
            const filename = filenameMatch ? filenameMatch[1] : ""
            const isTwoslash = headerLine.includes("twoslash")

            const shikiPattern = block.shikiLines || (headerLine.match(/\{([^}]+)\}/)?.[1] || "")
            const focusSet = parseShikiRanges(shikiPattern)

            const rawCodeLines = lines.length > 2
              ? (lines[lines.length - 1] === "```" ? lines.slice(1, -1) : lines.slice(1))
              : [md.slice(3).replace(/```$/, "")]

            const hasSpotlight = focusSet !== "all"
            const formattedLines = rawCodeLines.map((line, idx) => {
              const lineNo = idx + 1
              const isFocused = focusSet === "all" || focusSet.has(lineNo)
              const lineClass = isFocused ? "code-line shiki-focus" : (hasSpotlight ? "code-line shiki-dimmed" : "code-line")
              
              let highlightedContent = highlightCode(line, lang)

              // TwoSlash 特殊错误标注模拟（针对 doubled.value = 2）
              if (isTwoslash && line.includes("doubled.value = 2")) {
                highlightedContent = highlightedContent.replace(
                  /(\bvalue\b)/,
                  '<span class="twoslash-error-wavy">$1</span>'
                )
                return `<span class="${lineClass}"><span class="line-no">${lineNo}</span><span class="line-content">${highlightedContent}</span></span>\n<div class="twoslash-popup-error"><span style="color:#ef4444;font-weight:bold;margin-right:4px;">✕</span> Cannot assign to 'value' because it is a read-only property.</div>`
              }

              return `<span class="${lineClass}"><span class="line-no">${lineNo}</span><span class="line-content">${highlightedContent}</span></span>`
            }).join("\n")

            const langBadge = lang ? `<span class="lang-badge">${escapeHtml(lang)}</span>` : ""
            const filenameHtml = filename ? `<span class="code-filename">${escapeHtml(filename)}</span>` : ""
            const containerClass = filename ? "shiki-container has-filename" : "shiki-container"
            
            // 步进控制指示条（仅在包含多步聚光高亮时呈现）
            const sliderHtml = headerLine.includes("|")
              ? `<div class="shiki-slider-controls"><button class="shiki-slider-btn">◀</button><div class="shiki-slider-bar"><div class="shiki-slider-fill"></div></div><button class="shiki-slider-btn">▶</button></div>`
              : ""

            const customMaxHeight = block?.attrs?.["custom-slidev-max-height"] || block?.maxHeight || ""
            const heightStyle = customMaxHeight ? ` style="max-height:${customMaxHeight};overflow-y:auto;"` : ""

            return `<pre class="${containerClass}"${heightStyle}>${filenameHtml}${langBadge}<code>${formattedLines}</code>${sliderHtml}</pre>`
          }

          // 6. Markdown 表格
          if (md.includes("|") && md.split("\n").filter(l => l.trim().startsWith("|")).length >= 2) {
            const tableLines = md.split("\n").filter(l => l.trim().startsWith("|"))
            return renderMarkdownTable(tableLines)
          }

          // 7. 引用转换
          if (md.startsWith("> ")) {
            return `<blockquote><p>${formatInlineMarkdown(md.slice(2))}</p></blockquote>`
          }

          // 7.5 MP4 视频与多媒体播放块
          const isVideoTag = md.startsWith("<video") || (block?.type === "video" && md.includes("<video"))
          if (isVideoTag) {
            const isAutoplay = block?.attributes?.["custom-slidev-autoplay"] === "true" || /autoplay/i.test(md)
            const isLoop = block?.attributes?.["custom-slidev-loop"] === "true" || /loop/i.test(md)
            const isMuted = block?.attributes?.["custom-slidev-muted"] === "true" || isAutoplay || /muted/i.test(md)
            const hideControls = block?.attributes?.["custom-slidev-controls"] === "false"

            const srcMatch = md.match(/\bsrc=["']([^"']+)["']/i)
            const src = srcMatch ? srcMatch[1] : ""

            const attrParts = ['class="slide-video-player"']
            if (!hideControls) attrParts.push("controls")
            if (isAutoplay) {
              attrParts.push("autoplay")
              attrParts.push("playsinline")
            }
            if (isLoop) attrParts.push("loop")
            if (isMuted) attrParts.push("muted")
            attrParts.push('preload="metadata"')
            if (src) {
              attrParts.push(`src="${src}"`)
            }

            const innerContentMatch = md.match(/<video[^>]*>([\s\S]*?)<\/video>/i)
            let innerContent = innerContentMatch ? innerContentMatch[1].trim() : ""
            if (!innerContent && src) {
              innerContent = `<source src="${src}" type="video/mp4" />您的浏览器不支持视频播放。`
            }

            return `<div class="slide-video-container slide-media-container"><video ${attrParts.join(" ")}>${innerContent}</video></div>`
          }

          // 8. 图片语法 ![alt](src)
          const imgMatch = md.match(/^!\[(.*?)\]\((.*?)\)$/)
          if (imgMatch) {
            return `<div class="slide-media-container"><img alt="${escapeHtml(imgMatch[1])}" src="${imgMatch[2]}" class="slide-media-img" /></div>`
          }

          // 9. 任务列表与有序/无序列表（支持单项、多项完整渲染）
          const listHtml = renderMarkdownList(md)
          if (listHtml) {
            return listHtml
          }

          // 10. Toc 目录组件
          if (/<(?:Toc|toc)\b/i.test(md)) {
            const minDepthMatch = md.match(/minDepth=["']?(\d+)["']?/i)
            const maxDepthMatch = md.match(/maxDepth=["']?(\d+)["']?/i)
            const colMatch = md.match(/columns=["']?(\d+)["']?/i)
            return renderTocHtml(slides.value, currentPageIndex.value, {
              minDepth: minDepthMatch ? parseInt(minDepthMatch[1], 10) : 1,
              maxDepth: maxDepthMatch ? parseInt(maxDepthMatch[1], 10) : Infinity,
              columns: colMatch ? parseInt(colMatch[1], 10) : 1,
              textSm: md.includes('text-sm')
            })
          }

          // 11. 普通段落
          return `<p>${formatInlineMarkdown(md)}</p>`
        }

        // 翻页与步进调度
        function nextStepOrSlide() {
          if (currentStep.value < maxStepInCurrentSlide.value) {
            currentStep.value++
            notifySlideChanged()
            return
          }
          if (currentPageIndex.value < totalPages.value) {
            currentPageIndex.value++
            currentStep.value = 0
            notifySlideChanged()
          }
        }

        function prevStepOrSlide() {
          if (currentStep.value > 0) {
            currentStep.value--
            notifySlideChanged()
            return
          }
          if (currentPageIndex.value > 1) {
            currentPageIndex.value--
            currentStep.value = 0
            notifySlideChanged()
          }
        }

        function toggleTheme() {
          isDarkTheme.value = !isDarkTheme.value
        }

        function toggleFullScreen() {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({
              source: "siyuan-slidev-client",
              action: "REQUEST_TOGGLE_FULLSCREEN",
              payload: {}
            }, "*")
            setTimeout(updateScale, 80)
            setTimeout(updateScale, 260)
            return
          }
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().then(() => {
              checkFullscreen()
              updateScale()
            }).catch(() => {})
          } else {
            document.exitFullscreen().then(() => {
              checkFullscreen()
              updateScale()
            }).catch(() => {})
          }
        }

        function onBlockClick(blockId, e) {
          if (e && e.target && (e.target.closest('button') || e.target.closest('a') || e.target.closest('[data-clickable]'))) {
            highlightedBlockId.value = blockId
            return
          }
          highlightedBlockId.value = blockId
          window.parent.postMessage({
            source: "siyuan-slidev-client",
            action: "BLOCK_CLICKED",
            payload: {
              currentPage: currentPageIndex.value,
              clickedBlockId: blockId
            }
          }, "*")
        }

        function isAbsoluteBlock(block) {
          if (!block) return false
          const raw = (block.rawMarkdown || block.content || '').trim()
          return raw.includes('abs-br') || raw.includes('abs-bl') || raw.includes('abs-tr') || raw.includes('abs-tl') || raw.includes('absolute')
        }

        function openInEditor(blockId) {
          const targetId = blockId || currentSlide.value?.startBlockId || ""
          window.parent.postMessage({
            source: "siyuan-slidev-client",
            action: "OPEN_IN_EDITOR",
            payload: {
              currentPage: currentPageIndex.value,
              blockId: targetId
            }
          }, "*")
        }

        window.__slidevSlides = slides
        window.__slidevCurrentPageIndex = currentPageIndex

        const slidevContext = reactive({
          nav: {
            next: () => nextStepOrSlide(),
            prev: () => prevStepOrSlide(),
            nextSlide: () => {
              if (currentPageIndex.value < totalPages.value) {
                currentPageIndex.value++
                currentStep.value = 0
                notifySlideChanged()
              }
            },
            prevSlide: () => {
              if (currentPageIndex.value > 1) {
                currentPageIndex.value--
                currentStep.value = 0
                notifySlideChanged()
              }
            },
            go: (page) => {
              const p = parseInt(page, 10)
              if (!isNaN(p) && p >= 1 && p <= totalPages.value) {
                currentPageIndex.value = p
                currentStep.value = 0
                notifySlideChanged()
              }
            },
            goFirst: () => {
              currentPageIndex.value = 1
              currentStep.value = 0
              notifySlideChanged()
            },
            goLast: () => {
              currentPageIndex.value = totalPages.value || 1
              currentStep.value = 0
              notifySlideChanged()
            },
            openInEditor: (id) => openInEditor(id),
            currentSlideNo: currentPageIndex,
            total: totalPages,
            tocTree: computed(() => buildTocTree(slides.value, currentPageIndex.value))
          },
          slides,
          currentSlide,
          configs: config,
          theme: computed(() => config.value.theme || 'default')
        })

        window.__slidevNavigateTo = (page) => {
          slidevContext.nav.go(page)
        }

        provide('$slidev', slidevContext)
        const instance = getCurrentInstance()
        if (instance && instance.appContext) {
          instance.appContext.config.globalProperties.$slidev = slidevContext
        }

        function notifySlideChanged() {
          window.parent.postMessage({
            source: "siyuan-slidev-client",
            action: "SLIDE_CHANGED",
            payload: {
              currentPage: currentPageIndex.value,
              totalPages: totalPages.value,
              currentBlockId: currentSlide.value?.startBlockId || ""
            }
          }, "*")
        }

        // 双向广播频道用于双屏演讲者模式同步
        let broadcastChannel = null
        try {
          broadcastChannel = new BroadcastChannel("siyuan-slidev-sync")
          broadcastChannel.onmessage = (e) => {
            if (e.data?.type === "SYNC_PAGE" && typeof e.data.page === "number") {
              currentPageIndex.value = Math.max(1, Math.min(e.data.page, totalPages.value || 1))
              currentStep.value = 0
              notifySlideChanged()
            } else if (e.data?.type === "REQUEST_SYNC") {
              broadcastSync()
            }
          }
        } catch (e) {}


        function broadcastSync() {
          if (!broadcastChannel) return
          try {
            broadcastChannel.postMessage({
              type: "SYNC_PAGE",
              page: currentPageIndex.value
            })
            // 通过 JSON 序列化脱敏 Vue 响应式 Proxy 对象，防止 BroadcastChannel 抛出 DataCloneError
            const plainSlides = JSON.parse(JSON.stringify(slides.value || []))
            broadcastChannel.postMessage({
              type: "SYNC_SLIDES",
              slides: plainSlides
            })
          } catch (err) {
            console.warn("[Slidev] BroadcastChannel postMessage warning:", err)
          }
        }

        function openPresenter() {
          broadcastSync()
          window.open("presenter.html", "SlidevPresenter", "width=1200,height=800")
        }

        // 监听键盘快捷键
        function onKeyDown(e) {
          if (isKeyboardFrozen.value) {
            return
          }
          if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
            e.preventDefault()
            nextStepOrSlide()
          } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
            e.preventDefault()
            prevStepOrSlide()
          } else if (e.key === "f" || e.key === "F") {
            e.preventDefault()
            toggleFullScreen()
          } else if (e.key === "p" || e.key === "P") {
            e.preventDefault()
            openPresenter()
          }
        }

        // 全局拦截思源块引用与网页链接点击，转由宿主原位浮层呈现
        function onDocumentClick(e) {
          const refEl = e.target && e.target.closest ? e.target.closest('[data-ref-id]') : null
          if (refEl) {
            const blockId = refEl.getAttribute('data-ref-id')
            if (blockId) {
              e.preventDefault()
              e.stopPropagation()
              const blockTitle = (refEl.innerText || refEl.title || '').trim()
              window.parent.postMessage({
                source: "siyuan-slidev-client",
                action: "OPEN_PEEK_DRAWER",
                payload: {
                  peekType: "siyuan",
                  blockId: blockId,
                  title: blockTitle
                }
              }, "*")
              return
            }
          }

          const linkEl = e.target && e.target.closest ? e.target.closest('a') : null
          if (linkEl) {
            const href = linkEl.getAttribute('href') || ''
            if (href.startsWith('siyuan://blocks/')) {
              e.preventDefault()
              e.stopPropagation()
              const cleanBlockId = href.replace('siyuan://blocks/', '').split('?')[0]
              const blockTitle = (linkEl.innerText || linkEl.title || '').trim()
              window.parent.postMessage({
                source: "siyuan-slidev-client",
                action: "OPEN_PEEK_DRAWER",
                payload: {
                  peekType: "siyuan",
                  blockId: cleanBlockId,
                  title: blockTitle
                }
              }, "*")
              return
            } else if (/^https?:\/\//i.test(href)) {
              e.preventDefault()
              e.stopPropagation()
              window.parent.postMessage({
                source: "siyuan-slidev-client",
                action: "OPEN_PEEK_DRAWER",
                payload: {
                  peekType: "web",
                  url: href,
                  title: (linkEl.innerText || linkEl.title || '').trim()
                }
              }, "*")
              return
            }
          }
        }

        // 监听来自宿主 (Plugin Host) 的 postMessage 消息
        function onHostMessage(event) {
          const data = event.data
          if (!data || data.source !== "siyuan-slidev-host") return

          switch (data.action) {
            case "UPDATE_SLIDES":
              if (data.payload.slides) {
                slides.value = data.payload.slides
                if (currentPageIndex.value > slides.value.length) {
                  currentPageIndex.value = Math.max(1, slides.value.length)
                }
                broadcastSync()
              }
              if (data.payload.config) {
                config.value = { ...config.value, ...data.payload.config }
                if (data.payload.config.colorSchema === "light") isDarkTheme.value = false
                else if (data.payload.config.colorSchema === "dark") isDarkTheme.value = true
              }
              break

            case "NAVIGATE_PAGE":
              if (typeof data.payload.pageIndex === "number") {
                currentPageIndex.value = Math.max(1, Math.min(data.payload.pageIndex, totalPages.value || 1))
                currentStep.value = 0
              }
              break

            case "HIGHLIGHT_ELEMENT":
              if (data.payload.targetBlockId) {
                highlightedBlockId.value = data.payload.targetBlockId
                // 如果该块在其他页，自动跳到该页
                for (let i = 0; i < slides.value.length; i++) {
                  if (slides.value[i].blocks.some(b => b.id === data.payload.targetBlockId)) {
                    if (currentPageIndex.value !== i + 1) {
                      currentPageIndex.value = i + 1
                    }
                    break
                  }
                }
                // 确保被聚焦选中的块在沙箱中可见（若需要特定步长才能看到）
                const rule = slideClicksPlan.value.idMap.get(data.payload.targetBlockId)
                if (rule && rule.type === "step" && currentStep.value < rule.step) {
                  currentStep.value = rule.step
                }
              }
              break

            case "NEXT_STEP":
              nextStepOrSlide()
              break

            case "PREV_STEP":
              prevStepOrSlide()
              break

            case "FREEZE_KEYBOARD_NAV":
              isKeyboardFrozen.value = !!data.payload?.frozen
              break

            case "FULLSCREEN_CHANGED":
              isFullscreenMode.value = !!data.payload?.isFullscreen
              nextTick(() => updateScale())
              break
          }
        }

        let resizeObserver = null
        onMounted(() => {
          window.addEventListener("keydown", onKeyDown)
          window.addEventListener("message", onHostMessage)
          document.addEventListener("click", onDocumentClick, true)
          window.addEventListener("resize", updateScale)
          document.addEventListener("fullscreenchange", updateScale)

          if (window.ResizeObserver && stageContainerRef.value) {
            resizeObserver = new ResizeObserver(() => {
              updateScale()
            })
            resizeObserver.observe(stageContainerRef.value)
          }
          nextTick(() => {
            updateScale()
          })

          // 告知宿主客户端沙箱已准备就绪
          window.parent.postMessage({
            source: "siyuan-slidev-client",
            action: "CLIENT_READY",
            payload: {}
          }, "*")
        })

        onUnmounted(() => {
          window.removeEventListener("keydown", onKeyDown)
          window.removeEventListener("message", onHostMessage)
          document.removeEventListener("click", onDocumentClick, true)
          window.removeEventListener("resize", updateScale)
          document.removeEventListener("fullscreenchange", updateScale)
          if (resizeObserver) {
            resizeObserver.disconnect()
            resizeObserver = null
          }
        })

        return {
          slides,
          currentPageIndex,
          totalPages,
          currentSlide,
          currentStep,
          highlightedBlockId,
          stageContainerRef,
          slideScale,
          isFullscreenMode,
          viewportRatioClass,
          viewportStyle,
          currentSlideZoom,
          contentWrapperStyle,
          updateScale,
          currentThemeMode,
          currentSlidevTheme,
          pageBackgroundStyle,
          slideImageRightStyle,
          currentSlideImageUrl,
          slideImageFailed,
          handleSlideImageError,
          transitionClass,
          headerBlocks,
          leftBlocks,
          rightBlocks,
          col1Blocks,
          col2Blocks,
          col3Blocks,
          normalBlocks,
          isDarkTheme,
          isMaxStep,
          slidevContext,
          isAbsoluteBlock,
          openInEditor,
          slideClicksPlan,
          maxStepInCurrentSlide,
          getBlockClickClass,
          getBlockMotionClass,
          getBlockMotionStyle,
          renderBlockHtml,
          nextStepOrSlide,
          prevStepOrSlide,
          toggleTheme,
          toggleFullScreen,
          onBlockClick
        }
      }
    })

    app.component('slide-block-renderer', SlideBlockRenderer)
    app.component('Toc', TocComponent)
    app.component('toc', TocComponent)
    app.component('Arrow', ArrowComponent)
    app.component('arrow', ArrowComponent)

    // 批量注册 Carbon 常用图标组件与多种命名别名
    for (const [name, svg] of Object.entries(CARBON_ICONS)) {
      const iconComp = {
        render() {
          return h('span', {
            class: 'slidev-icon',
            style: { display: 'inline-flex', alignItems: 'center', verticalAlign: 'middle' },
            innerHTML: svg
          })
        }
      }
      app.component(name, iconComp)
      app.component(name.replace(':', '-'), iconComp)
      const pascal = name.split(/[:-]/).map(s => s.charAt(0).toUpperCase() + s.slice(1)).join('')
      app.component(pascal, iconComp)
    }

    app.mount("#app")
  </script>
</body>
</html>
