            case "PREV_STEP":
              prevStepOrSlide()
              syncAutoplayVideos()
              break

            case "FREEZE_KEYBOARD_NAV":
              isKeyboardFrozen.value = !!data.payload?.frozen
              break

            case "FULLSCREEN_CHANGED":
              isFullscreenMode.value = !!data.payload?.isFullscreen
              nextTick(() => updateScale())
              break
          }
        }

        // 双向监听页码与总页数变动，确保沙箱与宿主始终 100% 强同步
        watch(currentPageIndex, (newVal, oldVal) => {
          if (newVal !== oldVal) {
            notifySlideChanged()
            broadcastSync()
          }
        })
        watch(totalPages, () => {
          notifySlideChanged()
        })

        let resizeObserver = null
        onMounted(() => {
          window.addEventListener("keydown", onKeyDown)
          window.addEventListener("message", onHostMessage)
          window.addEventListener("wheel", onWheel, { passive: false })
          document.addEventListener("click", onDocumentClick, true)
          window.addEventListener("resize", updateScale)
          document.addEventListener("fullscreenchange", updateScale)
          window.addEventListener("pointerdown", () => syncAutoplayVideos(), { passive: true })

          if (window.ResizeObserver && stageContainerRef.value) {
            resizeObserver = new ResizeObserver(() => {
              updateScale()
            })
            resizeObserver.observe(stageContainerRef.value)
          }
          nextTick(() => {
            updateScale()
            syncAutoplayVideos()
          })

          // 告知宿主客户端沙箱已准备就绪并上报初始页码
          window.parent.postMessage({
            source: "siyuan-slidev-client",
            action: "CLIENT_READY",
            payload: {
              currentPage: currentPageIndex.value,
              totalPages: totalPages.value
            }
          }, "*")
          notifySlideChanged()
        })

        onUnmounted(() => {
          window.removeEventListener("keydown", onKeyDown)
          window.removeEventListener("message", onHostMessage)
          window.removeEventListener("wheel", onWheel)
          document.removeEventListener("click", onDocumentClick, true)
          window.removeEventListener("resize", updateScale)
          document.removeEventListener("fullscreenchange", updateScale)
          if (resizeObserver) {
            resizeObserver.disconnect()
            resizeObserver = null
          }
        })

        return {
          config,
          isNormalizeHeadings,
          slides,
          currentPageIndex,
          totalPages,
          currentSlide,
          currentStep,
          highlightedBlockId,
          stageContainerRef,
          slideScale,
          isFullscreenMode,
          viewportRatioClass,
          viewportStyle,
          currentSlideZoom,
          contentWrapperStyle,
          getLayoutGridStyle,
          updateScale,
          currentThemeMode,
          currentSlidevTheme,
          pageBackgroundStyle,
          slideImageRightStyle,
          currentSlideImageUrl,
          slideImageFailed,
          handleSlideImageError,
          transitionClass,
          headerBlocks,
          leftBlocks,
          rightBlocks,
          col1Blocks,
          col2Blocks,
          col3Blocks,
          isColsHeader,
          isSuperBlockColsHeader,
          dynamicColsCount,
          multiColBlocks,
          normalBlocks,
          isDarkTheme,
          isMaxStep,
          slidevContext,
          isAbsoluteBlock,
          openInEditor,
          slideClicksPlan,
          maxStepInCurrentSlide,
          getBlockClickClass,
          getBlockMotionClass,
          getBlockMotionStyle,
          renderBlockHtml,
          nextStepOrSlide,
          prevStepOrSlide,
          toggleTheme,
          toggleFullScreen,
          onBlockClick,
          currentSpacing,
          activeLightbox,
          openLightbox,
          closeLightbox,
          getHeadingNormalizeClass,
          currentSlideMaskConfig,
          maskLayerStyle,
          maskDividerLineStyle,
          maskOverlayStyle,
          maskDividerStyle,
          pageFirstHeadingBlock,
          bodyBlocksWithoutFirstHeading
        }
      }
    })

    app.component('slide-block-renderer', SlideBlockRenderer)
    app.component('Toc', TocComponent)
    app.component('toc', TocComponent)
    app.component('Arrow', ArrowComponent)
    app.component('arrow', ArrowComponent)

    // 批量注册 Carbon 常用图标组件与多种命名别名
    for (const [name, svg] of Object.entries(CARBON_ICONS)) {
      const iconComp = {
        render() {
          return h('span', {
            class: 'slidev-icon',
            style: { display: 'inline-flex', alignItems: 'center', verticalAlign: 'middle' },
            innerHTML: svg
          })
        }
      }
      app.component(name, iconComp)
      app.component(name.replace(':', '-'), iconComp)
      const pascal = name.split(/[:-]/).map(s => s.charAt(0).toUpperCase() + s.slice(1)).join('')
      app.component(pascal, iconComp)
    }

    app.mount("#app")
  </script>
</body>
</html>
