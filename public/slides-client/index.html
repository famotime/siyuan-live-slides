              columns: colMatch ? parseInt(colMatch[1], 10) : 1,
              textSm: md.includes('text-sm')
            })
          }

          // 10.5 复合多段 Markdown 块（例如卡片内部的标题行 + 配图/视频/说明段落）
          if (md.includes("\n") || hasHeadingTag) {
            const compoundHtml = renderCompoundMarkdown(md, block)
            if (compoundHtml) {
              return compoundHtml
            }
          }

          // 11. 普通段落 (若为分栏首项，赋予 slide-list-item-title 类名居中显示)
          const pClass = (block?.isColFirst) ? ' class="slide-list-item-title"' : ''
          return `<p${pClass}>${formatInlineMarkdown(md)}</p>`
        }

        function cleanCardListItemMarkdown(markdown) {
          if (!markdown) return ""
          const lines = markdown.split(/\r?\n/)
          if (lines.length === 0) return ""

          const firstLine = lines[0]
          const firstMatch = firstLine.match(/^(\s*)(?:[-*+]|\d+\.)\s+(.*)$/)
          if (!firstMatch) {
            return markdown
          }

          const baseIndent = firstMatch[1].length
          const firstLineText = firstMatch[2].trim()
          const prefixLength = firstLine.length - firstMatch[2].length

          if (lines.length === 1) {
            return firstLineText
          }

          const resultLines = [firstLineText]
          for (let i = 1; i < lines.length; i++) {
            const line = lines[i]
            if (!line.trim()) {
              resultLines.push("")
              continue
            }

            const spaceMatch = line.match(/^(\s*)/)
            const spaces = spaceMatch ? spaceMatch[1].length : 0

            if (spaces >= prefixLength) {
              resultLines.push(line.slice(prefixLength))
            } else if (spaces > baseIndent) {
              resultLines.push(line.slice(spaces))
            } else {
              resultLines.push(line)
            }
          }

          return resultLines.join("\n")
        }

        function renderCompoundMarkdown(md, block) {
          const lines = md.split(/\r?\n/)
          const subBlocks = []
          let current = []

          for (let i = 0; i < lines.length; i++) {
            const line = lines[i]
            const trimmed = line.trim()

            // 遇到独立标题行：单独作为一个子块
            if (/^#{1,6}\s+/.test(trimmed)) {
              if (current.length > 0) {
                subBlocks.push(current.join("\n"))
                current = []
              }
              subBlocks.push(trimmed)
              continue
            }

            // 遇到空行：切分段落
            if (!trimmed) {
              if (current.length > 0) {
                subBlocks.push(current.join("\n"))
                current = []
              }
              continue
            }

            // 遇到独立图片行：单独作为一个子块
            if (/^!\[.*?\]\(.*?\)$/.test(trimmed)) {
              if (current.length > 0) {
                subBlocks.push(current.join("\n"))
                current = []
              }
              subBlocks.push(trimmed)
              continue
            }

            // 遇到独立视频标签：单独作为一个子块
            if (/<video\b/i.test(trimmed)) {
              if (current.length > 0) {
                subBlocks.push(current.join("\n"))
                current = []
              }
              let videoRaw = trimmed
              if (!/<\/video>/i.test(videoRaw)) {
                while (i + 1 < lines.length && !/<\/video>/i.test(videoRaw)) {
                  i++
                  videoRaw += "\n" + lines[i]
                }
              }
              subBlocks.push(videoRaw)
              continue
            }

            current.push(line)
          }

          if (current.length > 0) {
            subBlocks.push(current.join("\n"))
          }

          let isFirstParagraph = true
          const htmlParts = subBlocks.map((sub) => {
            const trimmedSub = sub.trim()
            if (!trimmedSub) return ""

            // 1. 标题
            const hMatch = trimmedSub.match(/^(#{1,6})\s+(.*)$/)
            if (hMatch) {
              isFirstParagraph = false
              const level = hMatch[1].length
              return `<h${level} class="slide-list-item-title">${formatInlineMarkdown(hMatch[2].trim())}</h${level}>`
            }

            // 2. 图片
            const imgMatch = trimmedSub.match(/^!\[(.*?)\]\((.*?)\)$/)
            if (imgMatch) {
              const isGif = /\.gif(?:\?|$)/i.test(imgMatch[2])
              const cls = isGif ? "list-item-gif" : "list-item-img slide-media-img"
              return `<div class="slide-media-block slide-media-container slide-list-media"><img alt="${escapeHtml(imgMatch[1])}" src="${imgMatch[2]}" class="${cls}" /></div>`
            }

            // 3. 视频
            if (/<video\b/i.test(trimmedSub)) {
              const isAutoplay = block?.attributes?.["custom-slides-autoplay"] === "true" || /autoplay/i.test(trimmedSub)
              const isLoop = block?.attributes?.["custom-slides-loop"] === "true" || /loop/i.test(trimmedSub)
              const isMuted = block?.attributes?.["custom-slides-muted"] === "true" || isAutoplay || /muted/i.test(trimmedSub)
              const hideControls = block?.attributes?.["custom-slides-controls"] === "false"

              const srcMatch = trimmedSub.match(/\bsrc=["']([^"']+)["']/i)
              const src = srcMatch ? srcMatch[1] : ""

              const attrParts = ['class="slide-video-player"']
              if (!hideControls) attrParts.push("controls")
              if (isAutoplay) attrParts.push("autoplay playsinline")
              if (isLoop) attrParts.push("loop")
              if (isMuted) attrParts.push("muted")
              attrParts.push('preload="auto"')
              if (src) attrParts.push(`src="${src}"`)

              const innerContentMatch = trimmedSub.match(/<video[^>]*>([\s\S]*?)<\/video>/i)
              let innerContent = innerContentMatch ? innerContentMatch[1].trim() : ""
              if (!innerContent && src) {
                innerContent = `<source src="${src}" type="video/mp4" />您的浏览器不支持视频播放。`
              }

              return `<div class="slide-media-block slide-video-container slide-media-container" data-autoplay="${isAutoplay ? 'true' : 'false'}" data-muted="${isMuted ? 'true' : 'false'}"><video ${attrParts.join(" ")}>${innerContent}</video></div>`
            }

            // 4. 列表
            const listHtml = renderMarkdownList(trimmedSub, block)
            if (listHtml) {
              isFirstParagraph = false
              return listHtml
            }

            // 5. 段落 (首个段落作为卡片/分栏首行标题，赋予 slide-list-item-title，后续换行/段落作为说明描述)
            if (isFirstParagraph) {
              isFirstParagraph = false
              const subLines = trimmedSub.split(/\r?\n/).map(l => l.trim()).filter(Boolean)
              if (subLines.length === 1) {
                return `<p class="slide-list-item-title">${formatInlineMarkdown(subLines[0])}</p>`
              }
              const titleLine = subLines[0]
              const descLines = subLines.slice(1)
              const descHtml = descLines.map(l => formatInlineMarkdown(l)).join("<br/>")
              return `<p class="slide-list-item-title">${formatInlineMarkdown(titleLine)}</p>\n<p class="slide-list-item-desc">${descHtml}</p>`
            }
            return `<p class="slide-list-item-desc">${formatInlineMarkdown(trimmedSub)}</p>`
          }).filter(Boolean)

          return htmlParts.join("\n")
        }

        // 翻页与步进调度
        function nextStepOrSlide() {
          if (currentStep.value < maxStepInCurrentSlide.value) {
            currentStep.value++
            notifySlideChanged()
            return
          }
          if (currentPageIndex.value < totalPages.value) {
            currentPageIndex.value++
            currentStep.value = 0
            notifySlideChanged()
          }
        }

        function prevStepOrSlide() {
          if (currentStep.value > 0) {
            currentStep.value--
            notifySlideChanged()
            return
          }
          if (currentPageIndex.value > 1) {
            currentPageIndex.value--
            currentStep.value = 0
            notifySlideChanged()
          }
        }

        function toggleTheme() {
          isDarkTheme.value = !isDarkTheme.value
        }

        function toggleFullScreen() {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({
              source: "siyuan-slides-client",
              action: "REQUEST_TOGGLE_FULLSCREEN",
              payload: {}
            }, "*")
            setTimeout(updateScale, 80)
            setTimeout(updateScale, 260)
            return
          }
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().then(() => {
              checkFullscreen()
              updateScale()
            }).catch(() => {})
          } else {
            document.exitFullscreen().then(() => {
              checkFullscreen()
              updateScale()
            }).catch(() => {})
          }
        }

        function onBlockClick(blockId, e) {
          if (e && e.target) {
            const img = e.target.closest('img')
            if (img && img.src && !img.closest('.slides-lightbox')) {
              e.stopPropagation()
              openLightbox('img', img.src, img.alt || '')
              return
            }
            const vid = e.target.closest('video')
            if (vid && vid.src && !vid.closest('.slides-lightbox') && !vid.hasAttribute('controls')) {
              e.stopPropagation()
              openLightbox('video', vid.src)
              return
            }
            const refEl = e.target.closest('[data-ref-id]')
            if (refEl) {
              const refBlockId = refEl.getAttribute('data-ref-id')
              if (refBlockId) {
                e.preventDefault()
                e.stopPropagation()
                const blockTitle = (refEl.innerText || refEl.title || '').trim()
                window.parent.postMessage({
                  source: "siyuan-slides-client",
                  action: "OPEN_PEEK_DRAWER",
                  payload: {
                    peekType: "siyuan",
                    blockId: refBlockId,
                    title: blockTitle
                  }
                }, "*")
                return
              }
            }
            const linkEl = e.target.closest('a')
            if (linkEl) {
              const href = linkEl.getAttribute('href') || ''
              if (href.startsWith('siyuan://blocks/')) {
                e.preventDefault()
                e.stopPropagation()
                const cleanBlockId = href.replace('siyuan://blocks/', '').split('?')[0]
                const blockTitle = (linkEl.innerText || linkEl.title || '').trim()
                window.parent.postMessage({
                  source: "siyuan-slides-client",
                  action: "OPEN_PEEK_DRAWER",
                  payload: {
                    peekType: "siyuan",
                    blockId: cleanBlockId,
                    title: blockTitle
                  }
                }, "*")
                return
              } else if (/^https?:\/\//i.test(href)) {
                e.preventDefault()
                e.stopPropagation()
                window.parent.postMessage({
                  source: "siyuan-slides-client",
                  action: "OPEN_PEEK_DRAWER",
                  payload: {
                    peekType: "web",
                    url: href,
                    title: (linkEl.innerText || linkEl.title || '').trim()
                  }
                }, "*")
                return
              } else if (isPeekableLocalHtml(href)) {
                e.preventDefault()
                e.stopPropagation()
                window.parent.postMessage({
                  source: "siyuan-slides-client",
                  action: "OPEN_PEEK_DRAWER",
                  payload: {
                    peekType: "web",
                    url: resolvePeekHref(href),
                    title: (linkEl.innerText || linkEl.title || '').trim()
                  }
                }, "*")
                return
              }
            }
          }

          // 核心逻辑：若当前已处于高亮强调色方框且再次点击同一对象，取消方框并通知宿主；否则单选互斥高亮该对象
          if (highlightedBlockId.value && highlightedBlockId.value === blockId) {
            highlightedBlockId.value = ""
            if (e && typeof e.stopPropagation === 'function') {
              e.stopPropagation()
            }
            window.parent.postMessage({
              source: "siyuan-slides-client",
              action: "BLOCK_CLICKED",
              payload: {
                currentPage: currentPageIndex.value,
                clickedBlockId: ""
              }
            }, "*")
            return
          }

          highlightedBlockId.value = blockId
          if (e && typeof e.stopPropagation === 'function') {
            e.stopPropagation()
          }
          window.parent.postMessage({
            source: "siyuan-slides-client",
            action: "BLOCK_CLICKED",
            payload: {
              currentPage: currentPageIndex.value,
              clickedBlockId: blockId
            }
          }, "*")
        }

        function isAbsoluteBlock(block) {
          if (!block) return false
          const raw = (block.rawMarkdown || block.content || '').trim()
          return raw.includes('abs-br') || raw.includes('abs-bl') || raw.includes('abs-tr') || raw.includes('abs-tl') || raw.includes('absolute')
        }

        function openInEditor(blockId) {
          const targetId = blockId || currentSlide.value?.startBlockId || ""
          window.parent.postMessage({
            source: "siyuan-slides-client",
            action: "OPEN_IN_EDITOR",
            payload: {
              currentPage: currentPageIndex.value,
              blockId: targetId
            }
          }, "*")
        }

        window.__slidesSlides = slides
        window.__slidesCurrentPageIndex = currentPageIndex

        const slidesContext = reactive({
          nav: {
            next: () => nextStepOrSlide(),
            prev: () => prevStepOrSlide(),
            nextSlide: () => {
              if (currentPageIndex.value < totalPages.value) {
                currentPageIndex.value++
                currentStep.value = 0
                notifySlideChanged()
              }
            },
            prevSlide: () => {
              if (currentPageIndex.value > 1) {
                currentPageIndex.value--
                currentStep.value = 0
                notifySlideChanged()
              }
            },
            go: (page) => {
              const p = parseInt(page, 10)
              if (!isNaN(p) && p >= 1 && p <= totalPages.value) {
                currentPageIndex.value = p
                currentStep.value = 0
                notifySlideChanged()
              }
            },
            goFirst: () => {
              currentPageIndex.value = 1
              currentStep.value = 0
              notifySlideChanged()
            },
            goLast: () => {
              currentPageIndex.value = totalPages.value || 1
              currentStep.value = 0
              notifySlideChanged()
            },
            openInEditor: (id) => openInEditor(id),
            currentSlideNo: currentPageIndex,
            total: totalPages,
            tocTree: computed(() => buildTocTree(slides.value, currentPageIndex.value))
          },
          slides,
          currentSlide,
          configs: config,
          theme: computed(() => config.value.theme || 'apple-basic')
        })

        window.__slidesNavigateTo = (page) => {
          slidesContext.nav.go(page)
        }

        provide('$slides', slidesContext)
        provide('$slidev', slidesContext)
        const instance = getCurrentInstance()
        if (instance && instance.appContext) {
          instance.appContext.config.globalProperties.$slides = slidesContext
          instance.appContext.config.globalProperties.$slidev = slidesContext
        }

        const urlParams = typeof window !== "undefined" && window.location ? new URLSearchParams(window.location.search) : null
        const isHeadless = urlParams ? (urlParams.get("headless") === "true" || urlParams.get("export") === "true") : false
        let isExternalSyncing = false

        function notifySlideChanged() {
          window.parent.postMessage({
            source: "siyuan-slides-client",
            action: "SLIDE_CHANGED",
            payload: {
              currentPage: currentPageIndex.value,
              totalPages: totalPages.value,
              currentStep: currentStep.value,
              maxStep: maxStepInCurrentSlide.value,
              currentBlockId: currentSlide.value?.startBlockId || ""
            }
          }, "*")
          // 双屏跨窗口同步：向广播频道同步当前页码与步进
          // 注意：无头静默沙箱或截图导出过程中切断广播，防止翻页消息污染前台预览；外部同步时不反弹广播
          try {
            if (!isHeadless && broadcastChannel && !isCapturingImages.value && !isExternalSyncing) {
              broadcastChannel.postMessage({
                type: "SYNC_PAGE",
                page: currentPageIndex.value,
                step: currentStep.value,
                maxStep: maxStepInCurrentSlide.value
              })
            }
          } catch (e) {}
        }

        // 双向广播频道用于双屏演讲者模式同步（无头静默沙箱模式下禁用，防止翻页污染前台大屏与演讲者端）
        let broadcastChannel = null
        if (!isHeadless) {
          try {
            broadcastChannel = new BroadcastChannel("siyuan-slides-sync")
            broadcastChannel.onmessage = (e) => {
              if (e.data?.type === "SYNC_PAGE" && typeof e.data.page === "number") {
                const targetPage = Math.max(1, Math.min(e.data.page, totalPages.value || 1))
                const targetStep = typeof e.data.step === "number" ? Math.max(0, e.data.step) : 0
                if (currentPageIndex.value !== targetPage || currentStep.value !== targetStep) {
                  isExternalSyncing = true
                  currentPageIndex.value = targetPage
                  currentStep.value = targetStep
                  // 仅向宿主上报状态变更，严禁在此再次向 broadcastChannel 广播产生 Ping-Pong 风暴
                  window.parent.postMessage({
                    source: "siyuan-slides-client",
                    action: "SLIDE_CHANGED",
                    payload: {
                      currentPage: currentPageIndex.value,
                      totalPages: totalPages.value,
                      currentStep: currentStep.value,
                      maxStep: maxStepInCurrentSlide.value,
                      currentBlockId: currentSlide.value?.startBlockId || ""
                    }
                  }, "*")
                  nextTick(() => {
                    isExternalSyncing = false
                    syncAutoplayVideos()
                  })
                }
              } else if (e.data?.type === "NEXT_STEP") {
                nextStepOrSlide()
                syncAutoplayVideos()
              } else if (e.data?.type === "PREV_STEP") {
                prevStepOrSlide()
                syncAutoplayVideos()
              } else if (e.data?.type === "SYNC_SLIDES") {
                if (e.data.slides) slides.value = e.data.slides
                if (e.data.config) {
                  config.value = { ...config.value, ...e.data.config }
                  applyConfigThemeMode(config.value)
                }
              } else if (e.data?.type === "REQUEST_SYNC") {
                if (slides.value && slides.value.length > 0) {
                  broadcastSync()
                }
              }
            }
          } catch (e) {}
        }

        function broadcastSync() {
          if (isHeadless || !broadcastChannel || isCapturingImages.value || isExternalSyncing) return
          try {
            broadcastChannel.postMessage({
              type: "SYNC_PAGE",
              page: currentPageIndex.value,
              step: currentStep.value,
              maxStep: maxStepInCurrentSlide.value
            })
            // 通过 JSON 序列化脱敏 Vue 响应式 Proxy 对象，防止 BroadcastChannel 抛出 DataCloneError
            const plainSlides = JSON.parse(JSON.stringify(slides.value || []))
            const plainConfig = JSON.parse(JSON.stringify(config.value || {}))
            broadcastChannel.postMessage({
              type: "SYNC_SLIDES",
              slides: plainSlides,
              config: plainConfig
            })
          } catch (err) {
            console.warn("[Slidev] BroadcastChannel postMessage warning:", err)
          }
        }

        function openPresenter() {
          broadcastSync()
          // 桌面端思源会拦截 window.open 并甩给系统浏览器，演讲者视图与沙箱跨进程隔离后
          // BroadcastChannel 完全失效；嵌入宿主时改为请求宿主在思源内打开演讲者页签
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({
              source: "siyuan-slides-client",
              action: "OPEN_PRESENTER",
              payload: {}
            }, "*")
            return
          }
          // 独立浏览器打开（无宿主）时退回原行为
          window.open("presenter.html", "SlidesPresenter", "width=1200,height=800")
        }

        // 「数字+回车」跳页输入状态：右下角角标实时回显，Esc/超时清空
        const JUMP_IDLE_CLEAR_MS = 1500
        const JUMP_INVALID_FLASH_MS = 500
        const jumpDisplay = ref("")
        const jumpInvalid = ref(false)
        let jumpIdleTimer = null
        let jumpFlashTimer = null

        function hideJumpIndicator() {
          jumpDisplay.value = ""
          jumpInvalid.value = false
          if (jumpIdleTimer) { clearTimeout(jumpIdleTimer); jumpIdleTimer = null }
          if (jumpFlashTimer) { clearTimeout(jumpFlashTimer); jumpFlashTimer = null }
        }

        function armJumpIdleTimer() {
          if (jumpIdleTimer) clearTimeout(jumpIdleTimer)
          jumpIdleTimer = setTimeout(hideJumpIndicator, JUMP_IDLE_CLEAR_MS)
        }

        function flashJumpInvalid() {
          if (jumpIdleTimer) { clearTimeout(jumpIdleTimer); jumpIdleTimer = null }
          jumpInvalid.value = true
          if (jumpFlashTimer) clearTimeout(jumpFlashTimer)
          jumpFlashTimer = setTimeout(hideJumpIndicator, JUMP_INVALID_FLASH_MS)
        }

        function isEditableKeyTarget(e) {
          const t = e.target
          if (!t || !t.tagName) return false
          return t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable === true
        }

        // ========= 缩略图总览层（o 键呼出，方向键/数字+回车/点选跳页） =========
        const OVERVIEW_CARD_W = 236
        const showOverview = ref(false)
        const overviewFocus = ref(1)
        const overviewGridRef = ref(null)
        const overviewCardEls = []
        let overviewObserver = null
        const overviewScale = computed(() => OVERVIEW_CARD_W / baseWidth)
        const overviewCardHeight = computed(() => Math.round(baseHeight.value * overviewScale.value))

        function getSlideCoverUrl(slide) {
          const fm = slide?.frontmatter || {}
          return fm.image || fm.background || config.value?.image || ""
        }

        function getSlideOverviewTitle(slide) {
          const fm = slide?.frontmatter || {}
          if (fm.title) return String(fm.title)
          const blocks = slide?.blocks || []
          for (const b of blocks) {
            if (b.type === "h" || /^h[1-6]$/i.test(b.subType || "")) {
              const md = (b.rawMarkdown || b.content || "").trim()
              return md.replace(/^#{1,6}\s+/, "").replace(/[*_`]/g, "").slice(0, 40)
            }
          }
          return ""
        }

        function getSlideBackgroundStyleObj(slide) {
          const bg = slide?.frontmatter?.background || config.value?.background
          if (!bg) return {}
          if (/^(http|\/|data:|assets\/)/.test(bg)) {
            return { backgroundImage: 'url("' + bg + '")', backgroundSize: "cover", backgroundPosition: "center" }
          }
          const isLight = isLightColor(bg)
          const styles = { background: bg }
          if (isLight === true) {
            styles.color = '#0f172a'
            styles['--slide-text'] = '#0f172a'
            styles['--slide-text-secondary'] = '#475569'
          } else if (isLight === false) {
            styles.color = '#f1f5f9'
            styles['--slide-text'] = '#f1f5f9'
            styles['--slide-text-secondary'] = '#94a3b8'
          }
          return styles
        }

        function getOverviewCanvasStyle(slide) {
          return {
            width: baseWidth + "px",
            height: baseHeight.value + "px",
            transform: "scale(" + overviewScale.value + ")",
            ...getSlideBackgroundStyleObj(slide)
          }
        }

        function buildThumbBlockHtml(block) {
          const abs = isAbsoluteBlock(block) ? " slide-block--absolute" : ""
          return '<div class="slide-block' + abs + '">' + renderBlockHtml(block) + "</div>"
        }

        // 镜像主渲染路径的版式结构，把任意一页渲染为静态缩略图 HTML（不含蒙版与交互态）
        function buildOverviewThumbHtml(slide) {
          if (!slide) return ""
          const fm = slide.frontmatter || {}
          const layout = fm.layout || "default"
          const g = buildLayoutGroups(slide)
          const cls = fm.class ? " " + fm.class : ""
          const layoutCls = fm.layoutClass ? " " + fm.layoutClass : ""
          const gridStyleObj = (layout === 'clover') ? {} : getLayoutGridStyle(slide, g.colsCount)
          const gridStyle = Object.entries(gridStyleObj).map(([k, v]) => k + ":" + v).join(";")
          const spacing = (fm.spacing && fm.spacing !== "inherit") ? fm.spacing : (config.value?.spacing || "normal")
          let body = ""
          if (isColsHeader(layout)) {
            const headerHtml = g.header.length > 0
              ? '<div class="two-cols-header-top three-cols-header-top cols-header-top layout-header-section">' + g.header.map(buildThumbBlockHtml).join("") + "</div>"
              : ""
            const colCls = (g.colsCount === 2 ? " layout-two-cols" : "") + (g.colsCount === 3 ? " layout-three-cols" : "") + (layout === "clover" ? " layout-clover-grid" : "") + (g.isSuperCols ? " has-superblock-cols" : "")
            body = headerHtml
              + '<div class="layout-cols-grid' + colCls + '" style="flex:1;' + gridStyle + '">'
              + g.multiCol.map((colBlocks, colIdx) => {
                  const c = "col col-" + (colIdx + 1) + " pdf-col--" + (colIdx + 1)
                    + (g.colsCount === 2 && colIdx === 0 ? " two-cols-left" : "")
                    + (g.colsCount === 2 && colIdx === 1 ? " two-cols-right" : "")
                    + (g.colsCount === 3 ? " three-cols-col three-cols-col--" + (colIdx + 1) : "")
                    + (layout === "clover" ? " clover-col clover-col--" + (colIdx + 1) : "")
                    + cls
                  return '<div class="' + c + '">' + (colBlocks || []).map(buildThumbBlockHtml).join("") + "</div>"
                }).join("")
              + "</div>"
          } else if (layout === "two-cols") {
            body = '<div class="layout-two-cols' + layoutCls + '" style="' + gridStyle + '">'
              + '<div class="two-cols-left' + cls + '">' + (g.multiCol[0] || []).map(buildThumbBlockHtml).join("") + "</div>"
              + '<div class="two-cols-right' + cls + '">' + (g.multiCol[1] || []).map(buildThumbBlockHtml).join("") + "</div>"
              + "</div>"
          } else if (layout === "image-right" || layout === "image-left") {
            const url = getSlideCoverUrl(slide)
            const imgHtml = url ? '<img class="' + (layout === "image-right" ? "image-right-img" : "image-left-img") + '" src="' + String(url).replace(/"/g, "&quot;") + '" alt="Slide cover" />' : ""
            const contentCls = layout === "image-right" ? "image-right-content" : "image-left-content"
            const imgCls = layout === "image-right" ? "image-right-img-container" : "image-left-img-container"
            const content = '<div class="' + contentCls + cls + '">' + g.normal.map(buildThumbBlockHtml).join("") + "</div>"
            const imgBox = '<div class="' + imgCls + '">' + imgHtml + "</div>"
            body = '<div class="layout-' + layout + '" style="' + gridStyle + '">' + (layout === "image-right" ? content + imgBox : imgBox + content) + "</div>"
          } else if (layout === "intro") {
            const url = getSlideCoverUrl(slide)
            const avatarHtml = url ? '<div class="intro-avatar-box"><img class="intro-avatar-img" src="' + String(url).replace(/"/g, "&quot;") + '" alt="Avatar" /></div>' : '<div class="intro-avatar-box intro-avatar-placeholder"><svg class="intro-avatar-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div>'
            body = '<div class="layout-intro-container"><div class="intro-avatar-col">' + avatarHtml + '</div><div class="intro-info-col">' + g.normal.map(buildThumbBlockHtml).join("") + '</div></div>'
          } else if (layout === "quote") {
            body = '<div class="layout-quote-container"><div class="quote-watermark-icon">“</div><div class="quote-content-body">' + g.normal.map(buildThumbBlockHtml).join("") + '</div></div>'
          } else if (layout === "fact") {
            const rawLines = []
            if (g.normal.length === 1 && g.normal[0].children && g.normal[0].children.length >= 1) {
              for (const c of g.normal[0].children) rawLines.push((c.rawMarkdown || c.content || "").trim())
            } else if (g.normal.length === 1) {
              const lines = (g.normal[0].rawMarkdown || g.normal[0].content || "").trim().split(/\r?\n/)
              for (const line of lines) {
                if (/^(\s*)(?:[-*+]|\d+\.)\s+/.test(line)) rawLines.push(line.trim())
              }
            }
            let cards = []
            if (rawLines.length > 0) {
              cards = rawLines.map(function(line) {
                const cl = cleanCardListItemMarkdown(line).trim()
                const m = cl.match(/^([^\n:：]+?)(?:\s*[:：]\s*)([\s\S]+)$/)
                return m ? { val: m[1].trim(), lbl: m[2].trim() } : { val: cl, lbl: "" }
              })
            } else if (g.normal.length >= 2 && g.normal.length % 2 === 0) {
              for (let i = 0; i < g.normal.length; i += 2) {
                cards.push({ val: cleanCardListItemMarkdown(g.normal[i].rawMarkdown || g.normal[i].content || "").trim(), lbl: cleanCardListItemMarkdown(g.normal[i+1].rawMarkdown || g.normal[i+1].content || "").trim() })
              }
            } else if (g.normal.length > 0) {
              const firstCl = cleanCardListItemMarkdown(g.normal[0].rawMarkdown || g.normal[0].content || "").trim()
              const m = firstCl.match(/^([^\n:：]+?)(?:\s*[:：]\s*)([\s\S]+)$/)
              if (m) cards.push({ val: m[1].trim(), lbl: m[2].trim() })
              else cards.push({ val: firstCl, lbl: g.normal.slice(1).map(function(b) { return cleanCardListItemMarkdown(b.rawMarkdown || b.content || "").trim() }).join("\n") })
            }
            const cCount = Math.max(1, Math.min(4, cards.length))
            const cardsHtml = cards.map(function(c) {
              return '<div class="fact-stat-card"><div class="fact-value-wrapper fact-value-box">' + String(c.val).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") + '</div>' + (c.lbl ? '<div class="fact-divider-line"></div><div class="fact-label-wrapper fact-label-box">' + String(c.lbl).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") + '</div>' : '') + '</div>'
            }).join("")
            body = '<div class="layout-fact-container layout-fact-cols-' + cCount + '"><div class="fact-hero-glow"></div><div class="fact-content-box fact-stats-grid fact-stats-grid--cols-' + cCount + '">' + cardsHtml + '</div></div>'
          } else if (layout === "timeline" || layout === "steps") {
            let items = g.normal
            if (items.length === 1 && items[0].children && items[0].children.length >= 2) {
              items = items[0].children
            }
            const steps = items.map(function(b, idx) {
              return '<div class="timeline-step-item"><div class="timeline-node-container"><div class="timeline-node-badge">' + (idx + 1) + '</div></div><div class="timeline-step-content">' + buildThumbBlockHtml(b) + '</div></div>'
            }).join("")
            body = '<div class="layout-timeline-container"><div class="timeline-track-wrapper">' + steps + '</div></div>'
          } else {
            body = g.normal.map(buildThumbBlockHtml).join("")
          }
          const z = typeof fm.zoom === "number" && fm.zoom > 0 ? fm.zoom : (typeof fm.zoom === "string" && parseFloat(fm.zoom) > 0 ? parseFloat(fm.zoom) : 1)
          const zoomStyle = z !== 1 ? 'width:' + (100 / z) + '%;height:' + (100 / z) + '%;transform-origin:top left;transform:scale(' + z + ');' : ""
          return '<div class="slide-content-wrapper layout-' + layout + " spacing-" + spacing + cls + layoutCls + '"' + (zoomStyle ? ' style="' + zoomStyle + '"' : "") + ">" + body + "</div>"
        }

        function renderOverviewThumb(cardEl) {
          if (!cardEl || cardEl.dataset.rendered === "1") return
          const idx = Number(cardEl.dataset.idx)
          const slide = slides.value[idx]
          const canvas = cardEl.querySelector(".slides-overview-canvas")
          if (slide && canvas) canvas.innerHTML = buildOverviewThumbHtml(slide)
          cardEl.dataset.rendered = "1"
        }

        function ensureOverviewObserver() {
          if (overviewObserver || typeof window.IntersectionObserver !== "function") return
          overviewObserver = new IntersectionObserver((entries) => {
            for (const en of entries) {
              if (!en.isIntersecting) continue
              overviewObserver.unobserve(en.target)
              renderOverviewThumb(en.target)
            }
          }, { rootMargin: "240px" })
        }

        function setOverviewCardRef(el, idx) {
          if (!el) return
          overviewCardEls[idx] = el
          overviewCardEls.length = Math.max(overviewCardEls.length, slides.value.length)
          if (showOverview.value && el.dataset.rendered !== "1" && overviewObserver) {
            overviewObserver.observe(el)
          }
        }

        function observeOverviewCards() {
          if (!overviewObserver) return
          for (let i = 0; i < overviewCardEls.length; i++) {
            const el = overviewCardEls[i]
            if (el && el.dataset.rendered !== "1") overviewObserver.observe(el)
          }
        }

        function unobserveOverviewCards() {
          if (!overviewObserver) return
          for (let i = 0; i < overviewCardEls.length; i++) {
            if (overviewCardEls[i]) overviewObserver.unobserve(overviewCardEls[i])
          }
        }

        // slides 更新后缩略图缓存整体失效，下次打开按需重渲染
        function resetOverviewThumbs() {
          for (let i = 0; i < overviewCardEls.length; i++) {
            const el = overviewCardEls[i]
            if (!el) continue
            el.dataset.rendered = ""
            const canvas = el.querySelector(".slides-overview-canvas")
            if (canvas) canvas.innerHTML = ""
          }
        }

        function getOverviewCols() {
          const grid = overviewGridRef.value
          if (!grid || !grid.clientWidth) return 1
          return Math.max(1, Math.round(grid.clientWidth / (OVERVIEW_CARD_W + 18)))
        }

        function scrollOverviewCardIntoView(page) {
          const el = overviewCardEls[page - 1]
          if (el && el.scrollIntoView) el.scrollIntoView({ block: "nearest", behavior: "smooth" })
        }

        function setOverviewFocus(page) {
          const total = totalPages.value || slides.value.length || 1
          overviewFocus.value = Math.min(Math.max(1, page), total)
          nextTick(() => scrollOverviewCardIntoView(overviewFocus.value))
        }

        function goFromOverview(page) {
          const p = parseInt(page, 10)
          if (isNaN(p) || p < 1 || p > (totalPages.value || 0)) return
          closeOverview()
          slidesContext.nav.go(p)
        }

        function openOverview() {
          if (!slides.value || slides.value.length === 0) return
          overviewFocus.value = Math.min(Math.max(1, currentPageIndex.value), slides.value.length)
          showOverview.value = true
          nextTick(() => {
            ensureOverviewObserver()
            if (overviewObserver) {
              observeOverviewCards()
            } else {
              // 无 IntersectionObserver 环境降级：全量渲染
              for (let i = 0; i < overviewCardEls.length; i++) renderOverviewThumb(overviewCardEls[i])
            }
            scrollOverviewCardIntoView(overviewFocus.value)
          })
        }

        function closeOverview() {
          showOverview.value = false
          hideJumpIndicator()
          unobserveOverviewCards()
        }

        function toggleOverview() {
          if (showOverview.value) closeOverview()
          else openOverview()
        }

        // 总览打开期间接管全部按键：修复上游总览中空格/PGUP/PGDN 仍会翻页的漏洞
        function handleOverviewKeyDown(e) {
          if (e.ctrlKey || e.metaKey || e.altKey) return
          if (e.isComposing || isEditableKeyTarget(e)) return
          if (/^[0-9]$/.test(e.key)) {
            if (!jumpInvalid.value && jumpDisplay.value.length < 4) {
              jumpDisplay.value += e.key
              const p = parseInt(jumpDisplay.value, 10)
              if (!isNaN(p) && p >= 1 && p <= (totalPages.value || 0)) setOverviewFocus(p)
              armJumpIdleTimer()
              e.preventDefault()
            }
            return
          }
          if (e.key === "Enter" && jumpDisplay.value) {
            if (!jumpInvalid.value) {
              const page = parseInt(jumpDisplay.value, 10)
              const total = totalPages.value || 0
              if (!isNaN(page) && page >= 1 && page <= total) {
                goFromOverview(page)
              } else {
                flashJumpInvalid()
              }
            }
            e.preventDefault()
            return
          }
          if (e.key === "Escape" && (jumpDisplay.value || jumpInvalid.value)) {
            hideJumpIndicator()
            e.preventDefault()
            return
          }
          if (e.key === "ArrowRight") {
            e.preventDefault()
            setOverviewFocus(overviewFocus.value + 1)
            return
          }
          if (e.key === "ArrowLeft") {
            e.preventDefault()
            setOverviewFocus(overviewFocus.value - 1)
            return
          }
          if (e.key === "ArrowDown" || e.key === "PageDown") {
            e.preventDefault()
            setOverviewFocus(overviewFocus.value + getOverviewCols())
            return
          }
          if (e.key === "ArrowUp" || e.key === "PageUp") {
            e.preventDefault()
            setOverviewFocus(overviewFocus.value - getOverviewCols())
            return
          }
          if (e.key === " ") {
            e.preventDefault()
            return
          }
          if (e.key === "Enter") {
            e.preventDefault()
            goFromOverview(overviewFocus.value)
            return
          }
          if (e.key === "Escape" || e.key === "o" || e.key === "O") {
            e.preventDefault()
            closeOverview()
          }
        }

        // 监听键盘快捷键
        function onKeyDown(e) {
          if (activeLightbox.value) {
            if (e.key === "Escape") {
              e.preventDefault()
              closeLightbox()
            }
            return
          }
          if (isKeyboardFrozen.value) {
            return
          }
          // 总览打开期间全部按键由总览层接管
          if (showOverview.value) {
            handleOverviewKeyDown(e)
            return
          }
          // 「数字+回车」跳页：可输入元素、修饰键、IME 组合输入中不拦截
          if (!e.ctrlKey && !e.metaKey && !e.altKey && !e.isComposing && !isEditableKeyTarget(e)) {
            if (/^[0-9]$/.test(e.key)) {
              if (!jumpInvalid.value && jumpDisplay.value.length < 4) {
                jumpDisplay.value += e.key
                armJumpIdleTimer()
                e.preventDefault()
              }
              return
            }
            if (e.key === "Enter" && jumpDisplay.value) {
              if (!jumpInvalid.value) {
                const page = parseInt(jumpDisplay.value, 10)
                const total = totalPages.value || 0
                if (!isNaN(page) && page >= 1 && page <= total) {
                  hideJumpIndicator()
                  slidesContext.nav.go(page)
                } else {
                  flashJumpInvalid()
                }
              }
              e.preventDefault()
              return
            }
            if (e.key === "Escape" && (jumpDisplay.value || jumpInvalid.value)) {
              hideJumpIndicator()
              e.preventDefault()
              return
            }
            if (e.key === "o" || e.key === "O") {
              e.preventDefault()
              toggleOverview()
              return
            }
          }
          if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
            e.preventDefault()
            nextStepOrSlide()
          } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
            e.preventDefault()
            prevStepOrSlide()
          } else if (e.key === "f" || e.key === "F") {
            e.preventDefault()
            toggleFullScreen()
          } else if (e.key === "p" || e.key === "P") {
            e.preventDefault()
            openPresenter()
          }
        }

        // 监听鼠标滚轮上下翻页调度
        let lastWheelTime = 0
        const WHEEL_COOLDOWN_MS = 280
        const WHEEL_DELTA_THRESHOLD = 15

        function canElementScrollY(el, deltaY) {
          let cur = el
          let targetPre = null
          let isSelected = false
          while (cur && cur !== document.body && cur !== document.documentElement) {
            if (cur.tagName === 'PRE' || (cur.classList && cur.classList.contains('shiki-container'))) {
              targetPre = cur
            }
            if (cur.classList && cur.classList.contains('slide-block')) {
              const blockId = cur.getAttribute('data-block-id')
              if (cur.classList.contains('highlighted') || (highlightedBlockId && highlightedBlockId.value && blockId === highlightedBlockId.value)) {
                isSelected = true
              }
              break
            }
            cur = cur.parentElement
          }

          // 仅在当前代码块处于选中状态时，才控制该代码块的垂直滚动
          if (targetPre && isSelected) {
            const maxScroll = targetPre.scrollHeight - targetPre.clientHeight
            if (maxScroll > 1) {
              targetPre.scrollTop += deltaY
              return true
            }
          }
          // 其余情况一律返回 false，由滚轮默认调度翻页
          return false
        }

        function onWheel(e) {
          if (activeLightbox && activeLightbox.value) {
            if (activeLightbox.value.type === 'img') {
              handleLightboxWheel(e)
            }
            return
          }
          // 总览打开时滚轮交给总览列表原生滚动，不触发翻页
          if (showOverview.value) return
          if (isKeyboardFrozen && isKeyboardFrozen.value) return
          if (Math.abs(e.deltaY) < Math.abs(e.deltaX)) return
          if (Math.abs(e.deltaY) < WHEEL_DELTA_THRESHOLD) return

          const target = e.target instanceof Element ? e.target : e.target?.parentElement
          if (target && canElementScrollY(target, e.deltaY)) {
            return
          }

          e.preventDefault()
          const now = Date.now()
          if (now - lastWheelTime < WHEEL_COOLDOWN_MS) return
          lastWheelTime = now

          if (e.deltaY > 0) {
            nextStepOrSlide()
          } else {
            prevStepOrSlide()
          }
          syncAutoplayVideos()
        }

        // 本地 HTML 链接（思源资产 / 工作区文件 / 绝对文件路径）速览判定
        // 注意：需与 src/engine/workspace-scaffolder.ts 中生成的拦截器保持同步
        function isPeekableLocalHtml(href) {
          const clean = (href || '').trim()
          if (!clean || clean.startsWith('#') || clean.startsWith('//')) return false
          if (!/\.html?($|[?#])/i.test(clean)) return false
          if (/^https?:\/\//i.test(clean)) return false
          const scheme = /^([a-z][a-z0-9+.-]*):/i.exec(clean)
          if (!scheme) return true
          const schemeName = scheme[1].toLowerCase()
          if (schemeName === 'file') return true
          // Windows 盘符路径（D:\docs\demo.html）并非协议前缀
          return schemeName.length === 1 && /^[a-zA-Z]:[\\/]/.test(clean)
        }

        // 本地 HTML 链接预处理：思源资产统一指向内核 /assets/ 静态服务，其余原样转交宿主归一化
        // 不基于 location 绝对化，保证沙箱模式与 Pro 模式（Slidev dev server）行为完全一致
        function resolvePeekHref(href) {
          const clean = (href || '').trim()
          if (/^(?:\.\/|\/)?assets\//.test(clean)) {
            return '/' + clean.replace(/^(?:\.\/|\/)/, '')
          }
          return clean
        }

        // 全局拦截思源块引用与网页链接点击，转由宿主原位浮层呈现；并在未点中页面组件的空白区域响应鼠标左键左右侧翻页
        function onDocumentClick(e) {
          if (e.button !== 0) return

          // 核心保护：若媒体灯箱处于打开放大状态，点击媒体外部自动关闭返回，绝不翻页！
          if (activeLightbox && activeLightbox.value) {
            if (lightboxHasMoved) {
              lightboxHasMoved = false
              e.preventDefault()
              e.stopPropagation()
              return
            }
            const target = e.target instanceof Element ? e.target : e.target?.parentElement
            const isMediaItself = target && target.closest && target.closest('.slides-lightbox-img, .slides-lightbox-video')
            if (!isMediaItself) {
              e.preventDefault()
              e.stopPropagation()
              if (typeof e.stopImmediatePropagation === 'function') {
                e.stopImmediatePropagation()
              }
              closeLightbox()
            }
            return
          }

          const targetEl = e.target instanceof Element ? e.target : e.target?.parentElement
          if (!targetEl || !targetEl.closest) return

          const refEl = targetEl.closest('[data-ref-id]')
          if (refEl) {
            const blockId = refEl.getAttribute('data-ref-id')
            if (blockId) {
              e.preventDefault()
              e.stopPropagation()
              const blockTitle = (refEl.innerText || refEl.title || '').trim()
              window.parent.postMessage({
                source: "siyuan-slides-client",
                action: "OPEN_PEEK_DRAWER",
                payload: {
                  peekType: "siyuan",
                  blockId: blockId,
                  title: blockTitle
                }
              }, "*")
              return
            }
          }

          const linkEl = targetEl.closest('a')
          if (linkEl) {
            const href = linkEl.getAttribute('href') || ''
            if (href.startsWith('siyuan://blocks/')) {
              e.preventDefault()
              e.stopPropagation()
              const cleanBlockId = href.replace('siyuan://blocks/', '').split('?')[0]
              const blockTitle = (linkEl.innerText || linkEl.title || '').trim()
              window.parent.postMessage({
                source: "siyuan-slides-client",
                action: "OPEN_PEEK_DRAWER",
                payload: {
                  peekType: "siyuan",
                  blockId: cleanBlockId,
                  title: blockTitle
                }
              }, "*")
              return
            } else if (/^https?:\/\//i.test(href)) {
              e.preventDefault()
              e.stopPropagation()
              window.parent.postMessage({
                source: "siyuan-slides-client",
                action: "OPEN_PEEK_DRAWER",
                payload: {
                  peekType: "web",
                  url: href,
                  title: (linkEl.innerText || linkEl.title || '').trim()
                }
              }, "*")
              return
            } else if (isPeekableLocalHtml(href)) {
              e.preventDefault()
              e.stopPropagation()
              window.parent.postMessage({
                source: "siyuan-slides-client",
                action: "OPEN_PEEK_DRAWER",
                payload: {
                  peekType: "web",
                  url: resolvePeekHref(href),
                  title: (linkEl.innerText || linkEl.title || '').trim()
                }
              }, "*")
              return
            }
          }

          // 划选文本保护：若用户正在划选文字，释放鼠标时不触发翻页
          const selection = window.getSelection ? window.getSelection().toString().trim() : ""
          if (selection.length > 0) return

          // 页面组件与可交互对象排查：若点击命中具体对象、内容块、媒体或功能控制元素，一律不触发翻页
          // 预览与全屏放映状态操作逻辑保持严格一致：在点击到对象时绝不翻页，由对象自身响应高亮边框或交互；未点中对象时才触发左右翻页
          const isComponent = targetEl.closest(
            '.slide-block, .controls-bar, .image-right-img-container, .image-left-img-container, .slide-media-container, .slide-video-container, img, video, audio, button, a, input, textarea, select, [data-clickable], [data-ref-id], .slides-toc, .empty-state, table, pre, code, svg, .katex'
          )
          if (isComponent) return

          // 动态蒙版步进状态标识（保留变量以支持蒙版状态追踪与测试）
          const hasPendingMaskSteps = currentSlideMaskConfig.value && (currentStep.value < maxStepInCurrentSlide.value)

          // 屏幕左右对半翻页调度：左侧向前（步骤/上一页），右侧向后（步骤/下一页）
          const isLeft = e.clientX < window.innerWidth / 2
          if (isLeft) {
            prevStepOrSlide()
          } else {
            nextStepOrSlide()
          }
          syncAutoplayVideos()
        }

        function generateVideoFallbackPoster(w, h) {
          const width = Math.max(w || 640, 200)
          const height = Math.max(h || 360, 120)
          const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
            <rect width="100%" height="100%" fill="#18181b" rx="6"/>
            <circle cx="${width / 2}" cy="${height / 2}" r="32" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
            <polygon points="${width / 2 - 8},${height / 2 - 14} ${width / 2 + 14},${height / 2} ${width / 2 - 8},${height / 2 + 14}" fill="#ffffff"/>
          </svg>`
          return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`
        }

        async function captureVideoSnapshot(video) {
          if (!video) return null
          const poster = video.getAttribute("poster") || video.poster

          try {
            if (video.readyState < 2 && (video.currentSrc || video.src)) {
              video.preload = "auto"
              video.crossOrigin = "anonymous"
              try {
                video.load()
              } catch (e) {}
              await new Promise(resolve => {
                let resolved = false
                const done = () => {
                  if (!resolved) {
                    resolved = true
                    cleanup()
                    resolve()
                  }
                }
                const cleanup = () => {
                  video.removeEventListener("loadeddata", done)
                  video.removeEventListener("canplay", done)
                  video.removeEventListener("seeked", done)
                  video.removeEventListener("error", done)
                }
                video.addEventListener("loadeddata", done, { once: true })
                video.addEventListener("canplay", done, { once: true })
                video.addEventListener("seeked", done, { once: true })
                video.addEventListener("error", done, { once: true })
                setTimeout(done, 160)
              })
            }

            const vw = video.videoWidth || video.clientWidth || 640
            const vh = video.videoHeight || video.clientHeight || 360

            if (vw > 0 && vh > 0) {
              const canvas = document.createElement("canvas")
              canvas.width = vw
              canvas.height = vh
              const ctx = canvas.getContext("2d")
              if (ctx) {
                ctx.drawImage(video, 0, 0, vw, vh)
                const dataUrl = canvas.toDataURL("image/png")
                if (dataUrl && dataUrl.length > 200) {
                  return dataUrl
                }
              }
            }
          } catch (err) {
            console.warn("[slides-capture] 视频帧提取异常，降级海报处理:", err)
          }

          if (poster) return poster
          return generateVideoFallbackPoster(video.clientWidth || 640, video.clientHeight || 360)
        }

        // 幻灯片逐页导出图片核心逻辑
        async function runImageCapture(opts) {
          const mode = opts?.mode || "all"
          const scale = opts?.scale || 2
          const format = opts?.format || "png"

          if (!window.htmlToImage) {
            window.parent.postMessage({
              source: "siyuan-slides-client",
              action: "CAPTURE_ERROR",
              payload: { captureError: "沙箱内部 html-to-image 截图组件未就绪" }
            }, "*")
            return
          }

          const vp = stageContainerRef.value ? stageContainerRef.value.querySelector(".slide-viewport") : null
          if (!vp) {
            window.parent.postMessage({
              source: "siyuan-slides-client",
              action: "CAPTURE_ERROR",
              payload: { captureError: "未找到 .slide-viewport 视口元素" }
            }, "*")
            return
          }

          isCaptureCancelled = false
          isCapturingImages.value = true
          await nextTick()

          if (showOverview.value) {
            showOverview.value = false
            await nextTick()
          }

          const captureOptions = {
            pixelRatio: scale,
            width: baseWidth,
            height: baseHeight.value,
            canvasWidth: baseWidth,
            canvasHeight: baseHeight.value,
            cacheBust: false,
            filter: (node) => {
              if (node && node.tagName === "VIDEO") {
                return false
              }
              return true
            }
          }

          const captureSinglePage = async (pageIdx) => {
            currentPageIndex.value = pageIdx
            await nextTick()
            currentStep.value = maxStepInCurrentSlide.value
            await nextTick()

            try {
              if (document.fonts && document.fonts.ready) {
                await document.fonts.ready
              }
            } catch (e) {}

            await new Promise(r => setTimeout(r, 60))

            const videoEls = Array.from(vp.querySelectorAll("video"))
            const restoreVideoFns = []

            for (const video of videoEls) {
              const snapshotUrl = await captureVideoSnapshot(video)
              if (snapshotUrl) {
                const img = document.createElement("img")
                img.className = (video.className || "") + " slides-video-export-snapshot"
                img.src = snapshotUrl
                img.style.cssText = video.style.cssText
                const comp = window.getComputedStyle(video)
                img.style.display = "block"
                img.style.width = comp.width || (video.offsetWidth ? `${video.offsetWidth}px` : "100%")
                img.style.height = comp.height || (video.offsetHeight ? `${video.offsetHeight}px` : "auto")
                img.style.objectFit = comp.objectFit || "contain"
                img.style.borderRadius = comp.borderRadius || "6px"
                img.style.boxShadow = comp.boxShadow || "none"
                img.style.margin = comp.margin || "0"

                const parent = video.parentNode
                if (parent) {
                  parent.replaceChild(img, video)
                  restoreVideoFns.push(() => {
                    if (img.parentNode === parent) {
                      parent.replaceChild(video, img)
                    }
                  })
                }
              }
            }

            try {
              if (format === "jpeg") {
                return await window.htmlToImage.toJpeg(vp, { ...captureOptions, quality: 0.95 })
              }
              return await window.htmlToImage.toPng(vp, captureOptions)
            } finally {
              restoreVideoFns.forEach(fn => fn())
            }
          }

          if (mode === "current") {
            try {
              const dataUrl = await captureSinglePage(currentPageIndex.value)
              window.parent.postMessage({
                source: "siyuan-slides-client",
                action: "CAPTURE_PAGE_DONE",
                payload: {
                  captureResult: {
                    pageIndex: currentPageIndex.value,
                    dataUrl: dataUrl,
                    total: 1,
                    mode: "current"
                  }
                }
              }, "*")
            } catch (err) {
              window.parent.postMessage({
                source: "siyuan-slides-client",
                action: "CAPTURE_ERROR",
                payload: { captureError: String(err && err.message ? err.message : err) }
              }, "*")
            } finally {
              isCapturingImages.value = false
              await nextTick()
            }
            return
          }

          const originalPage = currentPageIndex.value
          const originalStep = currentStep.value
          const total = totalPages.value || 1

          try {
            for (let i = 1; i <= total; i++) {
              if (isCaptureCancelled) break

              window.parent.postMessage({
                source: "siyuan-slides-client",
                action: "CAPTURE_PROGRESS",
                payload: {
                  captureProgress: {
                    current: i,
                    total: total,
                    pageIndex: i
                  }
                }
              }, "*")

              const dataUrl = await captureSinglePage(i)
              if (isCaptureCancelled) break

              window.parent.postMessage({
                source: "siyuan-slides-client",
                action: "CAPTURE_PAGE_DONE",
                payload: {
                  captureResult: {
                    pageIndex: i,
                    dataUrl: dataUrl,
                    total: total,
                    mode: "all"
                  }
                }
              }, "*")
            }

            if (!isCaptureCancelled) {
              window.parent.postMessage({
                source: "siyuan-slides-client",
                action: "CAPTURE_COMPLETE",
                payload: { totalPages: total }
              }, "*")
            }
          } catch (err) {
            window.parent.postMessage({
              source: "siyuan-slides-client",
              action: "CAPTURE_ERROR",
              payload: { captureError: String(err && err.message ? err.message : err) }
            }, "*")
          } finally {
            currentPageIndex.value = originalPage
            await nextTick()
            currentStep.value = originalStep
            isCapturingImages.value = false
            await nextTick()
          }
        }

        // 监听来自宿主 (Plugin Host) 的 postMessage 消息
        function onHostMessage(event) {
          const data = event.data
          if (!data || data.source !== "siyuan-slides-host") return

          switch (data.action) {
            case "UPDATE_SLIDES":
              if (data.payload.customThemeCss) {
                let styleTag = document.getElementById("siyuan-custom-theme-styles")
                if (!styleTag) {
                  styleTag = document.createElement("style")
                  styleTag.id = "siyuan-custom-theme-styles"
                  document.head.appendChild(styleTag)
                }
                styleTag.textContent = data.payload.customThemeCss
              }
              if (data.payload.slides) {
                slides.value = data.payload.slides
                if (currentPageIndex.value > slides.value.length) {
                  currentPageIndex.value = Math.max(1, slides.value.length)
                }
                broadcastSync()
                notifySlideChanged()
                nextTick(() => {
                  syncAutoplayVideos()
                  setTimeout(syncAutoplayVideos, 120)
                  setTimeout(syncAutoplayVideos, 350)
                })
              }
              if (data.payload.config) {
                config.value = { ...config.value, ...data.payload.config }
                applyConfigThemeMode(config.value)
              }
              break

            case "NAVIGATE_PAGE":
              if (typeof data.payload.pageIndex === "number") {
                currentPageIndex.value = Math.max(1, Math.min(data.payload.pageIndex, totalPages.value || 1))
                currentStep.value = typeof data.payload.step === "number" ? Math.max(0, data.payload.step) : 0
                notifySlideChanged()
                broadcastSync()
                nextTick(() => {
                  syncAutoplayVideos()
                  setTimeout(syncAutoplayVideos, 120)
                  setTimeout(syncAutoplayVideos, 350)
                })
              }
              break

            case "HIGHLIGHT_ELEMENT":
              if (data.payload.targetBlockId) {
                highlightedBlockId.value = data.payload.targetBlockId
                // 如果该块在其他页，自动跳到该页
                for (let i = 0; i < slides.value.length; i++) {
                  if (slides.value[i].blocks.some(b => b.id === data.payload.targetBlockId)) {
                    if (currentPageIndex.value !== i + 1) {
                      currentPageIndex.value = i + 1
                      notifySlideChanged()
                      broadcastSync()
                    }
                    break
                  }
                }
                // 确保被聚焦选中的块在沙箱中可见（若需要特定步长才能看到）
                const rule = slideClicksPlan.value.idMap.get(data.payload.targetBlockId)
                if (rule && rule.type === "step" && currentStep.value < rule.step) {
                  currentStep.value = rule.step
                }
              }
              break

            case "NEXT_STEP":
              nextStepOrSlide()
              syncAutoplayVideos()
              break

            case "PREV_STEP":
              prevStepOrSlide()
              syncAutoplayVideos()
              break

            case "FREEZE_KEYBOARD_NAV":
              isKeyboardFrozen.value = !!data.payload?.frozen
              break

            case "FULLSCREEN_CHANGED":
              isFullscreenMode.value = !!data.payload?.isFullscreen
              nextTick(() => updateScale())
              break

            case "TOGGLE_OVERVIEW":
              toggleOverview()
              break

            case "START_IMAGE_EXPORT":
              runImageCapture(data.payload?.captureOptions)
              break

            case "CANCEL_IMAGE_EXPORT":
              isCaptureCancelled = true
              isCapturingImages.value = false
              break
          }
        }

        // 双向监听页码与总页数变动，确保沙箱与宿主始终 100% 强同步
        watch(currentPageIndex, (newVal, oldVal) => {
          if (newVal !== oldVal) {
            if (highlightedBlockId.value) {
              highlightedBlockId.value = ""
            }
            notifySlideChanged()
            if (!isExternalSyncing && !isCapturingImages.value && !isHeadless) {
              broadcastSync()
            }
          }
        })
        watch(totalPages, () => {
          notifySlideChanged()
        })
        // 幻灯片数据更新后总览缩略图缓存整体失效
        watch(slides, () => {
          resetOverviewThumbs()
        })
        watch(slides, () => {
          triggerSlideAnimations()
        })

        let activeAnimCleanups = []
        function triggerSlideAnimations() {
          activeAnimCleanups.forEach(c => { try { c() } catch(e){} })
          activeAnimCleanups = []
          nextTick(() => {
            const container = document.querySelector(".slide-viewport") || document.body
            const nodes = container.querySelectorAll("[data-slides-anim]")
            nodes.forEach(node => {
              if (node.closest(".v-click-hidden") || node.classList.contains("v-click-hidden")) return
              const animType = node.getAttribute("data-slides-anim")
              if (animType === "countup") {
                const targetEl = node.querySelector(".slides-countup-target") || node.querySelector("p, h1, h2, h3, h4, h5, h6, span, strong") || node
                if (!targetEl.getAttribute("data-anim-original")) {
                  targetEl.setAttribute("data-anim-original", targetEl.textContent || "")
                }
                const toVal = parseFloat(node.getAttribute("data-countup-to") || "0")
                const fromVal = parseFloat(node.getAttribute("data-countup-from") || "0")
                const durationVal = parseInt(node.getAttribute("data-anim-duration") || "1500", 10)
                const decimalsVal = parseInt(node.getAttribute("data-countup-decimals") || "0", 10)
                const prefixVal = node.getAttribute("data-countup-prefix") || ""
                const suffixVal = node.getAttribute("data-countup-suffix") || ""

                const cancel = startCountUp(targetEl, {
                  from: fromVal,
                  to: toVal,
                  duration: durationVal,
                  decimals: decimalsVal,
                  prefix: prefixVal,
                  suffix: suffixVal,
                })
                activeAnimCleanups.push(cancel)
              } else if (animType === "typewriter") {
                const targetEl = node.querySelector("p, h1, h2, h3, h4, h5, h6, span, code") || node
                if (!targetEl.getAttribute("data-anim-original")) {
                  targetEl.setAttribute("data-anim-original", targetEl.textContent || "")
                }
                const fullText = targetEl.getAttribute("data-anim-original") || targetEl.textContent || ""
                const durationVal = parseInt(node.getAttribute("data-anim-duration") || "1500", 10)
                const cancel = startTypewriter(targetEl, fullText, { duration: durationVal })
                activeAnimCleanups.push(cancel)
              }
            })
          })
        }

        watch([currentPageIndex, currentStep], () => {
          triggerSlideAnimations()
        })

        let resizeObserver = null
        onMounted(() => {
          window.addEventListener("keydown", onKeyDown)
          window.addEventListener("message", onHostMessage)
          window.addEventListener("wheel", onWheel, { passive: false })
          document.addEventListener("click", onDocumentClick, true)
          window.addEventListener("resize", updateScale)
          document.addEventListener("fullscreenchange", updateScale)
          window.addEventListener("pointerdown", () => syncAutoplayVideos(), { passive: true })

          if (window.ResizeObserver && stageContainerRef.value) {
            resizeObserver = new ResizeObserver(() => {
              updateScale()
            })
            resizeObserver.observe(stageContainerRef.value)
          }
          nextTick(() => {
            updateScale()
            syncAutoplayVideos()
            triggerSlideAnimations()
          })

          // 告知宿主客户端沙箱已准备就绪并上报初始页码
          window.parent.postMessage({
            source: "siyuan-slides-client",
            action: "CLIENT_READY",
            payload: {
              currentPage: currentPageIndex.value,
              totalPages: totalPages.value
            }
          }, "*")
          notifySlideChanged()
          // 独立弹出窗口或跨窗口恢复时，主动向广播信道请求在播数据与步进状态（无头沙箱绝不请求）
          try {
            if (!isHeadless && broadcastChannel && (!slides.value || slides.value.length === 0)) {
              broadcastChannel.postMessage({ type: "REQUEST_SYNC" })
            }
          } catch (e) {}
          // 同源宿主窗口主题切换时，自动同步默认背景明暗模式
          try {
            const hostRoot = window.parent && window.parent !== window ? window.parent.document?.documentElement : null
            if (hostRoot) {
              parentThemeObserver = new MutationObserver(() => {
                if (config.value?.colorSchema !== "light" && config.value?.colorSchema !== "dark") {
                  const hostMode = detectHostSiYuanThemeMode()
                  config.value = { ...config.value, hostThemeMode: hostMode }
                  isDarkTheme.value = hostMode === "dark"
                }
              })
              parentThemeObserver.observe(hostRoot, { attributes: true, attributeFilter: ["data-theme-mode", "class"] })
            }
          } catch (e) {}
        })

        onUnmounted(() => {
          window.removeEventListener("keydown", onKeyDown)
          window.removeEventListener("message", onHostMessage)
          window.removeEventListener("wheel", onWheel)
          document.removeEventListener("click", onDocumentClick, true)
          window.removeEventListener("resize", updateScale)
          document.removeEventListener("fullscreenchange", updateScale)
          if (resizeObserver) {
            resizeObserver.disconnect()
            resizeObserver = null
          }
          if (overviewObserver) {
            overviewObserver.disconnect()
            overviewObserver = null
          }
          if (parentThemeObserver) {
            parentThemeObserver.disconnect()
            parentThemeObserver = null
          }
        })

        return {
          config,
          isNormalizeHeadings,
          isHideUnorderedMarkers,
          isHideOrderedMarkers,
          slides,
          currentPageIndex,
          totalPages,
          currentSlide,
          currentStep,
          jumpDisplay,
          jumpInvalid,
          showOverview,
          overviewFocus,
          overviewGridRef,
          setOverviewCardRef,
          getOverviewCanvasStyle,
          overviewCardHeight,
          getSlideOverviewTitle,
          goFromOverview,
          closeOverview,
          highlightedBlockId,
          stageContainerRef,
          slideScale,
          isFullscreenMode,
          viewportRatioClass,
          viewportStyle,
          currentSlideZoom,
          contentWrapperStyle,
          getLayoutGridStyle,
          updateScale,
          currentThemeMode,
          currentSlideThemeMode,
          currentSlidesTheme,
          pageBackgroundStyle,
          slideImageRightStyle,
          currentSlideImageUrl,
          slideImageFailed,
          handleSlideImageError,
          transitionClass,
          headerBlocks,
          flowRows,
          leftBlocks,
          rightBlocks,
          col1Blocks,
          col2Blocks,
          col3Blocks,
          isColsHeader,
          isSuperBlockColsHeader,
          dynamicColsCount,
          multiColBlocks,
          normalBlocks,
          isDarkTheme,
          isMaxStep,
          slidesContext,
          isAbsoluteBlock,
          openInEditor,
          slideClicksPlan,
          maxStepInCurrentSlide,
          getBlockClickClass,
          getBlockMotionClass,
          getBlockMotionStyle,
          renderBlockHtml,
          nextStepOrSlide,
          prevStepOrSlide,
          toggleTheme,
          toggleFullScreen,
          onBlockClick,
          currentSpacing,
          activeLightbox,
          openLightbox,
          closeLightbox,
          lightboxScale,
          lightboxTranslateX,
          lightboxTranslateY,
          isLightboxDragging,
          lightboxImgStyle,
          onLightboxPointerDown,
          onLightboxPointerMove,
          onLightboxPointerUp,
          onLightboxImgClick,
          onLightboxBackdropClick,
          onLightboxDblClick,
          getHeadingNormalizeClass,
          currentSlideMaskConfig,
          maskLayerStyle,
          maskDividerLineStyle,
          maskOverlayStyle,
          maskDividerStyle,
          pageFirstHeadingBlock,
          bodyBlocksWithoutFirstHeading,
          factHeaderBlock,
          factStatCards,
          timelineStepItems
        }
      }
    })

    app.component('slide-block-renderer', SlideBlockRenderer)
    app.component('Toc', TocComponent)
    app.component('toc', TocComponent)
    app.component('Arrow', ArrowComponent)
    app.component('arrow', ArrowComponent)

    // 批量注册 Carbon 常用图标组件与多种命名别名
    for (const [name, svg] of Object.entries(CARBON_ICONS)) {
      const iconComp = {
        render() {
          return h('span', {
            class: 'slides-icon',
            style: { display: 'inline-flex', alignItems: 'center', verticalAlign: 'middle' },
            innerHTML: svg
          })
        }
      }
      app.component(name, iconComp)
      app.component(name.replace(':', '-'), iconComp)
      const pascal = name.split(/[:-]/).map(s => s.charAt(0).toUpperCase() + s.slice(1)).join('')
      app.component(pascal, iconComp)
    }

    app.mount("#app")
  </script>
</body>
</html>
