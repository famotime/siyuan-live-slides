            'whitesmoke', 'seashell', 'beige', 'oldlace', 'linen', 'antiquewhite',
            'lightyellow', 'lightcyan', 'papayawhip', 'blanchedalmond', 'cornsilk',
            'lavender', 'lavenderblush', 'lemonchiffon', 'honeydew', 'mintcream',
            'azure', 'mistyrose', 'wheat', 'lightgoldenrodyellow', 'palegoldenrod',
            'gainsboro', 'lightgrey', 'lightgray', 'silver', 'pink', 'lightpink',
            'peachpuff', 'navajowhite', 'moccasin', 'bisque', 'khaki', 'palegreen',
            'lightgreen', 'lightblue', 'powderblue', 'paleturquoise', 'lightsteelblue',
            'thistle', 'yellow', 'cyan', 'aqua'
          ]
          const darkNamedColors = [
            'black', 'transparent', 'navy', 'darkblue', 'midnightblue',
            'darkslategray', 'darkslategrey', 'maroon', 'darkred', 'darkgreen',
            'indigo', 'darkslateblue', 'dimgray', 'dimgrey', 'purple', 'brown',
            'olive', 'teal', 'blue', 'darkviolet', 'darkmagenta', 'darkcyan',
            'darkolivegreen', 'saddlebrown', 'sienna', 'firebrick', 'crimson',
            'mediumblue', 'rebeccapurple'
          ]
          if (lightNamedColors.includes(s)) return true
          if (darkNamedColors.includes(s)) return false

          function calcLum(r, g, b) {
            return 0.299 * r + 0.587 * g + 0.114 * b
          }
          function parseHexLum(hexRaw) {
            let hex = hexRaw.startsWith('#') ? hexRaw.slice(1) : hexRaw
            if (hex.length === 3 || hex.length === 4) {
              hex = hex.slice(0, 3).split('').map(c => c + c).join('')
            }
            if (hex.length >= 6) {
              const r = parseInt(hex.substring(0, 2), 16)
              const g = parseInt(hex.substring(2, 4), 16)
              const b = parseInt(hex.substring(4, 6), 16)
              if (!isNaN(r) && !isNaN(g) && !isNaN(b)) {
                return calcLum(r, g, b)
              }
            }
            return null
          }
          function parseRgbLum(rgbStr) {
            const m = rgbStr.match(/rgba?\s*\(\s*(\d+(?:\.\d+)?)\s*[,\s]\s*(\d+(?:\.\d+)?)\s*[,\s]\s*(\d+(?:\.\d+)?)(?:\s*[,/]\s*([0-9.]+%?))?/i)
            if (!m) return null
            const r = Number(m[1])
            const g = Number(m[2])
            const b = Number(m[3])
            if (isNaN(r) || isNaN(g) || isNaN(b)) return null
            if (m[4] !== undefined) {
              const a = m[4].endsWith('%') ? parseFloat(m[4]) / 100 : parseFloat(m[4])
              if (!isNaN(a) && a <= 0.05) return null
            }
            return calcLum(r, g, b)
          }
          function parseHslLum(hslStr) {
            const m = hslStr.match(/hsla?\s*\(\s*([0-9.]+)(?:deg)?\s*[,\s]\s*([0-9.]+)%\s*[,\s]\s*([0-9.]+)%(?:\s*[,/]\s*([0-9.]+%?))?/i)
            if (!m) return null
            if (m[4] !== undefined) {
              const a = m[4].endsWith('%') ? parseFloat(m[4]) / 100 : parseFloat(m[4])
              if (!isNaN(a) && a <= 0.05) return null
            }
            const h = (((Number(m[1]) % 360) + 360) % 360) / 360
            const sat = Math.max(0, Math.min(1, Number(m[2]) / 100))
            const lig = Math.max(0, Math.min(1, Number(m[3]) / 100))
            let r, g, b
            if (sat === 0) {
              r = g = b = lig * 255
            } else {
              const q = lig < 0.5 ? lig * (1 + sat) : lig + sat - lig * sat
              const p = 2 * lig - q
              const hue2rgb = (t) => {
                let tt = t
                if (tt < 0) tt += 1
                if (tt > 1) tt -= 1
                if (tt < 1 / 6) return p + (q - p) * 6 * tt
                if (tt < 1 / 2) return q
                if (tt < 2 / 3) return p + (q - p) * (2 / 3 - tt) * 6
                return p
              }
              r = hue2rgb(h + 1 / 3) * 255
              g = hue2rgb(h) * 255
              b = hue2rgb(h - 1 / 3) * 255
            }
            return calcLum(r, g, b)
          }

          if (s.startsWith('#')) {
            const lum = parseHexLum(s)
            return lum === null ? null : lum > 140
          }
          if (/^rgba?\s*\(/i.test(s)) {
            const lum = parseRgbLum(s)
            return lum === null ? null : lum > 140
          }
          if (/^hsla?\s*\(/i.test(s)) {
            const lum = parseHslLum(s)
            return lum === null ? null : lum > 140
          }

          // CSS 渐变背景（linear-gradient / radial-gradient / conic-gradient 等）
          if (/(?:linear|radial|conic)-gradient\s*\(/i.test(s)) {
            const luminances = []
            const hexMatches = s.match(/#(?:[0-9a-f]{8}|[0-9a-f]{6}|[0-9a-f]{4}|[0-9a-f]{3})\b/gi)
            if (hexMatches) {
              for (const h of hexMatches) {
                const lum = parseHexLum(h)
                if (lum !== null) luminances.push(lum)
              }
            }
            const rgbMatches = s.match(/rgba?\s*\([^)]+\)/gi)
            if (rgbMatches) {
              for (const r of rgbMatches) {
                const lum = parseRgbLum(r)
                if (lum !== null) luminances.push(lum)
              }
            }
            const hslMatches = s.match(/hsla?\s*\([^)]+\)/gi)
            if (hslMatches) {
              for (const h of hslMatches) {
                const lum = parseHslLum(h)
                if (lum !== null) luminances.push(lum)
              }
            }
            const stripped = s.replace(/#[0-9a-f]+|rgba?\([^)]+\)|hsla?\([^)]+\)/gi, ' ')
            const wordMatches = stripped.match(/\b[a-z]+\b/gi)
            if (wordMatches) {
              for (const w of wordMatches) {
                if (w === 'transparent') continue
                if (lightNamedColors.includes(w)) luminances.push(240)
                else if (darkNamedColors.includes(w)) luminances.push(20)
              }
            }
            if (luminances.length > 0) {
              const avg = luminances.reduce((acc, v) => acc + v, 0) / luminances.length
              return avg > 140
            }
            if (/\btransparent\b/.test(s)) return false
          }
          return null
        }

        // 当前单页计算生效的主题亮暗模式（自适应页面背景色及单页显式属性）
        const currentSlideThemeMode = computed(() => {
          if (!currentSlide.value) return currentThemeMode.value
          const fm = currentSlide.value.frontmatter || {}
          if (fm.colorSchema === "light") return "light"
          if (fm.colorSchema === "dark") return "dark"
          if (typeof fm.class === "string") {
            const classes = fm.class.split(/\s+/)
            if (classes.includes("light")) return "light"
            if (classes.includes("dark")) return "dark"
          }
          const bg = fm.background || config.value?.background
          const bgLuminance = isLightColor(bg)
          if (bgLuminance === true) return "light"
          if (bgLuminance === false) return "dark"
          return currentThemeMode.value
        })

        // 页面背景样式及自适应文字颜色变量注入
        const pageBackgroundStyle = computed(() => {
          if (!currentSlide.value) return {}
          const bg = currentSlide.value.frontmatter?.background || config.value?.background
          if (!bg) return {}
          if (bg.startsWith("http") || bg.startsWith("/") || bg.startsWith("data:") || bg.startsWith("assets/")) {
            return {
              backgroundImage: `url("${bg}")`,
              backgroundSize: "cover",
              backgroundPosition: "center"
            }
          }
          const isLight = isLightColor(bg)
          const styles = { background: bg }
          const theme = currentSlidesTheme.value || 'apple-basic'
          if (isLight === true) {
            styles['--slide-bg'] = bg
            if (theme === 'seriph') {
              styles['--slide-text'] = '#231f1d'
              styles['--slide-text-secondary'] = '#57534e'
              styles['--slide-accent'] = '#b45309'
              styles['--slide-code-bg'] = '#f5f0e6'
            } else if (theme === 'apple-basic') {
              styles['--slide-text'] = '#000000'
              styles['--slide-text-secondary'] = '#6e6e73'
              styles['--slide-accent'] = '#0071e3'
              styles['--slide-code-bg'] = '#f5f5f7'
              styles['--slide-card-bg'] = '#f5f5f7'
            } else {
              styles['--slide-text'] = '#0f172a'
              styles['--slide-text-secondary'] = '#475569'
              styles['--slide-accent'] = '#059669'
              styles['--slide-code-bg'] = '#f1f5f9'
            }
            styles.color = styles['--slide-text']
          } else if (isLight === false) {
            styles['--slide-bg'] = bg
            if (theme === 'seriph') {
              styles['--slide-text'] = '#f5f2eb'
              styles['--slide-text-secondary'] = '#a8a29e'
              styles['--slide-accent'] = '#f59e0b'
              styles['--slide-code-bg'] = '#24201c'
            } else if (theme === 'apple-basic') {
              styles['--slide-text'] = '#ffffff'
              styles['--slide-text-secondary'] = '#86868b'
              styles['--slide-accent'] = '#2997ff'
              styles['--slide-code-bg'] = '#161617'
              styles['--slide-card-bg'] = '#161617'
            } else {
              styles['--slide-text'] = '#f1f5f9'
              styles['--slide-text-secondary'] = '#94a3b8'
              styles['--slide-accent'] = '#10b981'
              styles['--slide-code-bg'] = '#0f172a'
            }
            styles.color = styles['--slide-text']
          }
          return styles
        })

        // 转场动画类
        const transitionClass = computed(() => {
          if (isCapturingImages.value) return ""
          const t = currentSlide.value?.frontmatter?.transition || config.value.defaultTransition || "slide-left"
          return `transition-${t}`
        })

        // 分栏布局块过滤（参数化布局分组：主渲染路径与缩略图总览共用同一套分组规则）
        function buildLayoutGroups(slide) {
          if (!slide) {
            return { normal: [], header: [], colsCount: 2, isSuperCols: false, multiCol: [] }
          }
          const blocks = (slide.blocks || []).filter(b => b.slot !== "slot-divider-right")
          const layout = slide.frontmatter?.layout
          // 显式 slot === "header" 无条件优先作为通栏大标题
          const explicit = blocks.filter(b => b.slot === "header")
          let header = explicit
          if (explicit.length === 0 && slide.frontmatter?.header !== false && blocks.length > 0) {
            const candidateH = blocks.find(b => {
              if (!b) return false
              if (b.slot && b.slot !== "default") return false
              if (b.type === "h" || b.type === "NodeHeading") return true
              if (/^h[1-6]$/i.test(b.subType || "")) return true
              const md = (b.rawMarkdown || b.content || "").trim()
              return /^#{1,6}\s+/.test(md)
            })
            if (candidateH) {
              header = [candidateH]
            } else if (blocks.length >= 2) {
              const firstBlock = blocks[0]
              if (!firstBlock.slot || firstBlock.slot === "default") {
                header = [firstBlock]
              }
            }
          }
          let colsCount = 2
          if (layout === 'clover') {
            colsCount = 4
          } else if (layout === 'three-cols-header') {
            colsCount = 3
          } else if (layout === 'two-cols-header') {
            colsCount = 2
          } else {
            let maxCol = 0
            for (const b of blocks) {
              const m = (b.slot || '').match(/^col-(\d+)$/i)
              if (m) maxCol = Math.max(maxCol, parseInt(m[1], 10))
            }
            if (maxCol >= 2) {
              colsCount = maxCol
            } else {
              const r = (slide.frontmatter?.layoutRatio || '').trim()
              if (r.includes(':')) {
                const parts = r.split(':').map(p => parseFloat(p.trim())).filter(n => !isNaN(n) && n > 0)
                if (parts.length >= 2) colsCount = parts.length
              }
            }
          }
          const isSuperCols = layout === "clover"
            ? true
            : (isColsHeader(layout) ? blocks.some(b => b.slot && /^col-\d+$/i.test(b.slot)) : false)
          const rem = blocks.filter(b => !header.includes(b))
          let multiCol = distributeNColumns(rem, colsCount)
          if (isSuperCols) {
            multiCol = multiCol.map(colList => {
              const valid = (colList || []).filter(b => Boolean((b.rawMarkdown || b.content || "").trim()))
              if (valid.length === 0) return valid
              const first = valid[0]
              const md = (first.rawMarkdown || first.content || "").trim()
              const isList = /^(?:[-*+]|\d+\.)\s+/.test(md) || first.type === "i" || first.type === "l"
              if (isList) {
                first.rawMarkdown = cleanCardListItemMarkdown(first.rawMarkdown || first.content || "")
                first.content = first.rawMarkdown
              }
              first.isColFirst = true
              return valid
            })
          }
          const isColSlot = (b) => {
            const s = (b.slot || "").trim().toLowerCase();
            return /^(?:col-\d+|left|center|right)$/i.test(s);
          };
          const hasExplicitCols = blocks.some(isColSlot);
          let flowRows = [];
          if (hasExplicitCols && layout !== "clover" && isColsHeader(layout)) {
            let currentKind = null;
            let currentGroup = [];
            const flush = () => {
              if (currentGroup.length === 0) return;
              if (currentKind === "fullwidth") {
                flowRows.push({ type: "fullwidth", blocks: [...currentGroup] });
              } else if (currentKind === "grid") {
                let maxCol = colsCount;
                for (const b of currentGroup) {
                  const s = (b.slot || "").trim().toLowerCase();
                  const m = s.match(/^col-(\d+)$/i);
                  if (m) maxCol = Math.max(maxCol, parseInt(m[1], 10));
                  else if (s === "right") maxCol = Math.max(maxCol, 2);
                }
                maxCol = Math.min(6, Math.max(2, maxCol));
                const cols = Array.from({ length: maxCol }, () => []);
                let curCol = 1;
                for (const b of currentGroup) {
                  if (isColSlot(b)) {
                    const s = (b.slot || "").trim().toLowerCase();
                    if (s === "left") curCol = 1;
                    else if (s === "center") curCol = 2;
                    else if (s === "right") curCol = maxCol === 2 ? 2 : maxCol;
                    else {
                      const m = s.match(/^col-(\d+)$/i);
                      if (m) curCol = parseInt(m[1], 10);
                    }
                  }
                  const safeIdx = Math.min(maxCol, Math.max(1, curCol)) - 1;
                  cols[safeIdx].push(b);
                }
                const cleanedCols = cols.map(colList => {
                  const valid = (colList || []).filter(b => Boolean((b.rawMarkdown || b.content || "").trim()));
                  if (valid.length === 0) return valid;
                  const first = valid[0];
                  const md = (first.rawMarkdown || first.content || "").trim();
                  const isList = /^(?:[-*+]|\d+\.)\s+/.test(md) || first.type === "i" || first.type === "l";
                  if (isList) {
                    first.rawMarkdown = cleanCardListItemMarkdown(first.rawMarkdown || first.content || "");
                    first.content = first.rawMarkdown;
                  }
                  first.isColFirst = true;
                  return valid;
                });
                flowRows.push({ type: "grid", cols: cleanedCols, targetCols: maxCol });
              }
              currentGroup = [];
            };
            for (const b of blocks) {
              const kind = isColSlot(b) ? "grid" : "fullwidth";
              if (currentKind === null) {
                currentKind = kind;
                currentGroup.push(b);
              } else if (currentKind === kind) {
                currentGroup.push(b);
              } else {
                flush();
                currentKind = kind;
                currentGroup.push(b);
              }
            }
            flush();
          }

          return { normal: blocks, header, colsCount, isSuperCols, multiCol, flowRows }
        }

        const layoutGroups = computed(() => buildLayoutGroups(currentSlide.value))
        const normalBlocks = computed(() => layoutGroups.value.normal)

        const headerBlocks = computed(() => layoutGroups.value.header)
        const flowRows = computed(() => layoutGroups.value.flowRows || [])

        function isColsHeader(layout) {
          return layout === 'cols-header' || layout === 'two-cols-header' || layout === 'three-cols-header' || layout === 'clover' || layout === 'two-cols';
        }

        const dynamicColsCount = computed(() => layoutGroups.value.colsCount);

        function distributeNColumns(rem, targetCols = 2) {
          const n = Math.max(2, targetCols);
          if (!rem || rem.length === 0) return Array.from({ length: n }, () => []);

          if (rem.length === 1 && rem[0].children && rem[0].children.length >= 2) {
            const ch = rem[0].children;
            const cols = Array.from({ length: n }, () => []);
            const actualN = Math.min(n, ch.length);
            const baseSize = Math.floor(ch.length / actualN);
            const extra = ch.length % actualN;
            let cur = 0;
            for (let i = 0; i < actualN; i++) {
              const take = baseSize + (i < extra ? 1 : 0);
              cols[i] = ch.slice(cur, cur + take);
              cur += take;
            }
            return cols;
          }

          if (rem.length === 1) {
            const single = rem[0];
            const text = (single.rawMarkdown || single.content || "").trim();
            const lines = text.split(/\r?\n/);
            const itemLines = lines.filter(l => /^[ \t]*[-*+]\s+|^[ \t]*\d+\.\s+/.test(l));
            if (itemLines.length >= n) {
              const cols = Array.from({ length: n }, () => []);
              let cur = 0;
              for (let i = 0; i < n; i++) {
                const remainingCols = n - i;
                const remainingItems = itemLines.length - cur;
                const take = Math.ceil(remainingItems / remainingCols);
                const itemsText = itemLines.slice(cur, cur + take).join("\n");
                cols[i] = [{
                  ...single,
                  id: i === 0 ? single.id : `${single.id}-col${i + 1}`,
                  rawMarkdown: itemsText,
                  content: itemsText,
                }];
                cur += take;
              }
              return cols;
            }
            return [[single], ...Array.from({ length: n - 1 }, () => [])];
          }

          const getColNum = (b) => {
            const s = (b.slot || '').trim();
            if (!s) return null;
            if (s === 'col-1' || s === 'left') return 1;
            if (s === 'col-2' || s === 'center') return 2;
            if (s === 'col-3') return 3;
            if (s === 'right') return n === 2 ? 2 : n;
            const m = s.match(/^col-(\d+)$/i);
            if (m) {
              const idx = parseInt(m[1], 10);
              if (idx >= 1 && idx <= n) return idx;
            }
            return null;
          };

          const explicitCols = rem.map(getColNum);
          const hasExplicitCols = explicitCols.some(c => c !== null);

          if (hasExplicitCols) {
            const cols = Array.from({ length: n }, () => []);
            let currentIdx = 1;
            for (const b of rem) {
              const directCol = getColNum(b);
              if (directCol !== null) currentIdx = directCol;
              cols[currentIdx - 1].push(b);
            }
            const hasExplicitColN = rem.some(b => /^col-\d+$/i.test((b.slot || "").trim()));
            if (!hasExplicitColN && cols[0].length === 0) {
              const nonEmptyCols = cols.filter(c => c.length > 0);
              if (nonEmptyCols.length === 1) {
                return [nonEmptyCols[0], ...Array.from({ length: n - 1 }, () => [])];
              }
            }
            return cols;
          }

          // 大纲标题分组
          const isHeading = (b) => {
            if (b.type === "h") return true;
            if (b.subType && /^h[1-6]$/i.test(b.subType)) return true;
            const md = (b.rawMarkdown || b.content || "").trim();
            return /^#{1,6}\s+/.test(md);
          };
          const headingIndices = rem.map((b, idx) => (isHeading(b) ? idx : -1)).filter(idx => idx !== -1);
          if (headingIndices.length >= n) {
            const cols = Array.from({ length: n }, () => []);
            for (let i = 0; i < n; i++) {
              const start = headingIndices[i];
              const end = i + 1 < n ? headingIndices[i + 1] : rem.length;
              cols[i] = rem.slice(start, end);
            }
            return cols;
          }

          if (rem.length >= n) {
            const cols = Array.from({ length: n }, () => []);
            let cur = 0;
            for (let i = 0; i < n; i++) {
              const remainingCols = n - i;
              const remainingItems = rem.length - cur;
              const take = Math.ceil(remainingItems / remainingCols);
              cols[i] = rem.slice(cur, cur + take);
              cur += take;
            }
            return cols;
          }

          if (rem.length > 1 && rem.length < n) {
            const cols = Array.from({ length: n }, () => []);
            for (let i = 0; i < rem.length; i++) cols[i] = [rem[i]];
            return cols;
          }



          const cols = Array.from({ length: n }, () => []);
          cols[0] = rem;
          return cols;
        }

        function distributeThreeColumns(rem) {
          const cols = distributeNColumns(rem, 3);
          return { col1: cols[0] || [], col2: cols[1] || [], col3: cols[2] || [] };
        }

        const isSuperBlockColsHeader = computed(() => layoutGroups.value.isSuperCols)

        const multiColBlocks = computed(() => layoutGroups.value.multiCol)

        const leftBlocks = computed(() => multiColBlocks.value[0] || []);
        const rightBlocks = computed(() => multiColBlocks.value[1] || []);
        const col1Blocks = computed(() => multiColBlocks.value[0] || []);
        const col2Blocks = computed(() => multiColBlocks.value[1] || []);
        const col3Blocks = computed(() => multiColBlocks.value[2] || []);

        function isHeadingBlock(b) {
          if (!b) return false;
          if (b.type === "h" || b.type === "NodeHeading") return true;
          if (b.subType && /^h[1-6]$/i.test(b.subType)) return true;
          const md = (b.rawMarkdown || b.content || "").trim();
          if (/^#{1,6}\s+/.test(md)) return true;
          if (/^(?:[-*+]|\d+\.)\s+#{1,6}\s+/.test(md)) return true;
          return false;
        }

        const pageFirstHeadingBlockId = computed(() => {
          if (!currentSlide.value) return null;
          const fm = currentSlide.value.frontmatter || {};
          if (fm.layout === "cover" || fm.layout === "image-left" || fm.layout === "image-right" || fm.layout === "fact") return null;

          if (isColsHeader(fm.layout)) {
            if (headerBlocks.value.length > 0) {
              const hb = headerBlocks.value.find(isHeadingBlock);
              if (hb) return hb.id;
            }
            return null;
          }
          const all = (currentSlide.value.blocks || []).filter(b => b.slot !== "slot-divider-right");
          const found = all.find(isHeadingBlock);
          return found ? found.id : null;
        });

        const colFirstHeadingBlockIds = computed(() => {
          const ids = new Set();
          if (!currentSlide.value) return ids;
          if (!isSuperBlockColsHeader.value) return ids;

          for (const col of multiColBlocks.value) {
            const h = col.find(isHeadingBlock);
            if (h) ids.add(h.id);
          }
          return ids;
        });

        function getHeadingNormalizeClass(block) {
          if (!config.value?.normalizeHeadingSizes) return "";
          if (!block || !currentSlide.value) return "";
          const fm = currentSlide.value.frontmatter || {};
          if (fm.layout === "cover" || fm.layout === "image-left" || fm.layout === "image-right" || fm.layout === "fact") return "";

          if (block.id === pageFirstHeadingBlockId.value) {
            return "slides-page-first-heading-block";
          }
          if (colFirstHeadingBlockIds.value.has(block.id)) {
            return "slides-col-first-heading-block";
          }
          return "";
        }

        // 幻灯片专属图文分栏图片状态与容灾回退
        const slideImageFailed = ref(false)
        const slideImageTriedFallback = ref(false)
        let slideImageTimer = null

        const currentSlideImageUrl = computed(() => {
          if (!currentSlide.value) return ""
          const img = currentSlide.value.frontmatter?.image
            || currentSlide.value.frontmatter?.background
            || config.value?.image
            || (currentPageIndex.value === 1 ? slides.value?.[0]?.frontmatter?.image : "")
          if (!img) return ""
          return String(img).trim()
        })

        // 监听页码与步骤变动，自动同步新页面上的视频播放设置与自动播放，并预热动态蒙版 GPU 合成图层
        watch(currentPageIndex, () => {
          syncAutoplayVideos()
          if (currentSlideMaskConfig.value) {
            requestAnimationFrame(() => {
              const layer = document.querySelector(".slides-mask-layer")
              if (layer) void layer.offsetHeight
            })
          }
        })
        watch(currentStep, () => {
          syncAutoplayVideos()
        })

        // 监听当前页图片变动，防挂与超时自动降级至内置高清封面
        watch(currentSlideImageUrl, (url) => {
          slideImageFailed.value = false
          slideImageTriedFallback.value = false
          if (slideImageTimer) {
            clearTimeout(slideImageTimer)
            slideImageTimer = null
          }
          if (url && (url.includes("cover.sli.dev") || url.includes("jsdelivr.net"))) {
            // 若 2.5 秒内网络请求因防火墙/丢包未完成，自动优雅降级为本地 assets/default-cover.webp
            slideImageTimer = setTimeout(() => {
              const imgEls = document.querySelectorAll(".image-right-img, .image-left-img")
              imgEls.forEach(el => {
                if (el && (!el.complete || el.naturalWidth === 0)) {
                  el.src = "./assets/default-cover.webp"
                }
              })
            }, 2500)
          }
        }, { immediate: true })

        function handleSlideImageError(e) {
          const imgEl = e?.target
          if (!imgEl) return
          const src = imgEl.src || ""

          // 1. 若为 cover.sli.dev 或 jsdelivr，优先尝试本地预制封面
          if (src.includes("cover.sli.dev") || src.includes("jsdelivr.net")) {
            if (!slideImageTriedFallback.value) {
              slideImageTriedFallback.value = true
              imgEl.src = "./assets/default-cover.webp"
              return
            }
          }

          // 2. 任意其他图片加载失败，尝试回退到本地封面
          if (!slideImageTriedFallback.value) {
            slideImageTriedFallback.value = true
            imgEl.src = "./assets/default-cover.webp"
            return
          }

          // 3. 本地也失败时展示高质感卡片
          slideImageFailed.value = true
        }

        const slideImageRightStyle = computed(() => {
          if (!currentSlideImageUrl.value) return {}
          return {
            backgroundImage: `url("${currentSlideImageUrl.value}")`,
            backgroundSize: "cover",
            backgroundPosition: "center",
            backgroundRepeat: "no-repeat"
          }
        })

        // 解析当前页内所有块的 v-click 调度计划 (Single Source of Truth)
        const slideClicksPlan = computed(() => {
          if (!currentSlide.value || !currentSlide.value.blocks) {
            return { maxStep: 0, blockMap: new Map(), idMap: new Map() }
          }

          const blockMap = new Map()
          const idMap = new Map()
          const containerBaseStepMap = new Map()
          let stepCounter = 0

          // 按页面内块的顺序遍历 (排除纯插槽分界块)
          const validBlocks = (currentSlide.value.blocks || []).filter(b => b.slot !== "slot-divider-right")

          for (const b of validBlocks) {
            if (b.parentContainerId && b.parentClicks && String(b.parentClicks).trim() !== "") {
              if (!containerBaseStepMap.has(b.parentContainerId)) {
                const rawParent = String(b.parentClicks).trim()
                if (/^\d+$/.test(rawParent)) {
                  const target = parseInt(rawParent, 10)
                  stepCounter = Math.max(stepCounter, target)
                  containerBaseStepMap.set(b.parentContainerId, target)
                } else {
                  stepCounter += 1
                  containerBaseStepMap.set(b.parentContainerId, stepCounter)
                }
              }
            }

            const hasSelfClicks = Boolean(b.clicks && String(b.clicks).trim() !== "")
            if (!hasSelfClicks) {
              if (b.parentContainerId && containerBaseStepMap.has(b.parentContainerId)) {
                const baseStep = containerBaseStepMap.get(b.parentContainerId)
                const rule = { type: "step", step: baseStep }
                blockMap.set(b, rule)
                if (b.id) idMap.set(b.id, rule)
              } else {
                const rule = { type: "always" }
                blockMap.set(b, rule)
                if (b.id) idMap.set(b.id, rule)
              }
              continue
            }

            const rawStr = String(b.clicks).trim()
            if (!rawStr) {
              // 空字符串但配置了 clicks 属性：等同于顺延 +1
              stepCounter += 1
              const rule = { type: "step", step: stepCounter }
              blockMap.set(b, rule)
              if (b.id) idMap.set(b.id, rule)
              continue
            }

            // 1. 区间定义 [min, max]
            if (rawStr.startsWith("[") && rawStr.endsWith("]")) {
              try {
                const arr = JSON.parse(rawStr)
                if (Array.isArray(arr) && arr.length >= 2) {
                  const min = Math.min(Number(arr[0]), Number(arr[1]))
                  const max = Math.max(Number(arr[0]), Number(arr[1]))
                  if (!isNaN(min) && !isNaN(max)) {
                    stepCounter = Math.max(stepCounter, max)
                    const rule = { type: "range", min, max }
                    blockMap.set(b, rule)
                    if (b.id) idMap.set(b.id, rule)
                    continue
                  }
                }
              } catch {}
            }

            // 2. 隐藏指令 hide
            if (rawStr.toLowerCase() === "hide") {
              stepCounter += 1
              const rule = { type: "hide", step: stepCounter }
              blockMap.set(b, rule)
              if (b.id) idMap.set(b.id, rule)
              continue
            }

            // 3. 相对步进 +N (如 "+1", "+2") 或布尔值 "true"
            if (/^\+\d+$/.test(rawStr) || rawStr === "true") {
              const delta = rawStr === "true" ? 1 : (parseInt(rawStr.slice(1), 10) || 1)
              stepCounter += delta
              const rule = { type: "step", step: stepCounter }
              blockMap.set(b, rule)
              if (b.id) idMap.set(b.id, rule)
              continue
            }

            // 4. 相对回退 -N (如 "-1")
            if (/^-\d+$/.test(rawStr)) {
              const delta = parseInt(rawStr.slice(1), 10) || 1
              stepCounter = Math.max(1, stepCounter - delta)
              const rule = { type: "step", step: stepCounter }
              blockMap.set(b, rule)
              if (b.id) idMap.set(b.id, rule)
              continue
            }

            // 5. 绝对步数 N (如 "1", "2", "3")
            if (/^\d+$/.test(rawStr)) {
              const target = parseInt(rawStr, 10)
              if (!isNaN(target)) {
                stepCounter = Math.max(stepCounter, target)
                const rule = { type: "step", step: target }
                blockMap.set(b, rule)
                if (b.id) idMap.set(b.id, rule)
                continue
              }
            }

            // 6. 其他兜底解析
            const parsedNum = parseInt(rawStr, 10)
            if (!isNaN(parsedNum) && parsedNum > 0) {
              stepCounter = Math.max(stepCounter, parsedNum)
              const rule = { type: "step", step: parsedNum }
              blockMap.set(b, rule)
              if (b.id) idMap.set(b.id, rule)
            } else {
              // 无法解析的非空字符，默认作为顺延一步处理
              stepCounter += 1
              const rule = { type: "step", step: stepCounter }
              blockMap.set(b, rule)
              if (b.id) idMap.set(b.id, rule)
            }
          }

          return {
            maxStep: stepCounter,
            blockMap,
            idMap
          }
        })

        function parseMaskRatio(ratioStr, defaultSteps) {
          const defSteps = defaultSteps === 4 ? 4 : 2;
          const defBps = defaultSteps === 4 ? [25, 50, 75, 100] : [50, 100];
          if (!ratioStr || typeof ratioStr !== "string") {
            return { steps: defSteps, breakpoints: defBps };
          }
          const clean = ratioStr.trim();
          if (!clean || (defaultSteps === 4 && (clean === "1:1" || clean === "1"))) {
            return { steps: defSteps, breakpoints: defBps };
          }
          const parts = clean.split(":").map(p => parseFloat(p.trim())).filter(n => !isNaN(n) && n > 0);
          if (parts.length === 0) return { steps: defSteps, breakpoints: defBps };
          if (parts.length === 1) {
            const val = Math.min(100, Math.max(1, parts[0]));
            if (val === 100) return { steps: 1, breakpoints: [100] };
            return { steps: 2, breakpoints: [Math.round(val * 100) / 100, 100] };
          }
          const isMonotonic = parts.every((val, idx) => idx === 0 || val > parts[idx - 1]);
          const maxVal = parts[parts.length - 1];
          if (isMonotonic && (maxVal === 100 || parts.some(p => p > 10))) {
            const bps = parts.map(p => Math.min(100, Math.round(p * 100) / 100));
            if (bps[bps.length - 1] < 100) bps.push(100);
            return { steps: bps.length, breakpoints: bps };
          }
          const totalWeight = parts.reduce((acc, cur) => acc + cur, 0);
          if (totalWeight <= 0) return { steps: defSteps, breakpoints: defBps };
          let accumulated = 0;
          const bps = [];
          for (let i = 0; i < parts.length; i++) {
            accumulated += parts[i];
            if (i === parts.length - 1) {
              bps.push(100);
            } else {
              bps.push(Math.round((accumulated / totalWeight) * 10000) / 100);
            }
          }
          return { steps: bps.length, breakpoints: bps };
        }

        const pageFirstHeadingBlock = computed(() => {
          if (!currentSlide.value) return null;
          if (currentSlide.value.frontmatter?.layout === 'cover') return null;
          const hid = pageFirstHeadingBlockId.value;
          if (!hid) return null;
          return (currentSlide.value.blocks || []).find(b => b.id === hid) || null;
        });

        const bodyBlocksWithoutFirstHeading = computed(() => {
          const firstH = pageFirstHeadingBlock.value;
          if (!firstH) return normalBlocks.value;
          return normalBlocks.value.filter(b => b.id !== firstH.id);
        });

        const factData = computed(() => {
          if (!currentSlide.value) return { headerBlock: null, statCards: [] };
          const all = (currentSlide.value.blocks || []).filter(b => b.slot !== "slot-divider-right" && (b.rawMarkdown || b.content || "").trim());
          if (all.length === 0) return { headerBlock: null, statCards: [] };

          let headerBlock = null;
          const explicitH = all.find(b => b.slot === "header");
          const isFirstH = all.length >= 2 && isHeadingBlock(all[0]);
          const hasSubsequentList = all.length >= 2 && (all[1].type === "l" || (all[1].children && all[1].children.length > 0) || /^(\s*)(?:[-*+]|\d+\.)\s+/m.test(all[1].rawMarkdown || ""));

          if (explicitH) {
            headerBlock = explicitH;
          } else if (isFirstH && (hasSubsequentList || all.length >= 3)) {
            headerBlock = all[0];
          }

          const rem = headerBlock ? all.filter(b => b !== headerBlock) : all;
          const cards = [];

          // 1. 优先提取列表容器
          const rawLines = [];
          if (rem.length === 1 && rem[0].children && rem[0].children.length >= 1) {
            for (const c of rem[0].children) {
              rawLines.push((c.rawMarkdown || c.content || "").trim());
            }
          } else if (rem.length === 1) {
            const lines = (rem[0].rawMarkdown || rem[0].content || "").trim().split(/\r?\n/);
            const hasListMarkers = lines.some(l => /^(\s*)(?:[-*+]|\d+\.)\s+/.test(l));
            if (hasListMarkers) {
              for (const line of lines) {
                if (/^(\s*)(?:[-*+]|\d+\.)\s+/.test(line)) {
                  rawLines.push(line.trim());
                }
              }
            }
          }

          if (rawLines.length > 0) {
            rawLines.forEach((line, idx) => {
              const cleaned = cleanCardListItemMarkdown(line).trim();
              const colonMatch = cleaned.match(/^([^\n:：]+?)(?:\s*[:：]\s*)([\s\S]+)$/);
              if (colonMatch) {
                cards.push({
                  id: `fact-stat-${idx}`,
                  value: colonMatch[1].trim(),
                  label: colonMatch[2].trim(),
                });
              } else {
                const parts = cleaned.split(/\r?\n/);
                cards.push({
                  id: `fact-stat-${idx}`,
                  value: parts[0].trim(),
                  label: parts.slice(1).join("\n").trim(),
                });
              }
            });
          } else if (rem.length >= 2) {
            const allColon = rem.every(b => /[:：]/.test(cleanCardListItemMarkdown(b.rawMarkdown || b.content || "")));
            if (allColon) {
              rem.forEach((b, idx) => {
                const cleaned = cleanCardListItemMarkdown(b.rawMarkdown || b.content || "").trim();
                const m = cleaned.match(/^([^\n:：]+?)(?:\s*[:：]\s*)([\s\S]+)$/);
                if (m) {
                  cards.push({ id: b.id || `fact-stat-${idx}`, value: m[1].trim(), label: m[2].trim() });
                } else {
                  cards.push({ id: b.id || `fact-stat-${idx}`, value: cleaned, label: "" });
                }
              });
            } else if (rem.length % 2 === 0) {
              for (let i = 0; i < rem.length; i += 2) {
                cards.push({
                  id: rem[i].id || `fact-stat-${i}`,
                  value: cleanCardListItemMarkdown(rem[i].rawMarkdown || rem[i].content || "").trim(),
                  label: cleanCardListItemMarkdown(rem[i + 1].rawMarkdown || rem[i + 1].content || "").trim(),
                });
              }
            }
          }

          if (cards.length === 0 && rem.length > 0) {
            const firstClean = cleanCardListItemMarkdown(rem[0].rawMarkdown || rem[0].content || "").trim();
            const m = firstClean.match(/^([^\n:：]+?)(?:\s*[:：]\s*)([\s\S]+)$/);
            if (m) {
              cards.push({ id: rem[0].id || "fact-stat-0", value: m[1].trim(), label: m[2].trim() });
            } else {
              const other = rem.slice(1).map(b => cleanCardListItemMarkdown(b.rawMarkdown || b.content || "").trim()).join("\n");
              cards.push({ id: rem[0].id || "fact-stat-0", value: firstClean, label: other });
            }
          }

          return { headerBlock, statCards: cards };
        });

        const factHeaderBlock = computed(() => factData.value.headerBlock);
        const factStatCards = computed(() => factData.value.statCards);

        const timelineStepItems = computed(() => {
          if (!currentSlide.value) return [];
          const all = (currentSlide.value.blocks || []).filter(b => b.slot !== "slot-divider-right");
          const firstH = pageFirstHeadingBlock.value;
          const rem = firstH ? all.filter(b => b.id !== firstH.id) : all;
          if (rem.length === 0) return [];

          // 1. 如果 rem 已经是多个独立的块（例如 AST 阶段已解包或用户写了多段）
          if (rem.length >= 2) {
            return rem.map(item => {
              const md = item.rawMarkdown || item.content || "";
              const cleaned = cleanCardListItemMarkdown(md);
              return {
                ...item,
                rawMarkdown: cleaned,
                content: cleaned,
              };
            });
          }

          // 2. 如果 rem 是单个复合列表容器块（有 children）
          const single = rem[0];
          if (single.children && single.children.length >= 2) {
            return single.children.map(child => {
              const md = child.rawMarkdown || child.content || "";
              const cleaned = cleanCardListItemMarkdown(md);
              return {
                ...child,
                rawMarkdown: cleaned,
                content: cleaned,
              };
            });
          }

          // 3. 如果 rem 是包含多行无序/有序列表文本的纯文本块
          const rawMd = (single.rawMarkdown || single.content || "").trim();
          const listLines = rawMd.split("\n").filter(l => /^(\s*)([-*+]|\d+\.)\s+/.test(l));
          if (listLines.length >= 2) {
            return listLines.map((line, idx) => {
              const text = line.replace(/^(\s*)([-*+]|\d+\.)\s+/, "").trim();
              return {
                id: `${single.id}-step-${idx}`,
                type: "p",
                rawMarkdown: text,
                content: text,
              };
            });
          }

          // 4. 单块回退
          return [single];
        });

        const currentSlideMaskConfig = computed(() => {
          if (!currentSlide.value?.frontmatter?.mask) return null;
          const maskDir = currentSlide.value.frontmatter.mask;
          const isClock = maskDir === "clockwise" || maskDir === "counter-clockwise" || maskDir === "cw" || maskDir === "ccw";
          if (maskDir !== "down" && maskDir !== "right" && !isClock) return null;
          const isClover = currentSlide.value.frontmatter.layout === "clover";
          const ratioInfo = parseMaskRatio(currentSlide.value.frontmatter.maskRatio, (isClock || isClover) ? 4 : 2);
          const style = currentSlide.value.frontmatter.maskStyle || "solid";
          const isInitialRevealed = currentSlide.value.frontmatter.maskInitial === "revealed";
          const maskSteps = isInitialRevealed ? Math.max(0, ratioInfo.steps - 1) : ratioInfo.steps;
          const normalizedDir = isClock
            ? ((maskDir === "cw" || maskDir === "clockwise") ? "clockwise" : "counter-clockwise")
            : maskDir;
          return {
            direction: normalizedDir,
            isClock,
            steps: maskSteps,
            totalSteps: ratioInfo.steps,
            breakpoints: ratioInfo.breakpoints,
            style,
            isInitialRevealed,
          };
        });

        const maskRevealedPercent = computed(() => {
          const maskCfg = currentSlideMaskConfig.value;
          if (!maskCfg) return 100;
          const step = currentStep.value;
          if (step <= 0) {
            return maskCfg.isInitialRevealed ? maskCfg.breakpoints[0] : 0;
          }
          const effectiveIdx = maskCfg.isInitialRevealed ? step : (step - 1);
          if (effectiveIdx >= maskCfg.breakpoints.length) {
            return 100;
          }
          return maskCfg.breakpoints[effectiveIdx] || 100;
        });

        const maskLayerStyle = computed(() => {
          const maskCfg = currentSlideMaskConfig.value;
          if (!maskCfg) return { display: "none" };
          const p = maskRevealedPercent.value;

          if (maskCfg.isClock) {
            return {
              transform: "none",
              opacity: p >= 100 ? 0 : 1,
              pointerEvents: "none",
            };
          }

          const isDown = maskCfg.direction === "down";
          if (p >= 100) {
            return {
              transform: isDown ? "translate3d(0, 100%, 0)" : "translate3d(100%, 0, 0)",
              opacity: 0,
              pointerEvents: "none",
            };
          }
          return {
            transform: isDown ? `translate3d(0, ${p}%, 0)` : `translate3d(${p}%, 0, 0)`,
            opacity: 1,
            pointerEvents: "none",
          };
        });

        const maskOverlayStyle = computed(() => {
          const maskCfg = currentSlideMaskConfig.value;
          if (!maskCfg || !maskCfg.isClock) return {};
          const p = maskRevealedPercent.value;
          const isCw = maskCfg.direction === "clockwise";
          const sweepDeg = Math.min(360, Math.max(0, (p / 100) * 360));
          let maskGrad = "";
          if (sweepDeg <= 0) {
            maskGrad = "conic-gradient(from 0deg at 50% 50%, #000 0deg, #000 360deg)";
          } else if (sweepDeg >= 360) {
            maskGrad = "conic-gradient(from 0deg at 50% 50%, transparent 0deg, transparent 360deg)";
          } else if (isCw) {
            maskGrad = `conic-gradient(from 270deg at 50% 50%, transparent 0deg, transparent ${sweepDeg}deg, #000 ${sweepDeg}deg, #000 360deg)`;
          } else {
            const remDeg = 360 - sweepDeg;
            maskGrad = `conic-gradient(from 0deg at 50% 50%, #000 0deg, #000 ${remDeg}deg, transparent ${remDeg}deg, transparent 360deg)`;
          }
          return {
            WebkitMaskImage: maskGrad,
            maskImage: maskGrad,
          };
        });

        const maskDividerLineStyle = computed(() => {
          const maskCfg = currentSlideMaskConfig.value;
          if (!maskCfg) return { display: "none" };
          const p = maskRevealedPercent.value;
          if (maskCfg.isClock) {
            const isCw = maskCfg.direction === "clockwise";
            const sweepDeg = Math.min(360, Math.max(0, (p / 100) * 360));
            const needleAngle = isCw ? (-180 + sweepDeg) : (-90 - sweepDeg);
            return {
              opacity: (p <= 0 || p >= 100) ? 0 : 1,
              transform: `translateY(-50%) rotate(${needleAngle}deg)`,
            };
          }
          if (p <= 0 || p >= 100) {
            return { opacity: 0 };
          }
          return { opacity: 1 };
        });

        // 兼容旧属性别名
        const maskDividerStyle = maskDividerLineStyle;

        // 获取当前页最大步数 (综合考虑 v-click 与动态蒙版展露步进)
        const maxStepInCurrentSlide = computed(() => {
          const clicksMax = slideClicksPlan.value.maxStep || 0;
          const maskCfg = currentSlideMaskConfig.value;
          if (!maskCfg) return clicksMax;
          return Math.max(clicksMax, maskCfg.steps);
        });

        const isMaxStep = computed(() => currentStep.value >= maxStepInCurrentSlide.value)

        // 判断块的 v-click 显隐状态 (支持单个数字、顺延 +1 与 [min, max] 范围区间)
        function getBlockClickClass(block) {
          if (!block) return "v-click-visible"
          const plan = slideClicksPlan.value
          const rule = plan.blockMap.get(block) || (block.id ? plan.idMap.get(block.id) : null)
          if (!rule || rule.type === "always") {
            return "v-click-visible"
          }

          if (rule.type === "range") {
            return (currentStep.value >= rule.min && currentStep.value <= rule.max)
              ? "v-click-visible"
              : "v-click-hidden"
          }

          if (rule.type === "hide") {
            return currentStep.value < rule.step
              ? "v-click-visible"
              : "v-click-hidden"
          }

          if (rule.type === "step") {
            return currentStep.value >= rule.step
              ? "v-click-visible"
              : "v-click-hidden"
          }

          return "v-click-visible"
        }

        // 解析内联 CSS 字符串为样式键值对对象
        function parseCssStyleString(styleStr) {
          if (!styleStr || typeof styleStr !== "string") return {}
          const res = {}
          const rules = styleStr.split(";")
          for (const rule of rules) {
            const colonIdx = rule.indexOf(":")
            if (colonIdx > 0) {
              const key = rule.slice(0, colonIdx).trim()
              const val = rule.slice(colonIdx + 1).trim()
              if (key && val) {
                res[key] = val
              }
            }
          }
          return res
        }

        // 获取块的微动效类及排版增强类
        function getBlockMotionClass(block) {
          const classes = []
          const rawStyle = block?.attributes?.style || block?.ial?.style || ""
          if (rawStyle) {
            classes.push("slide-styled-block")
          }

          if (block && block.motion && block.motion.preset && block.motion.preset !== "none") {
            // 若设置了 v-click 逐步呈现，仅在元素可见时触发动效
            if (!block.clicks || getBlockClickClass(block) === "v-click-visible") {
              const preset = String(block.motion.preset).toLowerCase().trim()
              classes.push("slides-motion-" + preset)
            }
          }

          if (block && block.anim && block.anim.type && block.anim.type !== "none") {
            if (!block.clicks || getBlockClickClass(block) === "v-click-visible") {
              const animType = String(block.anim.type).toLowerCase().trim()
              classes.push("slides-anim-" + animType)
              if (animType === "typewriter") {
                classes.push("slides-typewriter-cursor")
              }
            }
          }

          return classes.join(" ")
        }

        // 获取块的微动效内联样式与块级自定义样式
        function getBlockMotionStyle(block) {
          const style = {}
          if (!block) return style

          const rawStyle = block.attributes?.style || block.ial?.style || ""
          if (rawStyle) {
            Object.assign(style, parseCssStyleString(rawStyle))
          }

          if (block.motion) {
            if (typeof block.motion.duration === "number" && block.motion.duration > 0) {
              style["--motion-duration"] = block.motion.duration + "ms"
            }
            if (typeof block.motion.delay === "number" && block.motion.delay > 0) {
              style["--motion-delay"] = block.motion.delay + "ms"
            }
          }

          if (block.anim) {
            if (typeof block.anim.duration === "number" && block.anim.duration > 0) {
              style["--anim-duration"] = (block.anim.duration / 1000) + "s"
            }
            if (typeof block.anim.delay === "number" && block.anim.delay > 0) {
              style["--anim-delay"] = (block.anim.delay / 1000) + "s"
            }
          }

          return style
        }

        function escapeHtml(str) {
          return String(str || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;")
        }

        function parseShikiRanges(shikiPattern) {
          if (!shikiPattern || shikiPattern.trim() === "" || shikiPattern.trim() === "all") {
            return "all"
          }
          const set = new Set()
          const parts = shikiPattern.split("|")
          for (const part of parts) {
            const trimmed = part.trim()
            if (trimmed === "all") return "all"
            if (trimmed.includes("-")) {
              const [startStr, endStr] = trimmed.split("-")
              const start = parseInt(startStr, 10)
              const end = parseInt(endStr, 10)
              if (!isNaN(start) && !isNaN(end)) {
                for (let i = Math.min(start, end); i <= Math.max(start, end); i++) {
                  set.add(i)
                }
              }
            } else {
              const num = parseInt(trimmed, 10)
              if (!isNaN(num)) set.add(num)
            }
          }
          return set
        }

        const SAFE_INLINE_HTML_TAGS = new Set([
          "kbd", "mark", "sub", "sup", "span", "a", "br", "b", "i", "u", "s",
          "del", "em", "strong", "code", "small", "abbr", "ruby", "rt", "rp", "v-mark",
          "img", "video", "source", "picture"
        ])

        // 清洗并转换思源笔记独有的 Kramdown 行内 IAL 属性标记
        function cleanAndTransformInlineKramdown(text) {
          if (!text || typeof text !== "string") return ""

          // 1. 保护行内代码 `...`，避免误伤代码内的文字
          const codeTokens = []
          let safeText = text.replace(/`([^`]+)`/g, (match) => {
            codeTokens.push(match)
            return `%%INLINE_CODE_${codeTokens.length - 1}%%`
          })

          // 2. 移除紧跟在 HTML 闭合标签后的冗余 Kramdown Span IAL（如 </span>{: style="..."}）
          safeText = safeText.replace(/(<\/[a-zA-Z0-9_-]+>)\s*\{:[^}]*\}/g, "$1")

          // 3. 处理 Markdown 行内加粗/斜体/删除线/链接后的 {: style="..."}
          safeText = safeText.replace(/(\[[^\]]+\]\([^)]+\))\s*\{:\s*style=["']([^"']*)["'][^}]*\}/g, '<span style="$2">$1</span>')
          safeText = safeText.replace(/(\*\*[^*]+\*\*)\s*\{:\s*style=["']([^"']*)["'][^}]*\}/g, '<span style="$2">$1</span>')
          safeText = safeText.replace(/(\*[^*]+\*)\s*\{:\s*style=["']([^"']*)["'][^}]*\}/g, '<span style="$2">$1</span>')
          safeText = safeText.replace(/(~~[^~]+~~)\s*\{:\s*style=["']([^"']*)["'][^}]*\}/g, '<span style="$2">$1</span>')

          // 4. 处理纯词组/中文字符后的 {: style="..."} (例如: 领域{: style="color: red;"})
          safeText = safeText.replace(/([\p{L}\p{N}_\-]+)\s*\{:\s*style=["']([^"']*)["'][^}]*\}/gu, '<span style="$2">$1</span>')

          // 5. 移除任何剩余的行内 Kramdown 属性标记 {: ... }（如 {: custom-id="..."}、{: id="..."} 等思源元数据）
          safeText = safeText.replace(/\{:[^}]*\}/g, "")

          // 6. 还原行内代码
          safeText = safeText.replace(/%%INLINE_CODE_(\d+)%%/g, (_, idx) => codeTokens[parseInt(idx, 10)] || "")

          return safeText
        }

        function formatInlineMarkdown(text) {
          if (!text) return ""

          // 0. 清洗并保真转换思源笔记行内 Kramdown Span IAL
          const preprocessed = cleanAndTransformInlineKramdown(text)

          // 1. 抽取并保护安全内联 HTML 标签（避免被全局 escapeHtml 误伤转义）
          const tokens = []
          const tokenized = preprocessed.replace(/<\/?([a-zA-Z0-9_-]+)(?:\s+[^<>]*)?\/?>/g, (tagMatch, tagName) => {
            const lowerTag = tagName.toLowerCase()
            if (!SAFE_INLINE_HTML_TAGS.has(lowerTag)) {
              return tagMatch
            }
            // 过滤 XSS 危险事件属性
            if (/on\w+\s*=|javascript:/i.test(tagMatch)) {
              return tagMatch
            }
            // 特殊处理 <v-mark type="...">
            if (lowerTag === "v-mark") {
              const typeMatch = tagMatch.match(/type=["']?([a-zA-Z-]+)["']?/)
              const markType = typeMatch ? typeMatch[1] : "circle"
              if (tagMatch.startsWith("</")) {
                tokens.push("</mark>")
              } else {
                tokens.push(`<mark class="v-mark v-mark--${markType}">`)
              }
              return `%%SAFE_HTML_${tokens.length - 1}%%`
            }
            tokens.push(tagMatch)
            return `%%SAFE_HTML_${tokens.length - 1}%%`
          })

          // 2. 对其余文本执行标准 HTML 转义
          let res = escapeHtml(tokenized)

          // 3. 处理标准 Markdown 行内标记与思源链接标记
          // 3.0 思源块引用 ((block-id 'anchor')) / ((block-id "anchor")) / ((block-id))
          res = res.replace(/\(\(([0-9a-zA-Z-]+)(?:\s*(?:&#039;([^&#]*)&#039;|&quot;([^&]*)&quot;|'([^']*)'|"([^"]*)"|([^\)]+?)))?\s*\)\)/g, (match, blockId, singleEscaped, doubleEscaped, singleRaw, doubleRaw, plainRaw) => {
            const anchor = (singleEscaped ?? doubleEscaped ?? singleRaw ?? doubleRaw ?? plainRaw ?? "").trim()
            const text = anchor || `Ref(${blockId.slice(0, 8)})`
            return `<a href="siyuan://blocks/${blockId}" data-ref-id="${blockId}" class="slides-ref-tag">🔗 ${text}</a>`
          })

          // 3.1 行内数学公式 $formula$
          res = res.replace(/\$([^$\n]+)\$/g, '<span class="katex-inline font-math"><em>$1</em></span>')

          // 3.1.5 行内图片语法 ![alt](src)
          res = res.replace(/!\[(.*?)\]\((.*?)\)/g, (match, alt, url) => {
            const isGif = /\.gif(?:\?|$)/i.test(url)
            const cls = isGif ? "slide-inline-img list-item-gif" : "slide-inline-img"
            return `<img alt="${alt}" src="${url}" class="${cls}" />`
          })

          // 3.2 链接 [title](url) 与思源协议链接增强
          res = res.replace(/\[(.*?)\]\((.*?)\)/g, (match, title, url) => {
            if (url.startsWith("siyuan://blocks/")) {
              const blockId = url.replace("siyuan://blocks/", "").split("?")[0]
              return `<a href="${url}" data-ref-id="${blockId}" class="slides-ref-tag">🔗 ${title}</a>`
            }
            return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="slides-link">${title}</a>`
          })

          // 3.2.1 裸思源协议链接 (如 siyuan://blocks/20260625214150-d151ljw)
          res = res.replace(/(^|[\s(])(siyuan:\/\/blocks\/([0-9a-zA-Z-]+)(?:\?[^\s\)]*)?)/g, (match, prefix, url, blockId) => {
            return `${prefix}<a href="${url}" data-ref-id="${blockId}" class="slides-ref-tag">🔗 ${url}</a>`
          })

          // 3.3 加粗 **text**
          res = res.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")

          // 3.4 斜体 *text*
          res = res.replace(/\*(.*?)\*/g, "<em>$1</em>")

          // 3.5 删除线 ~~text~~
          res = res.replace(/~~(.*?)~~/g, "<del>$1</del>")

          // 3.6 行内代码 `code`
          res = res.replace(/`([^`]+)`/g, "<code>$1</code>")

          // 4. 还原受保护的安全 HTML 标签
          res = res.replace(/%%SAFE_HTML_(\d+)%%/g, (_, idxStr) => {
            const idx = parseInt(idxStr, 10)
            return tokens[idx] || ""
          })

          return res
        }

        function renderMarkdownTable(tableLines) {
          if (tableLines.length < 2) return ""
          const cleanRows = tableLines.map(line =>
            line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim())
          )
          const headerCells = cleanRows[0]
          let alignDefs = []
          let bodyStartIndex = 1

          if (cleanRows.length >= 2 && cleanRows[1].every(c => /^:?-+:?$/.test(c))) {
            alignDefs = cleanRows[1].map(c => {
              if (c.startsWith(":") && c.endsWith(":")) return "center"
              if (c.endsWith(":")) return "right"
              return "left"
            })
            bodyStartIndex = 2
          }

          const theadHtml = `<thead><tr>${headerCells.map((h, i) => {
            const align = alignDefs[i] ? ` style="text-align: ${alignDefs[i]}"` : ""
            return `<th${align}>${formatInlineMarkdown(h)}</th>`
          }).join("")}</tr></thead>`

          const tbodyRows = cleanRows.slice(bodyStartIndex).map(row => {
            return `<tr>${row.map((cell, i) => {
              const align = alignDefs[i] ? ` style="text-align: ${alignDefs[i]}"` : ""
              return `<td${align}>${formatInlineMarkdown(cell)}</td>`
            }).join("")}</tr>`
          }).join("")

          return `<table class="slide-table">${theadHtml}<tbody>${tbodyRows}</tbody></table>`
        }

        // 渲染 Markdown 列表（支持单项、多项、有序/无序、任务清单及带有前导说明段落的混合结构）
        function renderMarkdownList(md, block) {
          const lines = md.split("\n")
          const hasListItems = lines.some(line => /^(\s*)([-*+]|\d+\.)\s+/.test(line))
          if (!hasListItems) {
            // 防御性兜底：若当前块为列表项 (isListItem || type === 'i') 且非分栏首行标题 (isColFirst)，
            // 即使由于各种原因丢失了前缀符号，也强制作为单项列表包裹在 <ul><li> 中输出，
            // 彻底杜绝列表项退化为段落导致左侧缩进对齐不一致
            if ((block?.isListItem || block?.type === 'i') && !block?.isColFirst) {
              return `<ul class="slide-list slide-list--unordered">\n<li class="slide-list-item">${formatInlineMarkdown(md)}</li>\n</ul>`
            }
            return null
          }

          const leadLines = []
          const items = []
          let isOrdered = false

          for (let i = 0; i < lines.length; i++) {
            const line = lines[i]
            if (!line.trim()) continue

            const taskMatch = line.match(/^(\s*)[-*+]\s+\[([ xX])\]\s+(.*)$/)
            if (taskMatch) {
              const indent = taskMatch[1].length
              const level = Math.floor(indent / 2)
              items.push({
                type: 'task',
                level,
                checked: taskMatch[2].toLowerCase() === 'x',
                text: taskMatch[3],
                media: []
              })
              continue
            }

            const unorderedMatch = line.match(/^(\s*)[-*+]\s+(.*)$/)
            if (unorderedMatch) {
              const indent = unorderedMatch[1].length
              const level = Math.floor(indent / 2)
              items.push({
                type: 'unordered',
                level,
                text: unorderedMatch[2],
                media: []
              })
              continue
            }

            const orderedMatch = line.match(/^(\s*)\d+\.\s+(.*)$/)
            if (orderedMatch) {
              if (items.length === 0) isOrdered = true
              const indent = orderedMatch[1].length
              const level = Math.floor(indent / 2)
              items.push({
                type: 'ordered',
                level,
                text: orderedMatch[2],
                media: []
              })
              continue
            }

            const trimmed = line.trim()
            if (!trimmed || /^\{:.*?\}$/.test(trimmed)) continue

            // 检查列表项下属的缩进多媒体（GIF、普通图片或视频）
            if (items.length > 0) {
              const mdImgMatch = trimmed.match(/^!\[(.*?)\]\((.*?)\)(?:\{:?[^}]*\})?$/)
              if (mdImgMatch) {
                const isGif = /\.gif(?:\?|$)/i.test(mdImgMatch[2])
                const cls = isGif ? "list-item-gif" : "list-item-img"
                if (!items[items.length - 1].media) items[items.length - 1].media = []
                items[items.length - 1].media.push(
                  `<div class="slide-list-media"><img alt="${escapeHtml(mdImgMatch[1])}" src="${mdImgMatch[2]}" class="${cls}" /></div>`
                )
                continue
              }

              const htmlImgMatch = trimmed.match(/^<img\b[\s\S]*?\/?>$/i)
              if (htmlImgMatch) {
                let cleanImgHtml = trimmed.replace(/\s+style="[^"]*"/gi, "")
                if (!items[items.length - 1].media) items[items.length - 1].media = []
                items[items.length - 1].media.push(
                  `<div class="slide-list-media">${cleanImgHtml}</div>`
                )
                continue
              }

              if (/<video\b/i.test(trimmed)) {
                let videoRaw = trimmed
                if (!/<\/video>/i.test(videoRaw)) {
                  while (i + 1 < lines.length && !/<\/video>/i.test(videoRaw)) {
                    i++
                    videoRaw += " " + lines[i].trim()
                  }
                }
                const isAutoplay = block?.attributes?.["custom-slides-autoplay"] === "true" || /autoplay/i.test(videoRaw)
                const isLoop = block?.attributes?.["custom-slides-loop"] === "true" || /loop/i.test(videoRaw)
                const isMuted = block?.attributes?.["custom-slides-muted"] === "true" || isAutoplay || /muted/i.test(videoRaw)
                const hideControls = block?.attributes?.["custom-slides-controls"] === "false"

                const srcMatch = videoRaw.match(/\bsrc=["']([^"']+)["']/i)
                const src = srcMatch ? srcMatch[1] : ""

                const attrParts = ['class="slide-video-player"']
                if (!hideControls) attrParts.push("controls")
                if (isAutoplay) {
                  attrParts.push("autoplay")
                  attrParts.push("playsinline")
                }
                if (isLoop) attrParts.push("loop")
                if (isMuted) attrParts.push("muted")
                attrParts.push('preload="auto"')
                if (src) attrParts.push(`src="${src}"`)

                const innerContentMatch = videoRaw.match(/<video[^>]*>([\s\S]*?)<\/video>/i)
                let innerContent = innerContentMatch ? innerContentMatch[1].trim() : ""
                if (!innerContent && src) {
                  innerContent = `<source src="${src}" type="video/mp4" />您的浏览器不支持视频播放。`
                }

                if (!items[items.length - 1].media) items[items.length - 1].media = []
                items[items.length - 1].media.push(
                  `<div class="slide-list-media slide-video-container slide-media-container" data-autoplay="${isAutoplay ? 'true' : 'false'}" data-muted="${isMuted ? 'true' : 'false'}"><video ${attrParts.join(" ")}>${innerContent}</video></div>`
                )
                continue
              }

              items[items.length - 1].text += '\n' + trimmed
            } else {
              leadLines.push(trimmed)
            }
          }

          if (items.length === 0) return null

          function formatListItemContent(rawText) {
            if (!rawText) return ""
            const lines = rawText.split("\n").map(l => l.trim()).filter(Boolean)
            if (lines.length === 0) return ""

            const hasHeading = lines.some(line => /^#{1,6}\s+/.test(line))
            if (!hasHeading) {
              return lines.map(l => formatInlineMarkdown(l)).join("<br/>")
            }

            const resultParts = []
            let pendingParaLines = []

            const flushParagraph = () => {
              if (pendingParaLines.length > 0) {
                const pText = pendingParaLines.map(l => formatInlineMarkdown(l)).join("<br/>")
                resultParts.push(`<p class="slide-list-item-desc">${pText}</p>`)
                pendingParaLines = []
              }
            }

            for (const line of lines) {
              const headingMatch = line.match(/^(#{1,6})\s+(.*)$/)
              if (headingMatch) {
                flushParagraph()
                const level = headingMatch[1].length
                const headingText = headingMatch[2].trim()
                resultParts.push(`<h${level} class="slide-list-item-title">${formatInlineMarkdown(headingText)}</h${level}>`)
              } else {
                pendingParaLines.push(line)
              }
            }
            flushParagraph()

            return resultParts.join("\n")
          }

          function formatLeadContent(lines) {
            if (lines.length === 0) return ""
            const resultParts = []

            // 1. 首行独立作为栏目标题
            const firstLine = lines[0]
            const firstHMatch = firstLine.match(/^(#{1,6})\s+(.*)$/)
            if (firstHMatch) {
              const level = firstHMatch[1].length
              const headingText = firstHMatch[2].trim()
              resultParts.push(`<h${level} class="slide-list-item-title">${formatInlineMarkdown(headingText)}</h${level}>`)
            } else {
              resultParts.push(`<p class="slide-list-item-title">${formatInlineMarkdown(firstLine)}</p>`)
            }

            // 2. 剩余行作为说明段落，自然换行
            if (lines.length > 1) {
              const descLines = lines.slice(1)
              let pendingParaLines = []

              const flushParagraph = () => {
                if (pendingParaLines.length > 0) {
                  const pText = pendingParaLines.map(l => formatInlineMarkdown(l)).join("<br/>")
                  resultParts.push(`<p class="slide-list-item-desc">${pText}</p>`)
                  pendingParaLines = []
                }
              }

              for (const line of descLines) {
                const headingMatch = line.match(/^(#{1,6})\s+(.*)$/)
                if (headingMatch) {
                  flushParagraph()
                  const level = headingMatch[1].length
                  const headingText = headingMatch[2].trim()
                  resultParts.push(`<h${level} class="slide-list-item-title">${formatInlineMarkdown(headingText)}</h${level}>`)
                } else {
                  pendingParaLines.push(line)
                }
              }
              flushParagraph()
            }

            return resultParts.join("\n") + (resultParts.length > 0 ? "\n" : "")
          }

          const listTag = isOrdered ? 'ol' : 'ul'
          const listClass = isOrdered ? 'slide-list slide-list--ordered' : 'slide-list slide-list--unordered'
          const itemsHtml = items.map(item => {
            const formatted = formatListItemContent(item.text)
            const mediaHtml = (item.media && item.media.length > 0)
              ? `\n${item.media.join("\n")}`
              : ""
            const level = item.level || 0
            const nestedStyle = level > 0
              ? ` style="margin-left:${(level * 1.25).toFixed(2)}em;${item.type === 'unordered' ? `list-style-type:${level % 2 === 1 ? 'circle' : 'square'} !important;` : ''}"`
              : ""
            const nestedClass = level > 0 ? " slide-list-item--nested" : ""
            const clsAttr = `slide-list-item${nestedClass}`
            if (item.type === 'task') {
              const checkedAttr = item.checked ? ' checked=""' : ''
              return `<li class="${clsAttr} slide-task-item"${nestedStyle}><label><input type="checkbox" disabled=""${checkedAttr}/> <span>${formatted}</span></label>${mediaHtml}</li>`
            }
            return `<li class="${clsAttr}"${nestedStyle}>${formatted}${mediaHtml}</li>`
          }).join('\n')

          const leadHtml = formatLeadContent(leadLines)

          return `${leadHtml}<${listTag} class="${listClass}">\n${itemsHtml}\n</${listTag}>`
        }

        function normalizeClientMaxHeight(val) {
          if (!val) return ""
          const s = String(val).trim()
          if (!s) return ""
          if (/^\d+$/.test(s)) return s + "px"
          if (/^(\d+(?:\.\d+)?)%$/.test(s)) return s.replace("%", "cqh")
          if (/^(\d+(?:\.\d+)?)vh$/.test(s)) return s.replace("vh", "cqh")
          return s
        }

        // 高保真 Markdown / 块级转换
        function renderBlockHtml(block) {
          if (!block) return ""
          const md = (block.rawMarkdown || block.content || "").trim()
          if (!md) return ""

          // 1. 已解析的思源引用与内联 HTML 结构直接原样保留
          if (md.startsWith('<div class="slides-block-ref"')) {
            return md
          }
          if (md.startsWith('<a ') && md.endsWith('</a>') && md.includes('class="slides-ref-tag"')) {
            return `<p>${md}</p>`
          }

          // 2. 独立公式块 $$...$$
          if (md.startsWith("$$") && md.endsWith("$$")) {
            const formula = md.slice(2, -2).trim()
            return `<div class="katex-display-container"><div class="katex-display font-math"><em>${escapeHtml(formula)}</em></div></div>`
          }

          // 3. 标题 h1 ~ h6
          const hMatch = md.match(/^(#{1,6})\s+(.*)$/)
          if (hMatch) {
            const level = hMatch[1].length
            const hClass = (block?.isColFirst) ? ' class="slide-list-item-title"' : ''
            return `<h${level}${hClass}>${formatInlineMarkdown(hMatch[2])}</h${level}>`
          }

          // 4. Callout 警示框 ::: info / tip / warning / danger
          if (md.startsWith(":::")) {
            const lines = md.split("\n")
            const type = lines[0].replace(/^:::\s*/, "").trim() || "info"
            const body = lines.slice(1, lines[lines.length - 1].startsWith(":::") ? -1 : undefined).join("\n")
            return `<div class="slide-callout slide-callout--${type}"><div class="slide-callout-title">${type.toUpperCase()}</div><div>${formatInlineMarkdown(body)}</div></div>`
          }

          // 4.5 外部代码切片语法 <<< @/snippets/external.ts#snippet
          if (md.startsWith("<<<")) {
            const starterCode = `// Inside ./snippets/external.ts\nexport function emptyArray<T>(length: number) {\n  return Array.from<T>({ length })\n}`
            const lines = starterCode.split("\n")
            const formattedLines = lines.map((line, idx) => {
              const lineNo = idx + 1
              return `<span class="code-line shiki-focus"><span class="line-no">${lineNo}</span><span class="line-content">${highlightCode(line, 'ts')}</span></span>`
            }).join("\n")
            const rawMaxHeight = block?.attrs?.["custom-slides-max-height"] || block?.attributes?.["custom-slides-max-height"] || block?.maxHeight || ""
            const customMaxHeight = normalizeClientMaxHeight(rawMaxHeight)
            const heightStyle = customMaxHeight ? ` style="max-height:${customMaxHeight};overflow-y:auto;"` : ""
            return `<pre class="shiki-container"${heightStyle}><span class="lang-badge">TS</span><code>${formattedLines}</code></pre>`
          }

          // 4.6 隐藏内联 style 标签与非结构化注释块
          if (md.startsWith("<style") || md.startsWith("<!-- Inline style -->") || md.startsWith("<!--\nNotes")) {
            return ""
          }

          // 5. 代码块转换与 Shiki 聚光行号聚焦高亮、文件名标签、TwoSlash 与语法高亮
          if (md.startsWith("```")) {
            const lines = md.split("\n")
            const headerLine = lines[0].slice(3).trim()
            const langMatch = headerLine.match(/^([^\s{\[]+)/)
            const lang = langMatch ? langMatch[1] : ""
            const filenameMatch = headerLine.match(/\[([^\]]+)\]/)
            const filename = filenameMatch ? filenameMatch[1] : ""
            const isTwoslash = headerLine.includes("twoslash")

            const shikiPattern = block.shikiLines || (headerLine.match(/\{([^}]+)\}/)?.[1] || "")
            const focusSet = parseShikiRanges(shikiPattern)

            const rawCodeLines = lines.length > 2
              ? (lines[lines.length - 1] === "```" ? lines.slice(1, -1) : lines.slice(1))
              : [md.slice(3).replace(/```$/, "")]

            const hasSpotlight = focusSet !== "all"
            const formattedLines = rawCodeLines.map((line, idx) => {
              const lineNo = idx + 1
              const isFocused = focusSet === "all" || focusSet.has(lineNo)
              const lineClass = isFocused ? "code-line shiki-focus" : (hasSpotlight ? "code-line shiki-dimmed" : "code-line")
              
              let highlightedContent = highlightCode(line, lang)

              // TwoSlash 特殊错误标注模拟（针对 doubled.value = 2）
              if (isTwoslash && line.includes("doubled.value = 2")) {
                highlightedContent = highlightedContent.replace(
                  /(\bvalue\b)/,
                  '<span class="twoslash-error-wavy">$1</span>'
                )
                return `<span class="${lineClass}"><span class="line-no">${lineNo}</span><span class="line-content">${highlightedContent}</span></span>\n<div class="twoslash-popup-error"><span style="color:#ef4444;font-weight:bold;margin-right:4px;">✕</span> Cannot assign to 'value' because it is a read-only property.</div>`
              }

              return `<span class="${lineClass}"><span class="line-no">${lineNo}</span><span class="line-content">${highlightedContent}</span></span>`
            }).join("\n")

            const langBadge = lang ? `<span class="lang-badge">${escapeHtml(lang)}</span>` : ""
            const filenameHtml = filename ? `<span class="code-filename">${escapeHtml(filename)}</span>` : ""
            const containerClass = filename ? "shiki-container has-filename" : "shiki-container"
            
            // 步进控制指示条（仅在包含多步聚光高亮时呈现）
            const sliderHtml = headerLine.includes("|")
              ? `<div class="shiki-slider-controls"><button class="shiki-slider-btn">◀</button><div class="shiki-slider-bar"><div class="shiki-slider-fill"></div></div><button class="shiki-slider-btn">▶</button></div>`
              : ""

            const rawMaxHeight = block?.attrs?.["custom-slides-max-height"] || block?.attributes?.["custom-slides-max-height"] || block?.maxHeight || ""
            const customMaxHeight = normalizeClientMaxHeight(rawMaxHeight)
            const heightStyle = customMaxHeight ? ` style="max-height:${customMaxHeight};overflow-y:auto;"` : ""

            return `<pre class="${containerClass}"${heightStyle}>${filenameHtml}${langBadge}<code>${formattedLines}</code>${sliderHtml}</pre>`
          }

          // 6. Markdown 表格
          if (md.includes("|") && md.split("\n").filter(l => l.trim().startsWith("|")).length >= 2) {
            const tableLines = md.split("\n").filter(l => l.trim().startsWith("|"))
            return renderMarkdownTable(tableLines)
          }

          // 7. 引用转换
          if (md.startsWith("> ")) {
            return `<blockquote><p>${formatInlineMarkdown(md.slice(2))}</p></blockquote>`
          }

          // 7.5 MP4 视频与多媒体播放块
          const isVideoTag = /<video\b/i.test(md) || block?.type === "video" || block?.type === "NodeVideo"
          const hasListPrefix = /^(\s*)([-*+]|\d+\.)\s+/m.test(md)
          const hasHeadingTag = /(?:^|\n)\s*#{1,6}\s+/.test(md)
          if (isVideoTag && !hasListPrefix && !hasHeadingTag && !md.includes("\n")) {
            const isAutoplay = block?.attributes?.["custom-slides-autoplay"] === "true" || /autoplay/i.test(md)
            const isLoop = block?.attributes?.["custom-slides-loop"] === "true" || /loop/i.test(md)
            const isMuted = block?.attributes?.["custom-slides-muted"] === "true" || isAutoplay || /muted/i.test(md)
            const hideControls = block?.attributes?.["custom-slides-controls"] === "false"

            const srcMatch = md.match(/\bsrc=["']([^"']+)["']/i)
            const src = srcMatch ? srcMatch[1] : ""

            const attrParts = ['class="slide-video-player"']
            if (!hideControls) attrParts.push("controls")
            if (isAutoplay) {
              attrParts.push("autoplay")
              attrParts.push("playsinline")
            }
            if (isLoop) attrParts.push("loop")
            if (isMuted) attrParts.push("muted")
            attrParts.push('preload="auto"')
            if (src) {
              attrParts.push(`src="${src}"`)
            }

            const innerContentMatch = md.match(/<video[^>]*>([\s\S]*?)<\/video>/i)
            let innerContent = innerContentMatch ? innerContentMatch[1].trim() : ""
            if (!innerContent && src) {
              innerContent = `<source src="${src}" type="video/mp4" />您的浏览器不支持视频播放。`
            }

            return `<div class="slide-video-container slide-media-container" data-autoplay="${isAutoplay ? 'true' : 'false'}" data-muted="${isMuted ? 'true' : 'false'}"><video ${attrParts.join(" ")}>${innerContent}</video></div>`
          }

          // 8. 图片语法 ![alt](src)
          const imgMatch = md.match(/^!\[(.*?)\]\((.*?)\)$/)
          if (imgMatch) {
            return `<div class="slide-media-container"><img alt="${escapeHtml(imgMatch[1])}" src="${imgMatch[2]}" class="slide-media-img" /></div>`
          }

          // 9. 任务列表与有序/无序列表（支持单项、多项完整渲染）
          const listHtml = renderMarkdownList(md, block)
          if (listHtml) {
            return listHtml
          }

          // 10. Toc 目录组件
          if (/<(?:Toc|toc)\b/i.test(md)) {
            const minDepthMatch = md.match(/minDepth=["']?(\d+)["']?/i)
            const maxDepthMatch = md.match(/maxDepth=["']?(\d+)["']?/i)
            const colMatch = md.match(/columns=["']?(\d+)["']?/i)
            return renderTocHtml(slides.value, currentPageIndex.value, {
              minDepth: minDepthMatch ? parseInt(minDepthMatch[1], 10) : 1,
              maxDepth: maxDepthMatch ? parseInt(maxDepthMatch[1], 10) : Infinity,
